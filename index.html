<style>
/* Layout idea: a phone-first training app on a dark canvas. Raised cards, one colour per workout type,
   a floating four-tab bar (Today · Plan · Recovery · Training), and a setup flow that builds the plan. */
:root{
  --bg:#0A0B0F; --surface:#14161C; --sunk:#1E212B; --ink:#F5F6FA; --muted:#9CA3B4; --line:#2A2E3A;
  --accent:#800000; --accent-2:#D4585C; --accent-soft:#2B0B0D;
  --easy:#22D3EE; --long:#34D399; --work:#FACC15; --race:#FF4D5E; --lift:#FF6FB5; --rest:#7C8499; --swim:#60A5FA; --bike:#A3E635; --hyrox:#FB7185;
  --good:#34D399; --warn:#FACC15; --crit:#FF5C6C;
  --raise:linear-gradient(180deg,#1A1D26 0%,#13151B 100%);
  --sh:0 1px 0 rgba(255,255,255,.05) inset,0 12px 28px rgba(0,0,0,.38);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y pinch-zoom;overscroll-behavior-y:none}
body{touch-action:pan-x pan-y pinch-zoom}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
html,body{overflow-x:clip;max-width:100%}
body{margin:0;color:var(--ink);font:15px/1.55 var(--f-body);font-variant-numeric:tabular-nums;
  background:var(--bg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display);letter-spacing:-.02em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(118px + env(safe-area-inset-bottom,0px));display:grid;gap:28px;align-content:start;min-height:100vh;min-height:calc(100lvh + 1px)}

/* header */
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:5px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-2),var(--accent));flex:none}
.logo svg{width:20px;height:20px} .logo svg.mark{width:12px;height:26px;color:#fff} .logo.hdr{width:auto;background:none;padding:0 2px} .logo.hdr svg.mark{width:16px;height:34px} .brand b.word{font-weight:900;letter-spacing:.08em}
.brand b{font:800 19px/1 var(--f-display);letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:4px 10px;font:600 12px/1.2 var(--f-body);background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.demo{background:color-mix(in srgb,var(--work) 16%,transparent);color:var(--work)}
.iconbtn{margin-left:auto;width:40px;height:40px;border-radius:6px;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--ink);flex:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cards */
.card{background:var(--surface);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;display:grid;gap:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;min-width:0}
.card-h .ic{display:none}
.card-h .lbl{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.card-h .lbl{color:var(--ink)}
.card-h .r{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.sec-t{font:700 24px/1.15 var(--f-display);letter-spacing:-.03em}
.sub{color:var(--muted);font-size:14px}

/* greeting */
.hello h1{font:800 30px/1.1 var(--f-display);letter-spacing:-.035em}
.hello .kick{margin:0 0 6px;font:700 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
.hello .sub{margin-top:6px}
.count{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.racecd{margin-top:16px;background:var(--surface);border:1px solid rgba(255,255,255,.06);border-top:3px solid var(--race);border-radius:8px;padding:14px 16px 13px;display:grid;gap:8px}
.rc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rc-top small{font:700 11.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--race);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-top span{font:600 13px/1.2 var(--f-body);color:var(--muted);white-space:nowrap}
.rc-n{display:flex;align-items:baseline;gap:10px}
.rc-n b{font:800 48px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
.rc-n span{font:600 15px/1.2 var(--f-body);color:var(--muted)}
.rc-bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}.rc-bar i{display:block;height:100%;background:var(--race);border-radius:2px}
.rc-foot{display:flex;justify-content:space-between;gap:10px;font:500 12.5px/1.2 var(--f-body);color:var(--muted)}

/* session hero */
.t-easy{--tc:var(--easy)} .t-long{--tc:var(--long)} .t-workout{--tc:var(--work)} .t-race{--tc:var(--race)} .t-lift{--tc:var(--lift)} .t-rest{--tc:var(--rest)} .t-swim{--tc:var(--swim)} .t-bike{--tc:var(--bike)} .t-hyrox{--tc:var(--hyrox)}
.hero{padding:0;overflow:hidden;gap:0}
.hero-h{padding:22px 20px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 64%,#000) 0%,color-mix(in srgb,var(--tc) 24%,#0A0B0F) 100%);display:flex;align-items:flex-start;gap:12px}
.hero-h .d{font:800 30px/1.05 var(--f-display);letter-spacing:-.035em}
.hero-h .dd{color:rgba(255,255,255,.85);font-size:13px;margin-top:4px}
.hero-h .chip{margin-left:auto;background:rgba(10,11,15,.42);color:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:6px;padding:5px 11px;font:600 12.5px/1.2 var(--f-body);white-space:nowrap;background:color-mix(in srgb,var(--tc,var(--muted)) 20%,transparent);color:var(--tc,var(--ink))}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hero-b{padding:20px;display:grid;gap:16px}
.sess + .sess{border-top:1px solid var(--line);padding-top:18px}
.sess{display:grid;gap:12px}
.sess-t{font:700 21px/1.2 var(--f-display);letter-spacing:-.02em}
.stats{display:flex;flex-wrap:wrap;gap:10px 0}
.stats div{display:flex;flex-direction:column-reverse;gap:2px;padding-right:18px;margin-right:18px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0;margin-right:0;padding-right:0}
.stats b{font:700 21px/1.2 var(--f-display);color:var(--tc,var(--ink));letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:baseline;line-height:1.5}
.steps li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--tc,var(--muted));transform:translateY(-2px)}
.steps b.pc{background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent);color:var(--tc,var(--accent));border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.why{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:12px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;border:0;background:var(--sunk);font-weight:600;color:var(--ink);transition:background-color .15s,opacity .15s,transform .15s}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled){background:#272B37}.btn.primary:hover:not(:disabled){background:#9A1010}}

/* fuel tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--sunk);border-radius:7px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.tile span{font-size:12.5px;color:var(--muted)}
.tile b{font:800 26px/1.15 var(--f-display);letter-spacing:-.03em}
.tile small{font-size:12px;color:var(--muted)}
.c-cal b{color:var(--accent-2)} .c-pro b{color:var(--lift)} .c-carb b{color:var(--work)} .c-fat b{color:var(--easy)}

/* progress */
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--easy),var(--accent))}

/* mini (tomorrow) */
.mini{display:flex;align-items:center;gap:14px;background:var(--sunk);border-radius:7px;padding:14px 16px;border-left:4px solid var(--tc,var(--rest))}
.mini div{min-width:0}
.mini b{display:block;font-weight:600}
.mini span{font-size:13px;color:var(--muted)}

/* connect */
.connect{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);font-weight:600}
.cbtn i{width:10px;height:10px;border-radius:50%}

/* plan tab */
.weekhead{display:flex;align-items:center;gap:10px}
.weekhead .mid{flex:1;text-align:center;min-width:0}
.weekhead .mid b{display:block;font:700 18px/1.2 var(--f-display)}
.weekhead .mid span{font-size:13px;color:var(--muted)}
.arrow{width:42px;height:42px;border-radius:6px;border:0;background:var(--sunk);font-size:20px;line-height:1;flex:none}
.arrow:disabled{opacity:.35}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sd{border:1px solid transparent;background:var(--sunk);border-radius:6px;padding:9px 0 8px;display:grid;justify-items:center;gap:4px;min-width:0}
.sd span{font:600 11px/1 var(--f-body);color:var(--muted)}
.sd b{font:700 16px/1 var(--f-display)}
.sd i{width:18px;height:4px;border-radius:3px;background:var(--tc,var(--line))}
.sd.now{border-color:var(--ink)}
.sd.on{background:var(--tc,var(--accent));color:#0A0B0F;box-shadow:0 8px 20px color-mix(in srgb,var(--tc,var(--accent)) 42%,transparent)}
.sd.on span,.sd.on b{color:#0A0B0F} .sd.on:not([class*="t-"]) span,.sd.on:not([class*="t-"]) b{color:#fff} .sd.on i{background:rgba(10,11,15,.55)}
.wkstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wkstats div{background:var(--sunk);border-radius:6px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.wkstats span{font-size:12px;color:var(--muted)} .wkstats b{font:800 20px/1.2 var(--f-display)}
.days{display:grid;gap:14px}
.day{padding:0;overflow:hidden;gap:0;scroll-margin-top:16px}
.day.today{box-shadow:0 0 0 1px var(--accent),0 12px 30px rgba(190,50,55,.2)}
.day-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,#14161C),color-mix(in srgb,var(--tc) 7%,#14161C))}
.day-h b{font:700 17px/1.2 var(--f-display);color:var(--tc);white-space:nowrap} .day-h > div{min-width:0} .day-h > div > span{white-space:nowrap}
.day-h span{font-size:13px;color:var(--muted)}
.day-h .chip{margin-left:auto}
.day-b{padding:16px 18px;display:grid;gap:14px}
.day-b .sess-t{font-size:17px}
.day-b .stats b{font-size:17px}
.okmark{display:inline-flex;align-items:center;gap:5px;color:var(--good);font-size:13px;font-weight:600}

/* recovery */
.banner{border-radius:7px;padding:12px 14px;font-size:14px;background:color-mix(in srgb,var(--work) 12%,transparent);border:1px solid color-mix(in srgb,var(--work) 32%,transparent)}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.rg{display:grid;justify-items:center;gap:6px;padding:4px 6px;min-width:0}
.rg + .rg{border-left:1px solid var(--line)}
.rg-w{position:relative;width:min(100%,104px);aspect-ratio:1}
.rg-w svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.rg-w b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px/1 var(--f-display);white-space:nowrap}
.rg > span{font:700 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.rg > small{font-size:12px;color:var(--muted);text-align:center}
.verdict{border-radius:7px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--good) 24%,#14161C),#14161C 75%);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);display:grid;gap:4px}
.verdict b{font:700 19px/1.2 var(--f-display);color:var(--good)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.rules li i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--c)}

/* training */
.preds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preds div{background:var(--sunk);border-radius:6px;padding:12px 14px;display:grid;gap:2px}
.preds span{font-size:12.5px;color:var(--muted)} .preds b{font:800 22px/1.2 var(--f-display);letter-spacing:-.02em}
.preds .goal{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.paces{display:grid;gap:8px}
.pz{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:6px;padding:12px 14px;border-left:4px solid var(--tc)}
.pz div{min-width:0;flex:1} .pz b{display:block;font-weight:600} .pz span{font-size:12.5px;color:var(--muted)}
.pz em{font-style:normal;font:700 16px/1.2 var(--f-display);color:var(--tc);white-space:nowrap}
.chart{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:500 10px var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}

/* move sheet: calendar picker */
.mvcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mvcal .dh{text-align:center;font:600 11px/1 var(--f-body);color:var(--muted);padding-bottom:2px}
.mvd{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;min-height:60px;padding:6px 0;border:0;border-radius:8px;background:var(--sunk);color:var(--ink);font:inherit}
.mvd small{font-size:10.5px;line-height:1;color:var(--muted)} .mvd b{font:700 17px/1 var(--f-display)}
.mvd i{width:18px;height:4px;border-radius:2px;background:var(--tc)} .mvd.t-rest i{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.mvd[disabled]{opacity:.32} .mvd[disabled].src{opacity:1}
.mvd.src{box-shadow:inset 0 0 0 2px var(--tc,var(--muted));background:color-mix(in srgb,var(--tc,var(--muted)) 14%,var(--sunk))}
.mvd.now:not(.src) small{color:var(--accent-2);font-weight:700}
.mvd[aria-pressed="true"]{background:var(--accent);color:#fff} .mvd[aria-pressed="true"] small{color:rgba(255,255,255,.85)} .mvd[aria-pressed="true"] i{background:#fff}
.mvpv{display:grid;gap:8px;background:var(--sunk);border-radius:8px;padding:12px 14px}
.mvpv-h{font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mvr{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;border-left:3px solid var(--tc,var(--rest));padding-left:10px}
.mvr span{font-size:13px;color:var(--muted);white-space:nowrap} .mvr b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.mvpv em{font-style:normal;font-size:13px;color:var(--warn,#E8A33D)} .mvpv .okm{display:flex;align-items:center;gap:6px;font-style:normal;font-size:13px;color:var(--good,#4CAF7A)} .mvpv .okm .ic{width:15px;height:15px}
.mvhint{margin:0;text-align:center;font-size:14px;color:var(--muted);padding:6px 0}
.hmove{display:inline-flex;align-items:center;gap:6px;justify-self:center;font-size:14px;margin-top:-10px;min-height:36px} .hmove .ic{width:16px;height:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
/* tab bar */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateZ(0);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px;
  border:1px solid rgba(255,255,255,.09);border-radius:8px;background:#181B23;box-shadow:0 14px 34px rgba(0,0,0,.6);max-width:520px;margin:0 auto}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:5px;padding:9px 0;border-radius:7px;color:var(--muted);font:600 11px/1 var(--f-body);letter-spacing:-.01em;min-width:0;transition:background-color .15s,color .15s}

/* opening animation: red screen, a lightning bolt strikes, the screen flashes and Mileset lands (transform/opacity only, so it stays smooth) */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 42%,#D2434A 0%,#BE383E 45%,#8F1F25 100%);display:grid;place-content:center;justify-items:center;overflow:hidden;will-change:opacity,transform}
#splash .sp-bolt{position:absolute;left:50%;top:0;width:90px;height:52vh;transform:translateX(-38%);overflow:visible;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 18px rgba(255,255,255,.7))}
#splash .sp-bolt path{fill:none;stroke:#fff;stroke-width:3.2;stroke-linejoin:miter;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:sp-strike .2s cubic-bezier(.5,0,.9,.5) .15s forwards,sp-gone .35s ease-out .55s forwards}
#splash .sp-bolt path+path{stroke-width:1.6;animation-delay:.24s,.55s}
#splash .sp-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:sp-flash .5s linear .33s forwards}
#splash .sp-word{position:relative;font:800 64px/1 Archivo,-apple-system,system-ui,sans-serif;letter-spacing:-.02em;color:#fff;opacity:0;transform:scale(1.18);will-change:transform,opacity;animation:sp-land .5s cubic-bezier(.2,.9,.25,1.1) .34s forwards,sp-jolt .22s steps(2) .36s}
#splash .sp-sub{position:relative;margin-top:10px;font:700 13px/1 Archivo,-apple-system,system-ui,sans-serif;letter-spacing:.42em;padding-left:.42em;color:rgba(255,255,255,.85);opacity:0;animation:sp-up .45s ease-out .75s forwards}
#splash.out{animation:sp-out .38s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
@keyframes sp-strike{to{stroke-dashoffset:0}}
@keyframes sp-gone{to{opacity:0}}
@keyframes sp-flash{0%{opacity:0}8%{opacity:.9}22%{opacity:.1}34%{opacity:.6}100%{opacity:0}}
@keyframes sp-land{0%{opacity:0;transform:scale(1.18)}30%{opacity:1}100%{opacity:1;transform:none;text-shadow:0 0 0 transparent}}
@keyframes sp-jolt{0%{translate:-3px 1px}50%{translate:3px -1px}100%{translate:0 0}}
@keyframes sp-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp-out{to{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

/* Screen changes: native slide/fade where the phone supports it (View Transitions), a light fallback otherwise.

::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.22,1,.36,1);animation-fill-mode:both}

html[data-nav="back"]::view-transition-new(root){animation-name:vt-in-l}
html[data-nav="fade"]::view-transition-old(root){animation:vt-fade-out .16s ease-out both}
html[data-nav="fade"]::view-transition-new(root){animation:vt-fade-in .22s cubic-bezier(.22,1,.36,1) both}

.view.nav-fwd{animation:vt-in-r .3s cubic-bezier(.22,1,.36,1) both}
.view.nav-back{animation:vt-in-l .3s cubic-bezier(.22,1,.36,1) both}

<body>

<script src="plan.js"></script>
<script>
(function(){
"use strict";
/* ============ helpers (shared plan logic lives in plan.js) ============ */
const {pad, isoLocal, localDay, lastActiveDay, parseD, addDays, daysBetween, dow, mondayOf, DAYS, DAYF, MON, fmtD, r5, half, fmtPace, fmtTime, fmtDigits, parseTime, comma} = HP;
const {RACES, pace} = HP;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = isoLocal(new Date());
const store = { get(){ try { return JSON.parse(localStorage.getItem("hp-demo-v1") || "null"); } catch(e){ return null; } },
                set(v){ try { localStorage.setItem("hp-demo-v1", JSON.stringify(v)); } catch(e){} } };
const buildPlan = p => HP.buildPlan(p, TODAY);

/* ============ state ============ */
const SAMPLE = {name:"Jordan", sample:true, goal:"half", raceDate: addDays(mondayOf(TODAY), 11 * 7 + 6), goalSec: 1 * 3600 + 44 * 60,
  weekly: 20, longest: 8, prDist:"10k", prSec: 48 * 60 + 30, easyPace: null, weight: 178, goalWeight: 172, lifts: 3, liftExp:"Some", days:[1,2,3,5,6], longDay: 6};
/* Backend. API = the deployed Hybrid API (Cloudflare Worker). Empty = no backend yet: the app keeps
   everything in this browser ("local" mode). With a backend: "account" mode saves to the server,
   "sample" mode shows the sample runner without saving anything. */
const API = "https://hybrid-api.hybridapp.workers.dev";
const tokenStore = { get(){ try { return localStorage.getItem("hp-token"); } catch(e){ return null; } },
  set(t){ try { t ? localStorage.setItem("hp-token", t) : localStorage.removeItem("hp-token"); } catch(e){} } };
// the app lives at app.hybrdrunning.com: the old addresses (github.io, app.hybridrunnin.com) forward here and carry the login along
let movedHere = false;
try { const rf = new URLSearchParams(location.search).get("ref"); if (/^[a-f0-9]{8}$/.test(rf || "")) localStorage.setItem("hp-ref", rf); } catch(e){}
try { const sp = new URLSearchParams(location.search), sv = String(sp.get("src") || sp.get("utm_source") || "").toLowerCase(); if (/^[a-z0-9_-]{1,24}$/.test(sv) && !localStorage.getItem("hp-src")) localStorage.setItem("hp-src", sv); } catch(e){}   // first source wins
if (/^#move=[a-f0-9]{64}$/.test(location.hash)){ if (!tokenStore.get()) tokenStore.set(location.hash.slice(6)); movedHere = true;   // never replaces a login that is already here: a crafted link can't switch someone into another account
  try { history.replaceState(null, "", location.pathname + location.search + "#today"); } catch(e){} }
else if (location.hash === "#moved"){ movedHere = true; try { history.replaceState(null, "", location.pathname + location.search + "#today"); } catch(e){} }
if (location.hostname === "matthewbaconn.github.io" || location.hostname === "app.hybridrunnin.com"){ const t0 = tokenStore.get(); location.replace("https://app.hybrdrunning.com/" + location.search + (t0 && /^[a-f0-9]{64}$/.test(t0) ? "#move=" + t0 : "#moved")); }
// "forgot password" email link: #reset=<code> opens the new-password form
let resetCode = null;
if (/^#reset=[a-f0-9]{64}$/.test(location.hash)){ resetCode = location.hash.slice(7); try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} }
let token = API ? tokenStore.get() : null, me = null, mode = API ? "none" : "local", loading = !!token, authv = null;
if (resetCode && API){ token = null; loading = false; authv = {view: "reset", code: resetCode}; }
addEventListener("hashchange", () => { if (/^#reset=[a-f0-9]{64}$/.test(location.hash)) location.reload(); });
let S = API ? {} : (store.get() || {});
let plan = S.profile ? buildPlan(S.profile) : null;
let tab = "today", wkSel = null, setup = null, toastT = null, scr = null;
const done = S.done || {};
const food = S.food || {};      // date -> [{id, meal, name, cal, protein, carbs, fat}]
const save = () => { if (mode === "local") store.set({profile: plan ? plan.profile : null, done, food, checkins, weights, acts, lifts: liftLog}); };
const clearObj = o => { for (const k in o) delete o[k]; };
async function api(method, path, data){
  let r;
  try { r = await fetch(API + path, {method, headers: {"Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {})}, body: data === undefined ? undefined : JSON.stringify(data)}); }
  catch(e){ throw new Error("Couldn't reach the server. Check your signal and try again."); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token){ signedOut(); toast(j.error || "Please log in again."); }
  if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
  return j;
}
function loadAccount(j){
  me = j.user; mode = "account"; clearObj(done); clearObj(food);
  (j.done || []).forEach(k => done[k] = 1);
  (j.food || []).forEach(x => (food[x.date] = food[x.date] || []).push(x));
  clearObj(checkins); (j.checkins || []).forEach(c => checkins[c.date] = c);
  clearObj(weights); (j.weights || []).forEach(w => weights[w.date] = w.lb);
  acts = j.activities || []; strava = j.strava || strava; garmin = j.garmin || {available: false, connected: false, last_push: null};
  reviews = j.reviews || {}; notes = j.notes || []; uset = j.settings || uset; pushInfo = j.push || pushInfo; coachOn = !!j.coach; aiSt = j.ai || {on: true, asked: true, needs: false, available: !!j.coach}; healthLink = j.health_link || {on: false}; dev = devMap(j.health) || {}; isOwner = !!j.owner; feat = j.features || {}; founding = j.founding || null; reports = j.reports || [];
  liftLog = j.lifts || []; mealplan = j.mealplan || null; crews = j.crews || []; liftOpen = {}; mpv = null; crv = null; crewSel = null; bc = null; fp = null; rsv = null;
  plan = j.profile ? buildPlan(j.profile) : null;
  setup = plan ? null : {step: 0, p: {...blankProfile(), name: (me.name || "").split(" ")[0]}};
}
function signedOut(){ scr = null; feat = {}; aiSt = {on: true, asked: true, needs: false, available: false}; ask.msgs = []; liftLog = []; mealplan = null; crews = []; liftOpen = {}; mpv = null; crv = null; crewSel = null; bc = null; fp = null; rsv = null; isOwner = false; mem = null; reports = []; reportView = null; token = null; tokenStore.set(null); me = null; mode = "none"; plan = null; setup = null; authv = null; clearObj(done); clearObj(food); clearObj(checkins); clearObj(weights); acts = []; reviews = {}; notes = []; strava = {available: false, connected: false, name: "", last_sync: null}; render(); }
/* ============ tracking: check-ins, weigh-ins, workouts, Strava ============ */
const checkins = S.checkins || {};          // date -> {sleep_h, sleep_q, soreness, energy, stress}
const weights = S.weights || {};            // date -> lb
let acts = S.acts || [];                    // [{id, source, date, type, name, mi, minutes, cal, avg_hr}]
let strava = {available: false, connected: false, name: "", last_sync: null}, garmin = {available: false, connected: false, last_push: null};
let ci = null, wf = null, aw = {open: false, err: "", busy: false};
let reviews = {}, notes = [], uset = {tz: "America/New_York", morning: "07:00", bedtime: "21:30", n_morning: true, n_run: true, n_weekly: true, n_bed: true}, pushInfo = {key: null, devices: 0}, coachOn = false;
const reviewFor = a => reviews[a.id] || null;
const VCLS = {ok: "good", easy: "easy", hard: "warn", unknown: "muted", extra: "good"};
/* Garmin attribution (Garmin API brand guidelines, Nov 17): anything worked out with Garmin device data as an input says
   so right under its heading, in Garmin's own sample wording. Shown only where Garmin data really was an input. */
const GARMIN_ATTR = 'Insights derived in part from Garmin device-sourced data.';
const gAttr = on => on ? '<small class="gattr">' + GARMIN_ATTR + '</small>' : '';
function reviewHtml(rv, a, garminIn){
  const gm = gAttr(garminIn || (a && a.source === "garmin"));
  if (rv.askFeel){
    // Strava workout: rule-based summary, then the coach needs the person's own take (Strava data isn't sent to AI)
    const id = a ? a.id : "";
    return '<div class="coach">' + ic("spark") + '<div><b>' + esc(rv.headline) + '</b>' + (rv.numbers ? '<span class="num">' + esc(rv.numbers) + '</span>' : '') + (rv.meaning ? '<p>' + esc(rv.meaning) + '</p>' : '') +
      (id && mode === "account" && coachOn ? '<p class="feelq">How did it feel? Your coach will take it from there.</p><div class="feel" role="group" aria-label="How did it feel">' +
        [["easy", "Easy"], ["just right", "Just right"], ["hard", "Hard"], ["very hard", "Very hard"]].map(([k, l]) => '<button type="button" data-act="feel" data-id="' + esc(id) + '" data-f="' + k + '"' + (feelBusy === id ? ' disabled' : '') + '>' + l + '</button>').join("") + '</div>' +
        '<input class="feelnote" id="fn-' + esc(id) + '" maxlength="300" placeholder="Anything else? Legs, pace, how you slept (optional)">' : '') + '</div></div>';
  }
  return '<div class="coach">' + ic("spark") + '<div><small class="ai">AI coach · can be wrong</small><b>' + esc(rv.headline) + '</b>' + gm + (rv.numbers ? '<span class="num">' + esc(rv.numbers) + '</span>' : '') + (rv.meaning ? '<p>' + esc(rv.meaning) + '</p>' : '') + (rv.next ? '<p><strong>Next:</strong> ' + esc(rv.next) + '</p>' : '') + (rv.feel ? '<p class="fine">From how you said it felt: ' + esc(rv.feel) + '.</p>' : '') +
    (askOn() && (!a || a.source !== "strava") ? '<button class="linkbtn askab" type="button" data-act="askabout" data-t="' + esc([rv.headline, rv.meaning, rv.next ? "Next: " + rv.next : ""].filter(Boolean).join(" ").slice(0, 480)) + '">Ask about this</button>' : '') + '</div></div>';
}
let feelBusy = null;
let notePending = false;
const morningNote = () => notes.find(n => n.date === TODAY && n.kind === "morning");   // check-in draft, weigh-in edit, workout form
const actsOn = d => acts.filter(a => a.date === d);
const weightNow = () => { const a = avgWeight(TODAY); return a || (plan && plan.profile.weight) || 170; };
const avgWeight = end => HP.avgW(weights, end);
const {ADJ} = HP;
let dev = {};
function devMap(list){ if (!list) return null; const m = {}; list.forEach(x => m[x.date] = x); return m; }                                // date -> {sleep_h, rhr, hrv, steps, active_cal} from Apple Health
const sigOn = d => HP.devSignals(dev, d);
const readiness = (c, sig) => HP.readiness(c, sig === undefined && c && c.date ? sigOn(c.date) : sig);
const dayMatches = date => plan ? HP.dayMatches(plan, acts, date) : {};
const sessDone = (date, i, m) => !!done[date + "-" + i] || !!(m || dayMatches(date))[i];
const fuelFor = (p, day, date) => HP.fuel(plan, weights, acts, date || TODAY);
let fbCache = null, fbKey = "";
function fb(){ const k = acts.length + "|" + (acts[acts.length - 1] || {}).id + "|" + (plan && plan.start); if (!fbCache || k !== fbKey){ fbKey = k; fbCache = HP.feedback(plan, acts, TODAY); } return fbCache; }

/* persistence: account -> server, local -> this browser, sample -> memory */
async function saveRemote(method, path, data){ if (mode === "account") return api(method, path, data); save(); return {}; }

/* ---------- check-in ---------- */
const CIQ = [
  ["sleep_h", "Sleep", [[4.5, "<5"], [5, "5"], [6, "6"], [7, "7"], [8, "8"], [9, "9+"]]],
  ["sleep_q", "Quality", [[1, "Awful"], [2, "Poor"], [3, "OK"], [4, "Good"], [5, "Great"]]],
  ["soreness", "Legs", [[1, "Fresh"], [2, "Light"], [3, "Some"], [4, "Sore"], [5, "Very"]]],
  ["energy", "Energy", [[1, "Drained"], [2, "Low"], [3, "OK"], [4, "Good"], [5, "Great"]]],
  ["stress", "Stress", [[1, "Calm"], [2, "Low"], [3, "Some"], [4, "High"], [5, "Very"]]]
];
let ciForce = false;
const morningNow = () => { const h = new Date().getHours(); return h >= 3 && h < 12; };
/* A connected watch (Garmin, or Apple Health sending data) replaces the morning survey: readiness, sleep and the
   night's numbers show instead (Matthew, Nov 15). The survey stays one tap away for anyone who wants to add how they feel. */
const watchLinked = () => !!(garmin.connected || (healthLink && healthLink.on) || Object.keys(dev || {}).some(k => k >= addDays(TODAY, -3) && k <= TODAY));
/* Matthew, Nov 16: "whoever has a watch connected, there should be no survey". A watch that has sent numbers in the last
   3 days means NO survey anywhere: not on Today, not from Recovery, not behind a link. How you feel is typed to the coach.
   (A watch that is linked but has sent nothing for 3 days is not feeding the app, so checking in by hand stays possible.) */
const watchFeeding = () => Object.keys(dev || {}).some(k => k >= addDays(TODAY, -3) && k <= TODAY);
const feelBtn = () => askOn() ? '<button class="linkbtn" type="button" data-act="askfeel">Tell your coach how you feel</button>' : '';
function watchReadyCard(){
  const sg0 = sigOn(TODAY), sg = sg0 || {}, c = checkins[TODAY], r = readiness(c, sg0);   // a check-in already saved today still counts, so the score matches the rest of the app
  if (!r) return morningNow() ? '<section class="card ci-done wr" style="--tone:var(--long)"><div class="ci-row"><div><strong>Waiting for your watch</strong><span>Last night\'s sleep and today\'s readiness show here once your watch syncs.</span></div>' + (watchFeeding() ? feelBtn() : '<button class="linkbtn" type="button" data-act="ciopen">Check in by hand</button>') + '</div></section>' : '';
  const n1 = x => Math.round(x * 10) / 10, mn = morningNote(), fromGarmin = !!(dev && dev[TODAY] && dev[TODAY].source === "garmin");
  const bits = [sg.sleep_h ? n1(sg.sleep_h) + ' h sleep' : '', sg.sleep_score != null ? 'sleep score ' + sg.sleep_score : '',
    sg.hrv ? 'HRV ' + Math.round(sg.hrv) + ' ms' + (sg.hrvA ? ' (your normal ' + Math.round(sg.hrvA) + ')' : '') : '',
    sg.rhr ? 'resting HR ' + Math.round(sg.rhr) + (sg.rhrA ? ' (your normal ' + Math.round(sg.rhrA) + ')' : '') : ''].filter(Boolean);
  return '<section class="card ci-done wr" style="--tone:var(--' + r.tone + ')"><div class="ci-row"><b>' + r.score + '</b><div><strong>' + r.word + '</strong><span>' + (bits.length ? (fromGarmin ? 'From your Garmin · ' : 'From your watch · ') + esc(bits.join(' · ')) : 'Waiting for last night\'s watch numbers') + '</span></div>' + feelBtn() + '</div>' +
    (r.watch ? '<p class="sub">' + esc(r.watch.join(' · ')) + '.</p>' : '') + (mn ? reviewHtml({headline: mn.headline, meaning: (mn.lines || []).join(" ")}, null, fromGarmin) : gAttr(fromGarmin && bits.length)) + '</section>';
}
function checkinCard(){
  const c = checkins[TODAY], r = readiness(c, sigOn(TODAY));
  if (watchFeeding()){ ci = null; ciForce = false; return watchReadyCard(); }   // watch sending numbers: never the survey
  if (c && !ci){
    const mn = morningNote();
    return '<section class="card ci-done" style="--tone:var(--' + r.tone + ')"><div class="ci-row"><b>' + r.score + '</b><div><strong>' + r.word + '</strong><span>' +
      c.sleep_h + ' h sleep · ' + ["", "very low", "low", "OK", "good", "great"][c.energy] + ' energy' + (r.watch ? ' · ' + esc(r.watch[0]) : '') + '</span></div><button class="linkbtn" type="button" data-act="ciedit">Edit</button></div>' +
      (mn ? reviewHtml({headline: mn.headline, meaning: (mn.lines || []).join(" ")}) : coachOn && mode === "account" && notePending ? '<p class="sub">Coach note on its way…</p>' : '') + '</section>';
  }
  if (!c && !ci && !ciForce && watchLinked()) return watchReadyCard();          // watch connected: no survey, the watch's own read
  if (!c && !ci && !ciForce && !morningNow()) return '';
  const ws = dev[TODAY] && dev[TODAY].sleep_h;
  if (!c && ws && (!ci || ci.sleep_h == null)){ const opts = CIQ[0][2].map(o => o[0]); ci = {...(ci || {}), sleep_h: opts.reduce((a, b) => Math.abs(b - ws) < Math.abs(a - ws) ? b : a), fromWatch: true}; }
  const d = ci || {};
  const hs = SHORTCUT_URL && mode === "account" && hkStore.get() && !ws ? '<button class="linkbtn" type="button" data-act="hsync">Get sleep from Apple Health</button>' : '';
  return '<section class="card ci" style="--tone:var(--long)"><div class="ci-top"><b>Morning check-in</b><span>' + (d.fromWatch && ws ? 'sleep from your watch' : 'adjusts today') + '</span></div>' + hs +
    CIQ.map(([k, label, opts]) => '<div class="ciq"><span>' + label + '</span><div class="cio" role="group" aria-label="' + label + '">' +
      opts.map(([v, l]) => '<button type="button" class="' + (d[k] === v ? 'on' : '') + '" data-act="ciset" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + (d[k] === v) + '">' + l + '</button>').join("") + '</div></div>').join("") +
    (d.err ? '<p class="err" role="alert">' + esc(d.err) + '</p>' : '') + '<button class="btn primary block" type="button" data-act="cisave"' + (d.busy ? ' disabled aria-busy="true"' : '') + '>' + (d.busy ? 'Saving…' : 'Save') + '</button>' +
    (!c && watchLinked() ? '<button class="linkbtn" type="button" data-act="ciclose" style="justify-self:center;margin-top:4px">Not now · back to my watch numbers</button>' : '') + '</section>';
}

/* ---------- weigh-in ---------- */
function weighCard(){
  const w = weights[TODAY], a = avgWeight(TODAY);
  if (w && !wf) return '<section class="card" style="--tone:var(--lift)"><div class="card-h">' + ic("scale") + '<span class="lbl">Weigh-in</span><button class="linkbtn r" type="button" data-act="wedit">Edit</button></div>' +
    '<div class="wrow"><b>' + w + ' <small>lb</small></b><span>7-day average <strong>' + a.toFixed(1) + ' lb</strong>' + goalLine(a) + '</span></div><button class="linkbtn" type="button" data-act="wedit" data-past="1" style="margin-top:10px">Add a day you missed</button></section>';
  return '<section class="card" style="--tone:var(--lift)"><div class="card-h">' + ic("scale") + '<span class="lbl">Morning weigh-in</span><span class="r">optional</span></div>' +
    '<div class="wform"><input id="w-lb" inputmode="decimal" placeholder="' + (a ? a.toFixed(1) : "Weight") + '" aria-label="Weight in pounds" value="' + (wf && wf.past ? "" : w || "") + '"><span>lb</span><button class="btn primary" type="button" data-act="wsave">Save</button></div>' +
    '<label class="wdate">Day <input id="w-date" type="date" max="' + TODAY + '" min="' + addDays(TODAY, -60) + '" value="' + (wf && wf.past ? addDays(TODAY, -1) : TODAY) + '"></label>' +

  const p = side === 0 ? [lat, lng + w * f] : side === 1 ? [lat - h * f, lng + w] : side === 2 ? [lat - h, lng + w * (1 - f)] : [lat - h * (1 - f), lng]; out.push([p[0] + Math.sin(i * 1.7) * 0.00002, p[1] + Math.cos(i * 1.3) * 0.00002]); } return out; }
function sampleActs(){
  const loop = loopPts(27.6531, -80.4402, .0105, .0072, 120), out = loopPts(27.6448, -80.3972, .0032, .028, 160);
  return [
    {id: "s1", source: "sample", date: addDays(TODAY, -1), start_local: addDays(TODAY, -1) + "T06:12", type: "run", name: "Morning easy run", mi: 5.1, minutes: 46, avg_hr: 142, max_hr: 158, elev_ft: 24, cal: 520, pts: loop.concat(loop.slice(1))},
    {id: "s2", source: "sample", date: addDays(TODAY, -2), start_local: addDays(TODAY, -2) + "T17:40", type: "lift", name: "Upper body strength", mi: 0, minutes: 52, avg_hr: 118, cal: 310},
    {id: "s3", source: "sample", date: addDays(TODAY, -3), start_local: addDays(TODAY, -3) + "T06:05", type: "run", name: "Tempo by the beach", mi: 6.2, minutes: 50, avg_hr: 161, max_hr: 176, elev_ft: 18, cal: 690, pts: out}
  ];
}

/* Strava sync, same rhythm as Strong at 180: when the app opens, whenever you come back to it
   (at most every 45 s), and every 10 min while it's open. A sync never redraws over something
   you're typing: it waits until you leave the field. */
let syncing = false, pendingRender = false;
function typing(){ const a = document.activeElement; return (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || aw.open || !!$(".back"); }
function safeRender(){ if (typing()){ pendingRender = true; return; } pendingRender = false; captureFood(); render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) safeRender(); }, 150));
function waitForReview(id){
  const before = Object.keys(reviews).length;
  [5000, 12000, 22000, 35000].forEach(ms => setTimeout(() => { if (id ? !reviews[id] : Object.keys(reviews).length === before) refreshMe(); }, ms));
}
async function refreshMe(){
  try { const j = await api("GET", "/api/me"); const before = JSON.stringify([acts, reviews]); acts = j.activities || acts; reviews = j.reviews || reviews; notes = j.notes || notes; dev = devMap(j.health) || dev; if (j.reports) reports = j.reports; strava = j.strava || strava; pushInfo = j.push || pushInfo;
    if (JSON.stringify([acts, reviews]) !== before) safeRender(); } catch(e){}
}
async function stravaSync(quiet){
  if (!strava.connected || syncing) return;
  syncing = true;
  try {
    const j = await api("POST", "/api/strava/sync"), me2 = await api("GET", "/api/me");
    const before = JSON.stringify([acts, reviews]); acts = me2.activities || []; strava = me2.strava || strava; reviews = me2.reviews || reviews; notes = me2.notes || notes;
    if (JSON.stringify([acts, reviews]) !== before || !quiet) safeRender();
    if (j.fresh && coachOn) waitForReview(null);
    else { const r = $(".card-h .r"); if (r && /^Strava/.test(r.textContent)) r.textContent = "Strava · " + agoText(strava.last_sync); }
    if (!quiet) toast(j.synced ? "Strava is up to date." : "No new Strava activities.");
  } catch(e){ if (!quiet) toast(e.message); }
  finally { syncing = false; }
}
function garminReturn(){

  const msg = {connected: "Garmin linked. New workouts and sleep come in automatically after your watch syncs.", cancelled: "Garmin wasn't linked.", expired: "That took too long. Tap Connect Garmin again.", failed: "Couldn't link Garmin. Try again in a minute."}[q];
  if (msg) setTimeout(() => toast(msg), 300);
}
function stravaReturn(){

let lastAutoSync = 0;

/* New version published? Load it by itself when you come back to the app or after a few minutes,
   never while you're typing, and land back on the same screen. No closing and reopening. */
const verHash = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return h; };
let myVer = null, newVer = false, lastVerCheck = 0;
fetch("index.html?v=" + Date.now(), {cache: "no-store"}).then(r => r.ok ? r.text() : null).then(t => { if (t) myVer = verHash(t); }).catch(() => {});
function checkVersion(){
  if (myVer == null || document.visibilityState !== "visible" || Date.now() - lastVerCheck < 20e3) return;
  lastVerCheck = Date.now();
  fetch("index.html?v=" + Date.now(), {cache: "no-store"}).then(r => r.ok ? r.text() : null).then(t => { if (t && verHash(t) !== myVer){ newVer = true; reloadIfIdle(); } }).catch(() => {});
}
function reloadIfIdle(){
  if (!newVer || typing() || loading || setup || (fs && fs.busy) || (ci && ci.busy)) return;
  try { sessionStorage.setItem("hy-upd", JSON.stringify({scr, tab, y: window.scrollY, at: Date.now()})); } catch(e){}
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}).finally(() => location.reload());
  else location.reload();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });

/* swipe from the left edge to go back, like Instagram: the screen follows your finger */
(function(){
  const appEl = document.getElementById("app"), EDGE = 28;
  let x0 = null, y0 = 0, dx = 0, on = false, t0 = 0, btn = null;
  const backBtn = () => document.querySelector('.scrbar [data-act="back"], [data-act="actback"], .setup .nav [data-act="prev"]');
  addEventListener("touchstart", e => {
    x0 = null; if (e.touches.length !== 1 || $(".back")) return;
    const t = e.touches[0]; if (t.clientX > EDGE) return;
    btn = backBtn(); if (!btn) return;
    x0 = t.clientX; y0 = t.clientY; dx = 0; on = false; t0 = performance.now();
  }, {passive: true});
  addEventListener("touchmove", e => {
    if (x0 == null) return;
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!on){ if (Math.abs(my) > 12 && Math.abs(my) > Math.abs(mx)){ x0 = null; return; } if (mx < 10) return; on = true; appEl.classList.add("swiping"); }
    dx = Math.max(0, mx); appEl.style.transform = "translateX(" + dx + "px)";
    if (e.cancelable) e.preventDefault();
  }, {passive: false});
  const end = () => {
    if (x0 == null) return; x0 = null; if (!on) return; on = false;
    const w = innerWidth, fast = dx > 40 && dx / (performance.now() - t0) > .5;
    appEl.classList.remove("swiping"); appEl.classList.add("swipe-settle");
    if (dx > w * .33 || fast){
      appEl.style.transform = "translateX(" + w + "px)";
      setTimeout(() => { appEl.classList.remove("swipe-settle"); noVT = true; try { if (btn && btn.isConnected) btn.click(); } finally { noVT = false; }
        appEl.style.transform = "translateX(-24px)"; appEl.style.opacity = ".6"; requestAnimationFrame(() => { appEl.classList.add("swipe-settle"); appEl.style.transform = ""; appEl.style.opacity = ""; setTimeout(() => appEl.classList.remove("swipe-settle"), 220); }); }, 170);
    } else { appEl.style.transform = ""; setTimeout(() => appEl.classList.remove("swipe-settle"), 220); }
  };
  addEventListener("touchend", end); addEventListener("touchcancel", end);
})();

/* pull down from the top to refresh: reloads your data, Strava and the forecast */
(function(){
  const ptr = document.getElementById("ptr"), appEl = document.getElementById("app"), MAX = 120, GO = 72;
  let y0 = null, d = 0, busy = false;
  const blocked = () => !plan || setup || authv || loading || $(".back") || window.scrollY > 0;
  const show = (dist, spin) => { const p = Math.min(1, dist / GO); ptr.style.opacity = p; ptr.style.transform = "translateY(" + (Math.min(dist, MAX) * .6 - 50 + 50 * p) + "px) rotate(" + dist * 3 + "deg)"; appEl.style.transform = dist ? "translateY(" + Math.min(dist, MAX) * .4 + "px)" : ""; if (spin) ptr.classList.add("go"); };
  const reset = () => { ptr.classList.add("back"); appEl.classList.add("settle"); ptr.style.opacity = 0; ptr.style.transform = "translateY(-50px)"; appEl.style.transform = ""; ptr.classList.remove("go");
    setTimeout(() => { ptr.classList.remove("back"); appEl.classList.remove("settle"); }, 260); };
  addEventListener("touchstart", e => { if (busy || blocked() || e.touches.length !== 1 || e.touches[0].clientX <= 28) { y0 = null; return; } y0 = e.touches[0].clientY; d = 0; appEl.classList.add("pulling"); }, {passive: true});
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0){ if (d) show(0); d = 0; return; }
    d = dy * .55; show(d);
    if (e.cancelable) e.preventDefault();
  }, {passive: false});
  addEventListener("touchend", async () => {
    if (y0 == null) return; y0 = null; appEl.classList.remove("pulling");
    if (d < GO){ reset(); return; }
    busy = true; show(GO, true);
    try {
      if (mode === "account"){
        const j = await api("GET", "/api/me"); loadAccount(j);
        if (strava.connected) await stravaSync(true);
      }
      if (wxLoc()){ wxState = "idle"; await loadWeather(true); }
      render();
    } catch(e){ toast(e.message); }
    busy = false; reset();
  });
})();

/* ---------- charts ---------- */
function barChart(vals, labels, color, goal, fmt, aria){
  const W = 340, H = 130, n = vals.length, gap = n > 10 ? 4 : 8, bw = (W - gap * (n - 1)) / n, max = Math.max(goal || 0, ...vals.map(v => v || 0)) * 1.1 || 1;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">';
  vals.forEach((v, i) => { const x = i * (bw + gap); if (v == null){ s += '<rect x="' + x.toFixed(1) + '" y="' + (H - 20) + '" width="' + bw.toFixed(1) + '" height="2" rx="1" fill="var(--line)"/>'; }
    else { const hh = Math.max(3, v / max * (H - 30)); s += '<rect x="' + x.toFixed(1) + '" y="' + (H - 18 - hh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="' + Math.min(6, bw / 3).toFixed(1) + '" fill="' + (typeof color === "function" ? color(v, i) : color) + '"/>'; }
    if (labels[i]) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(labels[i]) + '</text>'; });
  if (goal){ const y = (H - 18 - goal / max * (H - 30)).toFixed(1); s += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".7"/>'; }
  return s + '</svg>';
}
function lineChart(series, aria){
  // series: [{pts:[[i, v]], color, dash, dots}] over n x-slots; values share one scale
  const W = 340, H = 150, all = series.flatMap(s => s.pts.map(p => p[1])), lo = Math.floor(Math.min(...all) - 1), hi = Math.ceil(Math.max(...all) + 1), n = Math.max(...series.flatMap(s => s.pts.map(p => p[0]))) || 1;
  const X = i => 30 + i / n * (W - 40), Y = v => 10 + (hi - v) / (hi - lo) * (H - 30);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">';
  [lo, Math.round((lo + hi) / 2), hi].forEach(v => s += '<line x1="30" x2="' + W + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)"/><text x="0" y="' + (Y(v) + 3).toFixed(1) + '">' + v + '</text>');
  series.forEach(se => { if (!se.pts.length) return; const d = se.pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
    s += '<path d="' + d + '" fill="none" stroke="' + se.color + '" stroke-width="' + (se.w || 2.4) + '" stroke-linecap="round" stroke-linejoin="round"' + (se.dash ? ' stroke-dasharray="5 5"' : '') + '/>';
    if (se.dots) se.pts.forEach(p => s += '<circle cx="' + X(p[0]).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="2.6" fill="' + se.color + '"/>'); });
  return s + '</svg>';
}

const hm = h => Math.floor(h) + 'h ' + pad(Math.round((h % 1) * 60)) + 'm';
function watchCard(days){
  const has = days.some(d => dev[d]), t = dev[TODAY] || dev[addDays(TODAY, -1)], sig = sigOn(dev[TODAY] ? TODAY : addDays(TODAY, -1));
  if (!has) return mode === "account" ? '<section class="card" style="--tone:var(--easy)"><div class="card-h">' + ic("watch") + '<span class="lbl">From your watch</span></div><p class="sub">No watch data yet. Add sleep and heart rate from your iPhone and your readiness uses them.</p><button class="btn block" type="button" data-act="menu">Set up in Settings</button></section>' : '';
  const tile = (k, v, sub) => '<div><span>' + k + '</span><b>' + v + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>';
  const vs = (v, a, unit, lowGood) => a && v ? (Math.round(v - a) === 0 ? 'normal' : (v > a ? '+' : '−') + Math.abs(Math.round(v - a)) + unit + ' vs normal') : '';
  let h = '<section class="card" style="--tone:var(--easy)"><div class="card-h">' + ic("watch") + '<span class="lbl">From your watch</span><span class="r">' + (dev[TODAY] ? 'today' : t ? 'yesterday' : '') + '</span></div>';
  if (t) h += '<div class="wsum wtiles">' + tile("Sleep", t.sleep_h ? hm(t.sleep_h) : '–', t.sleep_score != null ? 'score ' + t.sleep_score : '') + tile("Resting HR", t.rhr ? t.rhr : '–', sig ? vs(t.rhr, sig.rhrA, ' bpm') : '') + tile("HRV", t.hrv ? t.hrv + ' ms' : '–', sig ? vs(t.hrv, sig.hrvA, ' ms') : '') + '</div>' +
    (t.bb != null || t.stress != null ? '<div class="wsum wtiles">' + (t.bb != null ? tile("Body Battery", t.bb, 'at wake') : '') + (t.stress != null ? tile("Stress", t.stress, 'average') : '') + (t.sleep_score != null ? tile("Sleep score", t.sleep_score, t.sleep_score >= 80 ? 'good' : t.sleep_score >= 60 ? 'fair' : 'poor') : '') + '</div>' : '') +
    (t.steps != null || t.active_cal != null ? '<p class="sub">' + [t.steps != null ? comma(t.steps) + ' steps' : '', t.active_cal != null ? comma(t.active_cal) + ' active cal' : ''].filter(Boolean).join(' · ') + '</p>' : '') +
    (sig && sig.notes.length ? '<p class="fbnote">' + ic("gauge") + '<span>' + esc(sig.notes.join(", ").replace(/^./, x => x.toUpperCase())) + '.' + (sig.pen ? ' Readiness is lowered a little to match.' : '') + '</span></p>' : '');
  else h += '<p class="sub">Nothing from your watch today yet.</p>';
  const lab = days.map((d, i) => i % 2 === 1 ? '' : String(parseD(d).getUTCDate()));
  const hv = days.map(d => dev[d] && dev[d].hrv || null), rh = days.map(d => dev[d] && dev[d].rhr || null);
  if (hv.filter(Boolean).length >= 2) h += '<div class="card-h" style="--tone:var(--easy)"><span class="lbl">HRV · 14 days</span></div>' + barChart(hv, lab, () => "var(--easy)", null, null, "Heart rate variability for each of the last 14 days");
  if (rh.filter(Boolean).length >= 2) h += '<div class="card-h" style="--tone:var(--race)"><span class="lbl">Resting HR · 14 days</span></div>' + barChart(rh, lab, () => "var(--race)", null, null, "Resting heart rate for each of the last 14 days");
  return h + '</section>';
}
/* ---------- Training tab extras: weight and calories ---------- */
let wRange = 42;
function wAsk(){ try { return localStorage.getItem("hy-wask") !== "off"; } catch(e){ return true; } }
function bodyCards(){
  const N = wRange, p = plan.profile, days = Array.from({length: N}, (_, i) => addDays(TODAY, i - N + 1));
  const pts = [], avgPts = []; days.forEach((d, i) => { if (weights[d]) pts.push([i, weights[d]]); const a = avgWeight(d); if (a && Object.keys(weights).some(k => k <= d && k > addDays(d, -7))) avgPts.push([i, Math.round(a * 10) / 10]); });
  let h = '<section class="card" style="--tone:var(--lift)"><div class="card-h">' + ic("scale") + '<span class="lbl">Body weight</span><div class="wrng" role="group" aria-label="Range">' + [[42, "6 wk"], [120, "4 mo"]].map(([n, l]) => '<button type="button" data-act="wrange" data-n="' + n + '" aria-pressed="' + (wRange === n) + '"' + (wRange === n ? ' class="on"' : '') + '>' + l + '</button>').join("") + '</div>';
  if (pts.length >= 2){
    const a = avgWeight(TODAY), b = avgWeight(addDays(TODAY, -7)), wk = a && b ? a - b : null;
    const series = [{pts, color: "var(--muted)", w: 1.2, dots: true}, {pts: avgPts, color: "var(--lift)", w: 2.8}];
    if (p.goalWeight) series.push({pts: [[0, p.goalWeight], [N - 1, p.goalWeight]], color: "var(--long)", dash: true, w: 1.6});
    const first = pts[0][1], tot = a ? a - (avgPts.length ? avgPts[0][1] : first) : 0;
    h += '</div><p class="wsum">' + (wk != null ? '<span><b>' + (wk <= 0 ? '−' : '+') + Math.abs(wk).toFixed(1) + '</b> lb this week</span>' : '') + (avgPts.length > 7 ? '<span><b>' + (tot <= 0 ? '−' : '+') + Math.abs(tot).toFixed(1) + '</b> lb since ' + fmtD(days[avgPts[0][0]]) + '</span>' : '') + '<span><b>' + pts.length + '</b> weigh-ins</span></p>' + lineChart(series, "Daily weigh-ins and 7-day average") +
      '<div class="legend"><span><i style="--c:var(--lift)"></i>7-day average</span><span><i style="--c:var(--muted)"></i>Weigh-ins</span>' + (p.goalWeight ? '<span><i style="--c:var(--long)"></i>Goal ' + p.goalWeight + ' lb</span>' : '') + '</div>' +
      (wk != null && p.goalWeight && p.goalWeight < a ? '<p class="sub">' + (-wk > 1.5 ? 'Losing over 1.5 lb a week can cost muscle. Eating a bit more on training days helps.' : -wk >= .4 ? 'Losing at a muscle-safe pace. Keep going.' : 'Weight is holding steady. If that lasts two weeks, trim about 150 cal a day.') + '</p>' : '');
  } else h += '</div><p class="sub">Weigh in on a few mornings and your trend shows here. The 7-day average smooths out water-weight swings.</p>';
  h += '</section>';
  // calories, last 7 days
  const d7 = Array.from({length: 7}, (_, i) => addDays(TODAY, i - 6)), eatenV = d7.map(d => (food[d] || []).length ? eaten(d).cal : null);
  const tg = d7.map(d => fuelFor(p, dayOf(d), d).cal), logged = eatenV.filter(v => v != null);
  const ae = logged.length ? logged.reduce((a, b) => a + b, 0) / logged.length : null, at = tg.reduce((a, b) => a + b, 0) / 7;
  h += '<section class="card" style="--tone:var(--accent-2)"><div class="card-h">' + ic("fork") + '<span class="lbl">Calories · last 7 days</span><span class="r">' + logged.length + ' of 7 days logged</span></div>' +
    barChart(eatenV, d7.map(d => DAYS[dow(d)].slice(0, 1)), (v, i) => v > tg[i] + 150 ? "var(--crit)" : v < tg[i] - 400 ? "var(--work)" : "var(--accent-2)", Math.round(at), null, "Calories eaten each day for the last 7 days, dashed line is your average target") +
    (ae != null ? '<div class="wkstats"><div><span>Avg eaten</span><b>' + comma(ae) + '</b></div><div><span>Avg target</span><b>' + comma(at) + '</b></div><div><span>Difference</span><b style="color:var(--' + (Math.abs(ae - at) < 150 ? 'good' : ae > at ? 'crit' : 'warn') + ')">' + (ae - at >= 0 ? '+' : '−') + comma(Math.abs(ae - at)) + '</b></div></div>' +
      '<p class="sub">' + (Math.abs(ae - at) < 150 ? 'Right on target. This is the pace that gets you to your goal.' : ae > at ? 'A bit over on average. Logging every meal, snacks included, makes this easy to fix.' : 'Under target on average. Eating too little makes training harder and costs muscle.') + '</p>'
      : '<p class="sub">Log your food for a few days and your weekly average shows here.</p>') + '</section>';
  return h;
}


/* ============ weather + heat, fuel tips, race card, calorie check, sync line ============ */
const WMO = {0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 80: "Showers", 81: "Showers", 82: "Heavy showers", 95: "Thunderstorms", 96: "Thunderstorms", 99: "Thunderstorms"};
let wx = null, wxState = "idle", wxErr = "";
const wxLoc = () => { if (uset.lat != null) return {lat: uset.lat, lon: uset.lon, place: uset.place || "Your area"}; try { return JSON.parse(localStorage.getItem("hp-wxloc") || "null"); } catch(e){ return null; } };
async function loadWeather(force){
  const L = wxLoc(); if (!L || wxState === "loading") return;
  const key = "hp-wx-" + L.lat + "," + L.lon;
  if (!force){ try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c && Date.now() - c.at < 45 * 60e3){ wx = c.data; wxState = "ok"; safeRender(); return; }   /* a saved forecast still has to be drawn: Today used to stay on "Loading…" */ } catch(e){} }
  wxState = "loading";
  try {
    const u = "https://api.open-meteo.com/v1/forecast?latitude=" + L.lat + "&longitude=" + L.lon + "&hourly=temperature_2m,apparent_temperature,dew_point_2m,precipitation_probability,weather_code&current=temperature_2m,apparent_temperature,dew_point_2m,weather_code&daily=temperature_2m_min,temperature_2m_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=3";
    const r = await fetch(u); if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), h = j.hourly;
    wx = {place: L.place, now: {temp_f: Math.round(j.current.temperature_2m), feels_f: Math.round(j.current.apparent_temperature), dew_f: Math.round(j.current.dew_point_2m), cond: WMO[j.current.weather_code] || "—"},
      today: {lo_f: Math.round(j.daily.temperature_2m_min[0]), hi_f: Math.round(j.daily.temperature_2m_max[0])},
      hours: h.time.map((t, i) => ({t: t.slice(0, 13) + ":00", temp_f: h.temperature_2m[i], feels_f: h.apparent_temperature[i], dew_f: h.dew_point_2m[i], precip_pct: h.precipitation_probability[i], cond: WMO[h.weather_code[i]] || ""}))};
    wx.now.precip_pct = (wx.hours.find(x => x.t.slice(0, 13) === new Date().toISOString().slice(0, 13)) || wx.hours[0] || {}).precip_pct;
    try { localStorage.setItem(key, JSON.stringify({at: Date.now(), data: wx})); } catch(e){}
    wxState = "ok"; wxErr = "";
  } catch(e){ wxState = "error"; wxErr = "Couldn't load the forecast. Check your signal."; }
  safeRender();
}
function heatToday(){
  if (!wx) return null;
  const rt = uset.run_time || "07:00", key = TODAY + "T" + rt.slice(0, 2) + ":00";
  const hrs = wx.hours.filter(x => x.t >= key && x.t < TODAY + "T" + String(Math.min(23, +rt.slice(0, 2) + 2)).padStart(2, "0") + ":00");
  if (!hrs.length) return null;
  const worst = hrs.reduce((a, b) => (b.temp_f + b.dew_f > a.temp_f + a.dew_f ? b : a));
  return {pct: HP.heatPct(worst.temp_f, worst.dew_f), temp: Math.round(worst.temp_f), dew: Math.round(worst.dew_f), hour: +worst.t.slice(11, 13)};
}
const hr12 = h => (h % 12 || 12) + (h < 12 ? " AM" : " PM");
function setWxLoc(lat, lon, place){
  const L = {lat: Math.round(lat * 100) / 100, lon: Math.round(lon * 100) / 100, place};
  try { localStorage.setItem("hp-wxloc", JSON.stringify(L)); } catch(e){}
  if (mode === "account"){ uset = {...uset, ...L}; api("PUT", "/api/settings", L).then(j => { uset = j.settings || uset; }).catch(() => {}); }
  wx = null; wxState = "idle"; wxErr = ""; render(); loadWeather(true);
}
function weatherCard(){
  const L = wxLoc();
  let h = '<section class="card" style="--tone:var(--accent-2)"><div class="card-h">' + ic("sun") + '<span class="lbl">Weather</span>' + (L ? '<button class="linkbtn r" type="button" data-act="wxchange">Change</button>' : '') + '</div>';
  if (!L || wxState === "pick") return h + '<p class="sub">See the best time to run, and get workout paces adjusted for heat like your watch would.</p>' +
    '<div class="wform"><input id="wx-city" placeholder="City, e.g. Vero Beach" aria-label="City"><button class="btn primary" type="button" data-act="wxcity">Set</button></div>' +
    '<button class="btn block" type="button" data-act="wxgeo">' + ic("pin") + 'Use my location</button><p class="err" role="alert">' + esc(wxErr) + '</p></section>';
  if (wxState !== "ok" || !wx){ if (wxState === "idle") setTimeout(() => loadWeather(), 0); return h + '<p class="sub">' + (wxState === "error" ? esc(wxErr) + ' <button class="linkbtn" type="button" data-act="wxretry">Try again</button>' : 'Loading the forecast…') + '</p></section>'; }
  const n = wx.now, nowKey = TODAY + "T" + String(new Date().getHours()).padStart(2, "0") + ":00", b = HP.bestWindow(wx.hours, nowKey, addDays(TODAY, 1)), ht = heatToday();
  h += '<div class="wx-top"><div class="wx-t">' + n.temp_f + '°</div><div class="wx-c"><b>' + esc(n.cond) + '</b><span>' + esc(wx.place) + '</span></div></div>' +
    '<div class="wx-bits"><span>Feels ' + n.feels_f + '°</span><span>Dew ' + n.dew_f + '°</span>' + (n.precip_pct != null ? '<span>Rain ' + n.precip_pct + '%</span>' : '') + '<span>H ' + wx.today.hi_f + '° L ' + wx.today.lo_f + '°</span></div>';
  if (b) h += '<div class="wx-best"><b>Best time to run</b><span>' + (b.day === TODAY ? "Today" : "Tomorrow") + ' ' + hr12(b.h0) + '–' + hr12(b.h0 + 3) + ' · ' + (b.lo === b.hi ? b.lo + '°' : b.lo + '–' + b.hi + '°') + '</span></div>';
  h += '<label class="tm" style="margin:0">I usually run at<input type="time" data-set="run_time" value="' + esc(uset.run_time || "07:00") + '"></label>';
  if (ht && ht.pct >= .01) h += '<p class="fbnote">' + ic("sun") + '<span>Around ' + hr12(ht.hour) + ' it\'ll be ' + ht.temp + '°F with a ' + ht.dew + '° dew point, so today\'s outdoor workout paces are ' + Math.round(ht.pct * 100 * 10) / 10 + '% slower. On a treadmill, run the normal paces.</span></p>';
  return h + '</section>';
}
/* Today: one slim line under the greeting with the weather now and the best 3 hours to run (today or tomorrow). Opens the Weather screen. */
function wxStrip(){
  const L = wxLoc(), open = (label, big, top, sub) => '<button class="wxs" type="button" data-act="go" data-scr="weather" aria-label="' + esc(label) + '">' + ic("sun") + (big ? '<span class="wxs-t">' + big + '</span>' : '') +
    '<span class="wxs-c"><b>' + top + '</b><span>' + sub + '</span></span><i aria-hidden="true">›</i></button>';
  if (!L) return open("Add your city for the weather", "", "Weather and best time to run", "Add your city");
  if (wxState === "error") return open("Weather didn't load. Open to try again", "", "Weather didn't load", "Tap to try again");
  if (wxState !== "ok" || !wx) return open("Weather is loading", "", "Weather", "Loading the forecast…");
  const n = wx.now, nowKey = TODAY + "T" + String(new Date().getHours()).padStart(2, "0") + ":00", b = HP.bestWindow(wx.hours, nowKey, addDays(TODAY, 1));
  const now = esc(n.cond) + (n.feels_f != null && Math.abs(n.feels_f - n.temp_f) >= 3 ? ' · feels ' + n.feels_f + '°' : '');
  const span = (a, z) => (a < 12) === (z < 12) ? (a % 12 || 12) + '–' + hr12(z) : hr12(a) + '–' + hr12(z);   // 6–9 AM, 11 AM–2 PM
  const best = b ? 'Best time to run: ' + (b.day === TODAY ? 'today ' : 'tomorrow ') + span(b.h0, b.h0 + 3) : 'High ' + wx.today.hi_f + '° · low ' + wx.today.lo_f + '°';
  return open("Weather: " + n.temp_f + " degrees, " + n.cond + ". " + best, n.temp_f + '°', now, best);
}
function fuelTipHtml(s){

  return '<div class="fueltip">' + ic("fork") + '<div><span><b>Before:</b> ' + esc(t.before) + '</span>' + (t.during ? '<span><b>During:</b> ' + esc(t.during.replace(/^During: /, "")) + '</span>' : '') + (t.after ? '<span><b>After:</b> ' + esc(t.after.replace(/^After: /, "")) + '</span>' : '') + '</div>' +
    (t.gels ? '<em class="gels">' + t.gels + ' gel' + (t.gels === 1 ? '' : 's') + '</em>' : '') + '</div>';
}
function raceCard(){
  const sp = HP.raceSplits(plan); if (!sp) return '';
  return '<div class="racecard"><b>Goal ' + fmtTime(sp.goal) + ' · ' + fmtPace(sp.pace) + '/mi</b><table class="splits"><thead><tr><th>Mile</th><th>Time</th></tr></thead><tbody>' +
    sp.rows.map(r => '<tr><td>' + r.mi + '</td><td>' + fmtTime(r.time) + '</td></tr>').join("") + '</tbody></table><span class="sub">Even pace. Start the first mile 5 s slower than this and settle in.</span></div>';
}
function calCheck(){
  const end = addDays(TODAY, -1), start = addDays(end, -13);
  let food = 0, nFood = 0, maint = 0, n = 0;
  for (let d = start; d <= end; d = addDays(d, 1)){
    const c = eaten(d).cal; if (c >= 1200){ food += c; nFood++; }
    const W = HP.avgW(weights, d) || plan.profile.weight || 170; maint += W * 13 + acts.filter(a => a.date === d).reduce((t, a) => t + HP.burnOf(a, W), 0); n++;
  }
  const a1 = HP.avgW(weights, end), a0 = HP.avgW(weights, addDays(end, -13));
  if (nFood < 10 || !a1 || !a0) return {need: Math.max(1, 10 - nFood), weighed: !!(a1 && a0)};
  const intake = food / nFood, real = Math.round((intake + (a0 - a1) * 3500 / 14) / 10) * 10, planM = Math.round(maint / n / 10) * 10;
  return {intake: Math.round(intake), real, plan: planM, lbWk: Math.round((a0 - a1) / 2 * 10) / 10, nFood};
}
function calCheckCard(){
  const c = calCheck();
  let h = '<section class="card" style="--tone:var(--work)"><div class="card-h">' + ic("gauge") + '<span class="lbl">Calorie check · 14 days</span></div>';
  if (c.need) return h + '<p class="sub">Needs about ' + c.need + ' more day' + (c.need === 1 ? '' : 's') + ' of food logged' + (c.weighed ? '' : ', and weigh-ins at the start and end of the two weeks,') + ' to compare what you really burn with what the plan assumes.</p></section>';
  const gap = c.real - c.plan;
  return h + '<div class="wkstats"><div><span>Eaten</span><b>' + comma(c.intake) + '</b></div><div><span>Real burn</span><b>' + comma(c.real) + '</b></div><div><span>Plan thinks</span><b>' + comma(c.plan) + '</b></div></div>' +
    '<p class="sub">' + (Math.abs(gap) < 150 ? 'The plan matches your real burn.' : gap > 0 ? 'You burn about ' + comma(gap) + ' more a day than the plan assumes. Eat a little more on training days.' : 'You burn about ' + comma(-gap) + ' less a day than the plan assumes. The weekly rule will trim the deficit if your weight stalls.') +
    ' Weight is ' + (c.lbWk >= 0 ? 'down ' : 'up ') + Math.abs(c.lbWk) + ' lb a week.</p></section>';
}

/* ============ food log ============
   Photo and text logging go through the food relay (a small Cloudflare Worker that holds the AI key;
   the key never reaches this page). Only signed-in accounts can use photo reading; otherwise manual entry. */
const aiOn = () => mode === "account";
const MEALS = ["Breakfast","Lunch","Dinner","Snack"];
let fs = {busy:false, photo:null, text:"", meal:null, err:"", manual:false, note:""}, fdate = TODAY;
function mealNow(){ const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 15 ? "Lunch" : h < 21 ? "Dinner" : "Snack"; }
const n0 = x => { x = +x; return isFinite(x) && x >= 0 ? Math.round(x) : 0; };
function eaten(date){ return (food[date] || []).reduce((a, x) => ({cal: a.cal + n0(x.cal), protein: a.protein + n0(x.protein), carbs: a.carbs + n0(x.carbs), fat: a.fat + n0(x.fat)}), {cal:0, protein:0, carbs:0, fat:0}); }
function captureFood(){ const t = document.getElementById("food-text"), m = document.getElementById("food-meal"); if (t) fs.text = t.value; if (m) fs.meal = m.value; }
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't a photo this phone can read.")); i.src = url; });
    const k = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .8);
  } finally { URL.revokeObjectURL(url); }
}
async function askFood(text, photo){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 45000);
  try {
    const body = {text: text || ""};
    if (photo){ body.image = photo.split(",")[1]; body.mediaType = "image/jpeg"; }
    let r;
    try { r = await fetch(API + "/api/food/analyze", {method:"POST", headers:{"Content-Type":"application/json", Authorization: "Bearer " + token}, body: JSON.stringify(body), signal: ctl.signal}); }
    catch(e){ if (e.name === "AbortError") throw e; throw new Error("Couldn't reach the server. Check your signal and try again."); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || (r.status === 429 ? "Too many requests. Wait a minute and try again." : "Couldn't read that right now."));
    const items = (Array.isArray(j.items) ? j.items : []).filter(x => x && x.name).slice(0, 12);
    if (!items.length) throw new Error(j.note || "Couldn't find any food in that. Try a clearer photo or add a few words.");
    return {items, note: j.note || ""};
  } catch(e){ throw e.name === "AbortError" ? new Error("That took too long. Check your signal and try again.") : e; }
  finally { clearTimeout(timer); }
}
async function addFood(meal, items){
  const list = food[fdate] = food[fdate] || [];
  if (mode === "account"){ const j = await api("POST", "/api/food", {date: fdate, meal, items}); j.items.forEach(x => list.push(x)); return; }
  items.forEach((x, i) => list.push({id: Date.now().toString(36) + i, meal, name: String(x.name).slice(0, 80), cal: n0(x.cal), protein: n0(x.protein), carbs: n0(x.carbs), fat: n0(x.fat)}));
  save();
}
function fuelCard(f, extra){

  const mac = (k, a, b, c) => '<div class="mac" style="--mc:var(--' + c + ')"><span>' + k + '</span><b>' + a + '<small> / ' + b + ' g</small></b><div class="bar"><i style="width:' + pc(a, b) + '%"></i></div></div>';
  return '<section class="card" style="--tone:var(--accent-2)"><div class="card-h">' + ic("fork") + '<span class="lbl">Fuel today</span><span class="r">' + (f.brk ? 'Diet break' : f.cut ? f.deficit + ' cal deficit' : f.gain ? '+' + f.surplus + ' cal to build' : 'Maintenance') + '</span></div>' +
    '<div class="left"><div class="big"><b class="' + (left < 0 ? 'over' : '') + '">' + comma(Math.abs(left)) + '</b><span>' + (left < 0 ? 'calories over' : 'calories left') + '</span></div>' +
    '<span class="sub">' + comma(e.cal) + ' eaten of ' + comma(f.cal) + ' (estimate)</span><div class="bar"><i style="width:' + pc(e.cal, f.cal) + '%' + (left < 0 ? ';background:var(--crit)' : '') + '"></i></div></div>' +

/* ============ strength log: weights per exercise and what to try next ============ */
let liftLog = S.lifts || [], liftOpen = {};
const exName = st => String(st).replace(/\s+\d+\s*[×x].*$/, "").replace(/\s+\d+\s*(rounds?|min).*$/i, "").trim();
const exScheme = st => (String(st).match(/(\d+\s*[×x]\s*[^,]+)$/) || [])[1] || "";
function exTarget(st){             // "Back squat 4 × 5" → {sets: 4, reps: 5, unit: "reps"}; "Plank 3 × 45 s" → unit "sec"; "Pull-ups 4 × max" → reps null
  const sc = exScheme(st), m = sc.match(/(\d+)\s*[×x]\s*(\d+)?/);
  return {sets: m ? +m[1] : null, reps: m && m[2] ? +m[2] : null, unit: /\d+\s*s\b/.test(sc) ? "sec" : "reps"};
}
const isBodyweight = ex => /plank|push-?up|pull-?up|chin|dip|lunge|step-?up|bridge|dead bug|bird dog|carry|hang|jump|bound|hollow|inverted/i.test(ex) && !/db|dumbbell|barbell|weighted|goblet/i.test(ex);
function liftHint(ex, tgt){
  tgt = tgt || {};
  const xs = liftLog.filter(x => x.ex.toLowerCase() === ex.toLowerCase() && x.date < TODAY).sort((a, b) => b.date.localeCompare(a.date)), last = xs[0], u = tgt.unit === "sec" ? " s" : " reps";
  if (!last) return {text: isBodyweight(ex) ? "Bodyweight is fine. Add weight if it feels easy." : "First time: pick a weight that leaves 2 reps in the tank.", next: null, nextReps: tgt.reps};
  if (!last.weight){
    if (last.reps){ const nr = last.reps + (tgt.unit === "sec" ? 5 : 1); return {text: "Last " + fmtD(last.date) + ": " + last.reps + u + ". Try " + nr + u + ".", next: null, nextReps: nr}; }
    return {text: "Last time: bodyweight" + (last.hit ? ", all reps. Try 1–2 more reps." : ". Same reps again."), next: null, nextReps: tgt.reps};
  }
  const inc = /squat|deadlift|rdl|hip thrust|leg press|trap/i.test(ex) ? 10 : 5;
  let next = last.weight, why = "";
  if (last.hit){ next = last.weight + inc; why = "all reps last time"; }
  else if (xs[1] && !xs[1].hit && xs[1].weight === last.weight){ next = Math.max(0, Math.round(last.weight * .9 / 5) * 5); why = "missed reps twice, so ease back"; }
  else why = "missed some reps, so repeat it";
  return {text: "Last " + fmtD(last.date) + ": " + last.weight + " lb" + (last.reps ? " × " + last.reps : "") + (last.hit ? " ✓" : "") + ". Try " + next + " lb (" + why + ").", next, nextReps: tgt.reps};
}

}

/* ============ barcode scanning (ZXing, loaded only when used) + Open Food Facts ============ */
let bc = null, ZXP = null;
function zxing(){
  if (ZXP) return ZXP;
  ZXP = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = "vendor/zxing/zxing-reader.js";
    s.onload = () => { try { ZXingWASM.prepareZXingModule({overrides: {locateFile: (path, prefix) => path.endsWith(".wasm") ? new URL("vendor/zxing/" + path, location.href).href : prefix + path}, fireImmediately: true}); ok(ZXingWASM); } catch(e){ no(e); } };
    s.onerror = () => { ZXP = null; no(new Error("scanner")); }; document.head.appendChild(s);
  });
  return ZXP;
}
async function scanBarcode(file){
  bc = {busy: true}; fs.err = ""; render();
  try {
    const Z = await zxing(), res = await Z.readBarcodes(file, {formats: ["EAN13", "EAN8", "UPCA", "UPCE"], tryHarder: true, maxNumberOfSymbols: 1});
    if (!res.length || !res[0].text){ bc = {err: "Couldn't read a barcode. Get closer, in good light, or type the number under it.", manual: true}; render(); return; }
    await lookupBarcode(res[0].text);
  } catch(e){ bc = {err: "The scanner didn't load. Type the number under the barcode instead.", manual: true}; render(); }
}
async function lookupBarcode(code){
  code = String(code).replace(/\D/g, "");
  if (code.length < 8){ bc = {err: "Barcodes are 8 to 13 digits.", manual: true, code}; render(); return; }
  bc = {busy: true, code}; render();
  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + code + ".json?fields=product_name,brands,nutriments,serving_size,serving_quantity");
    const j = await r.json(), p = j && j.status === 1 ? j.product : null, n = p && p.nutriments || {};
    const per = (k) => n[k + "_serving"] != null ? Number(n[k + "_serving"]) : null, per100 = k => n[k + "_100g"] != null ? Number(n[k + "_100g"]) : null;
    const hasServ = per("energy-kcal") != null;
    if (!p || (!hasServ && per100("energy-kcal") == null)){ bc = {err: "That product isn't in the food database yet. Take a photo of the label instead.", manual: true, code}; render(); return; }
    bc = {code, name: [p.brands && String(p.brands).split(",")[0], p.product_name].filter(Boolean).join(" ") || "Scanned food", basis: hasServ ? (p.serving_size || "1 serving") : "100 g",
      kcal: hasServ ? per("energy-kcal") : per100("energy-kcal"), p: (hasServ ? per("proteins") : per100("proteins")) || 0, c: (hasServ ? per("carbohydrates") : per100("carbohydrates")) || 0, f: (hasServ ? per("fat") : per100("fat")) || 0, qty: 1};
  } catch(e){ bc = {err: "Couldn't reach the food database. Check your connection and try again.", manual: true, code}; }
  render();
}
function barcodeHtml(){
  let h = '<label class="cam">' + ic("bars") + '<span>Scan barcode</span><input type="file" id="food-barcode" accept="image/*" capture="environment" aria-label="Take a photo of a barcode"></label>';
  if (!bc) return h;

  if (bc.name){
    const q = bc.qty, r = x => Math.round(x * q);
