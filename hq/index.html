<script>
// "Open a link and everything is unlocked" (Matthew, Nov 14). An iPhone home-screen app keeps its own storage,
// so the app itself has to start from the private link. Once this device holds the key, the install manifest's
// start address carries it in the #k= part, which browsers never send to any server.
(function(){ try {
  var m = location.hash.match(/k=([A-Za-z0-9_-]{40,})/), k = m ? m[1] : localStorage.getItem("hq-k");
  if (!k || !/^[A-Za-z0-9_-]{40,}$/.test(k)) return;
  var base = location.href.split("#")[0].split("?")[0], u = function(p){ return new URL(p, base).href; };
  var mf = {name:"Mileset HQ", short_name:"HQ", description:"Mileset's command floor: who's working, what's shipping, what needs you.",
    start_url: base + "#k=" + k, scope: u("./"), display:"standalone", orientation:"portrait", background_color:"#07080B",
    theme_color:"#07080B", icons:[{src:u("icon-192.png"), sizes:"192x192", type:"image/png"}, {src:u("icon-512.png"), sizes:"512x512", type:"image/png"}]};
  document.getElementById("mf").href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(mf));
} catch(e){} })();
</script>

<style>
:root{--bg:#04060a;--bg2:#070b12;--ink:#eef4fb;--mut:#8b98ac;--dim:#5a667a;--cy:#5ee6ff;--em:#46e3a1;--am:#ffc15e;--rd:#ff6b6b;--line:rgba(255,255,255,.10);
  --glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.028));--glass2:linear-gradient(180deg,rgba(18,26,38,.86),rgba(9,13,20,.9));
  --spec:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.03);--sh:0 18px 50px rgba(0,0,0,.55);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.34,1.4,.44,1);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100dvh;overflow:hidden;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
a{color:var(--cy);text-decoration:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mut{color:var(--mut)} .dim{color:var(--dim)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--spec),var(--sh);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border-radius:18px}
.glass.solid{background:var(--glass2)}
[hidden]{display:none!important}

/* ---------- the floor ---------- */
#floor{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(900px 600px at 50% 42%,rgba(94,230,255,.10),transparent 62%),radial-gradient(700px 500px at 82% 88%,rgba(70,227,161,.07),transparent 60%),radial-gradient(600px 480px at 10% 12%,rgba(255,193,94,.05),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg))}
#floor.drag{cursor:grabbing} .inview #world{visibility:hidden}
#world{position:absolute;left:0;top:0;width:1400px;height:1400px;transform-origin:0 0;will-change:transform}
#world::before{content:"";position:absolute;inset:-600px;background-image:linear-gradient(rgba(94,230,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(94,230,255,.055) 1px,transparent 1px);background-size:70px 70px;
  -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 78%);mask-image:radial-gradient(closest-side,#000 35%,transparent 78%)}
#wires{position:absolute;inset:0;width:1400px;height:1400px;overflow:visible;pointer-events:none}
#wires .ring{fill:none;stroke:rgba(94,230,255,.13);stroke-width:1}
#wires .ring.d{stroke-dasharray:3 9;animation:spin 120s linear infinite;transform-origin:700px 700px}
#wires .wire{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1.2}
#wires .beam{fill:none;stroke:var(--c,var(--cy));stroke-width:2;stroke-linecap:round;stroke-dasharray:10 16;opacity:.75;filter:drop-shadow(0 0 6px var(--c,var(--cy)));animation:flow 1.1s linear infinite}
#wires .beam.back{animation-direction:reverse}
#wires .spark{fill:#fff;filter:drop-shadow(0 0 8px var(--c,var(--cy)))}
@keyframes flow{to{stroke-dashoffset:-26}} @keyframes spin{to{transform:rotate(360deg)}}
.stn{position:absolute;width:168px;margin:-84px 0 0 -84px;display:grid;justify-items:center;gap:8px;text-align:center;cursor:pointer;transform:scale(var(--inv,1))}
.stn:active .pod{transform:scale(.94)} .pod{transition:transform .35s var(--spring)}
.far .stn:not([data-s=working]):not([data-s=alert]) .bub{display:none} .stn[data-s=working],.stn[data-s=alert]{z-index:2}
.pod{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.14),rgba(255,255,255,.02) 62%),rgba(8,14,22,.72);
  border:1px solid rgba(255,255,255,.16);box-shadow:var(--spec),0 0 0 6px rgba(255,255,255,.02),0 20px 44px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pod svg{width:40px;height:40px;stroke:var(--c);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px var(--c))}
.pod::before,.pod::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--c);opacity:.55}
.pod::after{inset:-18px;border-width:1px;opacity:.18}
.stn[data-s=working] .pod::before{border-style:dashed;animation:spin 7s linear infinite;opacity:.9}
.stn[data-s=working] .pod::after{animation:halo 2.2s ease-out infinite}
.stn[data-s=waiting] .pod::before{animation:blink 1.6s ease-in-out infinite}
.stn[data-s=paused] .pod,.stn[data-s=offline] .pod{filter:saturate(.3) brightness(.8)}
.stn[data-s=alert] .pod::after{animation:halo 1.4s ease-out infinite;opacity:.5}
@keyframes halo{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.28);opacity:0}} @keyframes blink{50%{opacity:.15}}
.stn.helm{width:220px;margin:-110px 0 0 -110px} .stn.helm .pod{width:148px;height:148px} .stn.helm .pod svg{width:58px;height:58px}
.stn b{font:700 15px/1.1 inherit;letter-spacing:.02em} .stn.helm b{font-size:18px;letter-spacing:.16em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font:600 11.5px/1.3 inherit;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.bub{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);width:max-content;max-width:230px;padding:7px 11px;border-radius:12px 12px 12px 3px;font-size:12px;line-height:1.3;text-align:left;color:#dfe9f5;
  background:rgba(10,16,25,.86);border:1px solid rgba(255,255,255,.12);box-shadow:var(--spec),0 10px 26px rgba(0,0,0,.5);animation:pop .5s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.94)}}
[data-s=working]{--c:var(--cy)} [data-s=idle]{--c:#93a4ba} [data-s=waiting]{--c:var(--am)} [data-s=paused]{--c:#77839a} [data-s=alert]{--c:var(--rd)} [data-s=offline]{--c:#5a667a} [data-s=ok]{--c:var(--em)}
#floorctl{position:fixed;right:calc(12px + var(--sr));bottom:calc(150px + var(--sb));z-index:12;display:grid;gap:8px}
#floorctl button{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:18px}

/* ---------- HUD ---------- */
#hud{position:fixed;z-index:20;left:calc(10px + var(--sl));right:calc(10px + var(--sr));top:calc(var(--st) + 10px);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#hud h1{margin:0;font:800 14px/1 inherit;letter-spacing:.22em;display:flex;align-items:center;gap:9px;white-space:nowrap}
#hud h1 span{color:var(--mut);font-weight:600;letter-spacing:.14em}
.hrow{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch} .hrow::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--line);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mut));box-shadow:0 0 10px var(--c,transparent)}
.meter{display:inline-block;width:64px;height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;vertical-align:middle}
.meter u{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--em),var(--cy));transition:width .8s var(--ease)}
.meter.warn u{background:linear-gradient(90deg,var(--am),#ff9c5e)} .meter.over u{background:var(--rd)}
#sync i{animation:blink 2.4s ease-in-out infinite} #sync.busy i{animation:blink .5s linear infinite}
.seg{flex:none;display:inline-flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{min-height:28px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mut);transition:all .3s var(--ease)}
.seg button[aria-pressed=true]{color:#041018;background:var(--cy);box-shadow:0 0 18px rgba(94,230,255,.45)}
.seg button[data-m=class][aria-pressed=true]{background:var(--am);box-shadow:0 0 18px rgba(255,193,94,.4)} .seg button[data-m=paused][aria-pressed=true]{background:#aab6c8;box-shadow:none}

/* ---------- needs your call + recap ---------- */
#stack{position:fixed;z-index:18;left:calc(10px + var(--sl));right:calc(10px + var(--sr));top:calc(var(--st) + var(--hudh,64px) + 18px);display:grid;gap:10px;pointer-events:none;max-width:420px}
#stack > *{pointer-events:auto}
#call{padding:12px 14px;border-color:rgba(255,193,94,.38);box-shadow:var(--spec),0 0 0 1px rgba(255,193,94,.08),0 14px 40px rgba(0,0,0,.5),0 0 40px rgba(255,193,94,.08)}
.cardh{display:flex;align-items:center;gap:8px;font:700 12px/1 inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.cardh .r{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:600}
#call .cardh{color:var(--am);margin:0} #call.open .cardh{margin-bottom:10px}
.ask{display:grid;gap:8px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)} .ask:first-of-type{border-top:0;padding-top:0}
.ask p{margin:0} .ask .why{color:var(--mut);font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:40px;padding:8px 14px;border-radius:12px;font-weight:650;font-size:13.5px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .2s var(--spring),background .2s}
.btn:active{transform:scale(.95)} .btn.go{background:linear-gradient(180deg,#58efb0,#2fc98a);color:#03170f;border-color:transparent;box-shadow:0 6px 20px rgba(70,227,161,.3)}
.btn.cy{background:linear-gradient(180deg,#7cecff,#3fd0ee);color:#03131a;border-color:transparent} .btn.warn{color:var(--am);border-color:rgba(255,193,94,.4)} .btn.sm{min-height:32px;padding:5px 11px;font-size:12.5px;border-radius:10px}
.sent{display:inline-flex;align-items:center;gap:6px;color:var(--em);font-weight:600;font-size:13px}
#recap{padding:12px 14px} #recap ul{margin:0;padding:0;list-style:none;display:grid;gap:7px} #recap li{display:flex;gap:9px;font-size:13.5px} #recap li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:7px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.fold{cursor:pointer;user-select:none} .fold::after{content:"›";margin-left:6px;display:inline-block;transition:transform .3s var(--ease)} .open > .fold::after,.open > .cardh.fold::after{transform:rotate(90deg)}
.foldb{display:none} .open > .foldb{display:block;animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ---------- views ---------- */
#views{position:fixed;z-index:15;inset:0;padding:calc(var(--st) + var(--hudh,64px) + 22px) calc(12px + var(--sr)) calc(var(--sb) + 150px) calc(12px + var(--sl));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:rgba(4,6,10,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);animation:rise .35s var(--ease) both;
  -webkit-mask-image:linear-gradient(transparent calc(var(--st) + var(--hudh,64px) + 2px),#000 calc(var(--st) + var(--hudh,64px) + 22px));mask-image:linear-gradient(transparent calc(var(--st) + var(--hudh,64px) + 2px),#000 calc(var(--st) + var(--hudh,64px) + 22px))}
.view{max-width:1120px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{padding:16px;min-width:0} .card h2{margin:0 0 4px;font:750 18px/1.2 inherit;letter-spacing:-.01em} .card .sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.big{font:750 30px/1 var(--mono);letter-spacing:-.03em} .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.kpi{padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)} .kpi span{display:block;color:var(--mut);font-size:12px;margin-bottom:5px} .kpi b{font:700 20px/1 var(--mono)} .kpi em{display:block;font-style:normal;color:var(--mut);font-size:11.5px;margin-top:4px}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden} .bar u{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--em),var(--cy));transition:width .9s var(--ease)}
.rows{display:grid;gap:0} .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.07);min-width:0} .row:first-child{border-top:0}
.row .g{flex:1;min-width:0} .row .g b{display:block;font-weight:600;overflow-wrap:anywhere} .row .g span{display:block;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.empty{padding:14px;border-radius:13px;border:1px dashed rgba(255,255,255,.16);color:var(--mut);font-size:13.5px;display:flex;gap:10px;align-items:flex-start} .empty::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;border:1.5px solid var(--cy)}
.empty b{color:var(--ink);font-weight:600}
.tl{position:relative;display:grid;gap:10px;padding-left:30px} .tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--cy),rgba(94,230,255,.08))}
.step{position:relative;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:transform .25s var(--spring),border-color .2s} .step:active{transform:scale(.985)}
.step::before{content:attr(data-n);position:absolute;left:-30px;top:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--mono);color:#04121a;background:var(--c,var(--cy));box-shadow:0 0 14px var(--c,var(--cy))}
.step.held{--c:var(--am);border-color:rgba(255,193,94,.35)} .step.live{--c:var(--em)} .step.draft{--c:#77839a}
.step b{display:block;font-weight:650;overflow-wrap:anywhere} .step .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:12.5px;color:var(--mut)}
.cols{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(220px,1fr));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.col{scroll-snap-align:start;min-width:0;display:grid;gap:8px;align-content:start} .col h3{margin:0 0 2px;font:700 12px/1 inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--mut));display:flex;gap:6px;align-items:center}
.idea{padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);cursor:pointer;font-size:13.5px} .idea span{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.spark{display:block;width:100%;height:56px} .spark path{fill:none;stroke:var(--cy);stroke-width:2;filter:drop-shadow(0 0 5px rgba(94,230,255,.6))} .spark .a{fill:url(#sg);stroke:none;filter:none}
.day{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07)} .day:first-child{border-top:0} .day time{font:600 12px/1.3 var(--mono);color:var(--mut)}
.tag{display:inline-block;padding:1px 7px;border-radius:7px;font-size:11px;font-weight:650;background:color-mix(in srgb,var(--c,var(--cy)) 14%,transparent);color:var(--c,var(--cy));margin-right:6px}
.tag.work{--c:var(--am)} .tag.school{--c:#7fb0ff} .tag.build{--c:var(--cy)} .tag.run{--c:var(--em)} .tag.vesper{--c:#93a4ba}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:13px;padding:11px 13px;resize:none}
textarea::placeholder,input::placeholder{color:var(--dim)}
details.raw{margin-top:10px;font-size:12px} details.raw summary{color:var(--mut);cursor:pointer} details.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11.5px/1.45 var(--mono);color:#b8c6d8;background:rgba(0,0,0,.4);border-radius:10px;padding:10px;margin:8px 0 0;max-height:240px;overflow:auto}

/* ---------- drawer / sheets ---------- */
#scrim{position:fixed;inset:0;z-index:28;background:rgba(2,4,8,.5);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)} #scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;z-index:30;top:calc(var(--st) + 10px);right:calc(10px + var(--sr));bottom:calc(var(--sb) + 10px);width:min(430px,calc(100vw - 20px));padding:0;display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .55s var(--spring);overflow:hidden}
#drawer.on{transform:none}
#drawer .grab{display:none} #drawer .dh{padding:16px 16px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)} #drawer .dh h2{margin:0;font:750 19px/1.15 inherit} #drawer .dh .x{margin-left:auto;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);font-size:17px}
#drawer .db{padding:14px 16px calc(16px + var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:grid;gap:16px;align-content:start}
#drawer h3{margin:0 0 8px;font:700 11.5px/1 inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.prog{height:7px;border-radius:9px;background:rgba(255,255,255,.09);overflow:hidden} .prog u{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--em));border-radius:9px;transition:width 1s var(--ease)} .prog.live u{background-size:200% 100%;background-image:linear-gradient(90deg,var(--cy),#fff,var(--cy));animation:shim 1.6s linear infinite} @keyframes shim{to{background-position:-200% 0}}
.log{display:grid;gap:9px} .log div{display:grid;grid-template-columns:62px 1fr;gap:9px;font-size:13px} .log time{color:var(--dim);font:11.5px/1.5 var(--mono)}

/* ---------- dock, command ---------- */
#dock{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);padding:6px;display:flex;gap:4px;border-radius:22px}
#dock button{min-width:64px;min-height:50px;padding:6px 10px;border-radius:16px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);transition:all .3s var(--ease);position:relative}
