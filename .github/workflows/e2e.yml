name: Browser test

# A real phone-sized browser goes through every screen of the live app with a throwaway account
# (real AI, weather and database), then deletes the account. Screenshots are saved with the run.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04     # the browser-test tool doesn't support the newest runner image yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the live app
        run: node tests/e2e.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e-shots
          retention-days: 7
