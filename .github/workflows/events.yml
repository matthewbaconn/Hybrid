name: Recent server events
# Manual: prints the server's own event log (no personal data: kind, ok, short error text) for debugging.
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "Event kinds, SQL LIKE patterns separated by commas"
        default: "ai_%,race%,garmin%"
jobs:
  events:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd api && npm install --no-save --no-audit --no-fund wrangler@4 >/dev/null
      - name: Point wrangler at the live database
        working-directory: api
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="hybrid");process.stdout.write(x?x.uuid:"")})')
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$id/" wrangler.toml
      - name: Events from the last 3 days
        env: {KINDS: "${{ inputs.kinds }}"}
        run: |
          cd api
          where=$(echo "$KINDS" | tr ',' '\n' | sed "s/[^a-z_%]//g" | awk 'NF{printf "%skind LIKE '\''%s'\''", (n++?" OR ":""), $0}')
          npx wrangler d1 execute hybrid --remote --command "SELECT ts, kind, ok, detail FROM events WHERE ($where) AND ts > datetime('now','-3 days') ORDER BY ts DESC LIMIT 80"
      - name: Counts (no personal data)
        run: |
          cd api
          npx wrangler d1 execute hybrid --remote --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM strava_links) AS strava, (SELECT COUNT(*) FROM garmin_links) AS garmin"
      - name: Owner account (masked)
        run: |
          cd api
          npx wrangler d1 execute hybrid --remote --command "SELECT name, substr(email, 1, 3) || '…@' || substr(email, instr(email, '@') + 1) AS email, substr(created, 1, 10) AS joined FROM users WHERE email NOT LIKE '%@example.com' ORDER BY created LIMIT 1"
          npx wrangler d1 execute hybrid --remote --command "SELECT COUNT(*) AS owner_phones FROM push_subs WHERE user_id = (SELECT id FROM users WHERE email NOT LIKE '%@example.com' ORDER BY created LIMIT 1)"
