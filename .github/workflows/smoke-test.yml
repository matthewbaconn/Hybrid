name: Test the live API

# Signs up a throwaway account, reads a typed meal and a label photo with the real AI,
# saves food, loads it back, then deletes the account. Run it from the Actions tab any time.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://hybrid-api.hybridapp.workers.dev
      ORIGIN: https://matthewbaconn.github.io
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          set -euo pipefail
          call(){ curl -sS -X "$1" "$API$2" -H "Origin: $ORIGIN" -H "Content-Type: application/json" ${TOKEN:+-H "Authorization: Bearer $TOKEN"} ${3:+--data-binary "$3"}; }
          email="test-$(date +%s)-$RANDOM@example.com"
          TOKEN=""
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/signup" -H "Origin: $ORIGIN" -H "Content-Type: application/json" -d "{\"email\":\"no-agree-$RANDOM@example.com\",\"password\":\"smoke-test-123\"}")" = 400 ] || { echo "::error::sign-up without agreeing to the terms was accepted"; exit 1; }
          r=$(call POST /api/signup "{\"email\":\"$email\",\"password\":\"smoke-test-123\",\"name\":\"Test\",\"agree\":true}")
          TOKEN=$(echo "$r" | jq -r .token); [ "$TOKEN" != "null" ] || { echo "::error::signup failed: $r"; exit 1; }
          echo "signup ok"
          r=$(call POST /api/food/analyze '{"text":"3 scrambled eggs and 2 slices of whole wheat toast"}')
          echo "typed meal: $(echo "$r" | jq -c .)"
          [ "$(echo "$r" | jq '.items | length')" -ge 1 ] || { echo "::error::typed meal failed: $r"; exit 1; }
          img=$(base64 -w0 tests/label.jpg)
          printf '{"text":"","image":"%s","mediaType":"image/jpeg"}' "$img" > body.json
          r=$(curl -sS -X POST "$API/api/food/analyze" -H "Origin: $ORIGIN" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" --data-binary @body.json)
          echo "label photo: $(echo "$r" | jq -c .)"
          [ "$(echo "$r" | jq '.items | length')" -ge 1 ] || { echo "::error::photo failed: $r"; exit 1; }
          cal=$(echo "$r" | jq '[.items[].cal] | add'); pro=$(echo "$r" | jq '[.items[].protein] | add')
          echo "::notice::Photo read: $cal cal, $pro g protein (label says 100 cal, 18 g protein)"
          call POST /api/food "{\"date\":\"$(date +%F)\",\"meal\":\"Lunch\",\"items\":$(echo "$r" | jq -c .items)}" > /dev/null
          n=$(call GET /api/me | jq '.food | length'); [ "$n" -ge 1 ] || { echo "::error::food not saved"; exit 1; }
          echo "saved and loaded back: $n item(s)"
          d=$(date +%F)
          mon=$(date -d "$d -$(( ($(date +%u) + 6) % 7 )) days" +%F)
          call PUT /api/profile "{\"profile\":{\"name\":\"Test\",\"goal\":\"half\",\"raceDate\":\"$(date -d "+12 weeks" +%F)\",\"weekly\":20,\"longest\":8,\"prDist\":\"10k\",\"prSec\":2900,\"lifts\":2,\"days\":[0,2,4,6],\"longDay\":6,\"weight\":180,\"goalWeight\":172,\"start\":\"$mon\"}}" | jq -e .ok > /dev/null
          note=$(call PUT /api/checkin "{\"date\":\"$d\",\"sleep_h\":6,\"sleep_q\":3,\"soreness\":3,\"energy\":3,\"stress\":3}")
          echo "morning coach note: $(echo "$note" | jq -c .)"
          [ "$(echo "$note" | jq -r '.note.headline // empty')" != "" ] || { echo "::error::no morning coach note: $note"; exit 1; }
          call PUT /api/checkin "{\"date\":\"$d\",\"sleep_h\":7,\"sleep_q\":4,\"soreness\":2,\"energy\":4,\"stress\":2}" | jq -e .ok > /dev/null
          call PUT /api/weight "{\"date\":\"$d\",\"lb\":181.4}" | jq -e .ok > /dev/null
          call POST /api/activity "{\"date\":\"$d\",\"type\":\"run\",\"mi\":3.1,\"minutes\":26}" | jq -e .activity.id > /dev/null
          me=$(call GET /api/me)
          echo "coach: $(echo "$me" | jq -c '{coach, push: .push.key != null, notes: (.notes | length), settings: .settings.tz}')"
          [ "$(echo "$me" | jq '.checkins | length')" = 1 ] && [ "$(echo "$me" | jq '.weights | length')" = 1 ] && [ "$(echo "$me" | jq '.activities | length')" = 1 ] || { echo "::error::tracking not saved: $me"; exit 1; }
          echo "check-in, weigh-in and workout saved; strava: $(echo "$me" | jq -c .strava)"
          key=$(call POST /api/import-key | jq -r .key); [ -n "$key" ] && [ "$key" != null ] || { echo "::error::couldn't make an Apple Health link"; exit 1; }
          r=$(curl -sS "$API/api/import?key=$key&weight=179.6%20lb&sleep=1%20hr%2010%20min%0A6%20hr%205%20min&rhr=52%20count%2Fmin&hrv=58%20ms%0A64%20ms&steps=12%2C034"); echo "$r" | jq -e '.saved.weight == 179.6 and .saved.sleep_h > 7.2 and .saved.sleep_h < 7.3 and .saved.rhr == 52 and .saved.hrv == 61 and .saved.steps == 12034' > /dev/null || { echo "::error::Apple Health import failed: $r"; exit 1; }
          [ "$(call GET /api/me | jq '.health | length')" = 1 ] || { echo "::error::watch data not returned"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/import?key=hl_wrongwrongwrongwrongwrong&weight=180")" = 401 ] || { echo "::error::a wrong Apple Health link was accepted"; exit 1; }
          [ "$(call GET /api/me | jq .health_link.on)" = true ] || { echo "::error::Apple Health link not shown as on"; exit 1; }
          echo "Apple Health link works (weight, sleep, resting HR, HRV, steps)"
          call PUT /api/account '{"name":"Smoke Two"}' | jq -e '.user.name == "Smoke Two"' > /dev/null || { echo "::error::name change failed"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/account/password" -H "Origin: $ORIGIN" -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d '{"current":"wrong-pass","next":"another-pass-1"}')" = 400 ] || { echo "::error::wrong current password was accepted"; exit 1; }
          call POST /api/account/password '{"current":"smoke-test-123","next":"smoke-test-456"}' | jq -e .ok > /dev/null || { echo "::error::password change failed"; exit 1; }
          call POST /api/account/password '{"current":"smoke-test-456","next":"smoke-test-123"}' | jq -e .ok > /dev/null || { echo "::error::password change back failed"; exit 1; }
          echo "name and password changes work"
          call POST /api/report '{"text":"Nightly test report. Please ignore.","screen":"today"}' | jq -e .ok > /dev/null || { echo "::error::problem report failed"; exit 1; }
          echo "problem report saved"
          if [ "$(echo "$me" | jq .strava.available)" = true ]; then
            u=$(call POST /api/strava/start | jq -r .url)
            echo "$u" | grep -q "redirect_uri=https%3A%2F%2Fhybrid-api.hybridapp.workers.dev%2Fapi%2Fstrava%2Fcallback" || { echo "::error::Strava start URL looks wrong: $u"; exit 1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u"); echo "Strava authorize page answered HTTP $code"
            echo "::notice::Connect Strava is on."
          fi
          call DELETE /api/account | jq -e .ok > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/login" -H "Origin: $ORIGIN" -H "Content-Type: application/json" -d "{\"email\":\"$email\",\"password\":\"smoke-test-123\"}")
          [ "$code" = 401 ] || { echo "::error::account not deleted ($code)"; exit 1; }
          echo "::notice::All checks passed: sign-up, AI typed meal, AI photo, food, check-in, weigh-in, Apple Health link, workout, delete."
