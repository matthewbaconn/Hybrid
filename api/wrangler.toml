name = "hybrid-api"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true
# hybrdrunning.com = website, app.hybrdrunning.com = the app (both proxied from GitHub Pages by this Worker).
# The old hybridrunnin.com addresses forward to the new ones.
routes = [
  { pattern = "hybridrunnin.com", custom_domain = true },
  { pattern = "www.hybridrunnin.com", custom_domain = true },
  { pattern = "app.hybridrunnin.com", custom_domain = true },
  { pattern = "hybrdrunning.com", custom_domain = true },
  { pattern = "www.hybrdrunning.com", custom_domain = true },
  { pattern = "app.hybrdrunning.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "hybrid"
database_id = "REPLACED_BY_DEPLOY_WORKFLOW"
migrations_dir = "migrations"

# Login/sign-up tries and food reads: 10 per minute per person (approximate, per Cloudflare location)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
APP_URL = "https://app.hybrdrunning.com/"

[triggers]
crons = ["*/15 * * * *"]

