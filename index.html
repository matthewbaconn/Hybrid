<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#800000">
<title>Hybrid</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid">
<meta name="description" content="Run and lift plans built around your goals.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout idea: a phone-first training app on a dark canvas. Raised cards, one colour per workout type,
   a floating four-tab bar (Today · Plan · Recovery · Training), and a setup flow that builds the plan. */
:root{
  --bg:#0A0B0F; --surface:#14161C; --sunk:#1E212B; --ink:#F5F6FA; --muted:#9CA3B4; --line:#2A2E3A;
  --accent:#800000; --accent-2:#D4585C; --accent-soft:#2B0B0D;
  --easy:#22D3EE; --long:#34D399; --work:#FACC15; --race:#FF4D5E; --lift:#FF6FB5; --rest:#7C8499; --swim:#60A5FA; --bike:#A3E635; --hyrox:#FB7185;
  --good:#34D399; --warn:#FACC15; --crit:#FF5C6C;
  --raise:linear-gradient(180deg,#1A1D26 0%,#13151B 100%);
  --sh:0 1px 0 rgba(255,255,255,.05) inset,0 12px 28px rgba(0,0,0,.38);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y;overscroll-behavior-y:none}
body{touch-action:pan-x pan-y}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
html,body{overflow-x:clip;max-width:100%}
body{margin:0;color:var(--ink);font:15px/1.55 var(--f-body);font-variant-numeric:tabular-nums;
  background:var(--bg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display);letter-spacing:-.02em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(118px + env(safe-area-inset-bottom,0px));display:grid;gap:28px;align-content:start;min-height:100vh;min-height:calc(100lvh + 1px)}

/* header */
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:5px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-2),var(--accent));flex:none}
.logo svg{width:20px;height:20px}
.brand b{font:800 19px/1 var(--f-display);letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:4px 10px;font:600 12px/1.2 var(--f-body);background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.demo{background:color-mix(in srgb,var(--work) 16%,transparent);color:var(--work)}
.iconbtn{margin-left:auto;width:40px;height:40px;border-radius:6px;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--ink);flex:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cards */
.card{background:var(--surface);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:22px;display:grid;gap:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;min-width:0}
.card-h .ic{display:none}
.card-h .lbl{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.card-h .lbl::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--tone,var(--muted));margin-right:10px;vertical-align:2px}
.card-h .r{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.sec-t{font:700 24px/1.15 var(--f-display);letter-spacing:-.03em}
.sub{color:var(--muted);font-size:14px}

/* greeting */
.hello h1{font:800 30px/1.1 var(--f-display);letter-spacing:-.035em}
.hello .sub{margin-top:6px}
.count{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* session hero */
.t-easy{--tc:var(--easy)} .t-long{--tc:var(--long)} .t-workout{--tc:var(--work)} .t-race{--tc:var(--race)} .t-lift{--tc:var(--lift)} .t-rest{--tc:var(--rest)} .t-swim{--tc:var(--swim)} .t-bike{--tc:var(--bike)} .t-hyrox{--tc:var(--hyrox)}
.hero{padding:0;overflow:hidden;gap:0}
.hero-h{padding:22px 20px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 64%,#000) 0%,color-mix(in srgb,var(--tc) 24%,#0A0B0F) 100%);display:flex;align-items:flex-start;gap:12px}
.hero-h .d{font:800 30px/1.05 var(--f-display);letter-spacing:-.035em}
.hero-h .dd{color:rgba(255,255,255,.85);font-size:13px;margin-top:4px}
.hero-h .chip{margin-left:auto;background:rgba(10,11,15,.42);color:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:6px;padding:5px 11px;font:600 12.5px/1.2 var(--f-body);white-space:nowrap;background:color-mix(in srgb,var(--tc,var(--muted)) 20%,transparent);color:var(--tc,var(--ink))}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hero-b{padding:20px;display:grid;gap:16px}
.sess + .sess{border-top:1px solid var(--line);padding-top:18px}
.sess{display:grid;gap:12px}
.sess-t{font:700 21px/1.2 var(--f-display);letter-spacing:-.02em}
.stats{display:flex;flex-wrap:wrap;gap:10px 0}
.stats div{display:flex;flex-direction:column-reverse;gap:2px;padding-right:18px;margin-right:18px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0;margin-right:0;padding-right:0}
.stats b{font:700 21px/1.2 var(--f-display);color:var(--tc,var(--ink));letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:baseline;line-height:1.5}
.steps li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--tc,var(--muted));transform:translateY(-2px)}
.steps b.pc{background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent);color:var(--tc,var(--accent));border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.why{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:12px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;border:0;background:var(--sunk);font-weight:600;color:var(--ink);transition:background-color .15s,opacity .15s,transform .15s}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled){background:#272B37}.btn.primary:hover:not(:disabled){background:#9A1010}}

/* fuel tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--sunk);border-radius:7px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.tile span{font-size:12.5px;color:var(--muted)}
.tile b{font:800 26px/1.15 var(--f-display);letter-spacing:-.03em}
.tile small{font-size:12px;color:var(--muted)}
.c-cal b{color:var(--accent-2)} .c-pro b{color:var(--lift)} .c-carb b{color:var(--work)} .c-fat b{color:var(--easy)}

/* progress */
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--easy),var(--accent))}

/* mini (tomorrow) */
.mini{display:flex;align-items:center;gap:14px;background:var(--sunk);border-radius:7px;padding:14px 16px;border-left:4px solid var(--tc,var(--rest))}
.mini div{min-width:0}
.mini b{display:block;font-weight:600}
.mini span{font-size:13px;color:var(--muted)}

/* connect */
.connect{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);font-weight:600}
.cbtn i{width:10px;height:10px;border-radius:50%}

/* plan tab */
.weekhead{display:flex;align-items:center;gap:10px}
.weekhead .mid{flex:1;text-align:center;min-width:0}
.weekhead .mid b{display:block;font:700 18px/1.2 var(--f-display)}
.weekhead .mid span{font-size:13px;color:var(--muted)}
.arrow{width:42px;height:42px;border-radius:6px;border:0;background:var(--sunk);font-size:20px;line-height:1;flex:none}
.arrow:disabled{opacity:.35}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sd{border:1px solid transparent;background:var(--sunk);border-radius:6px;padding:9px 0 8px;display:grid;justify-items:center;gap:4px;min-width:0}
.sd span{font:600 11px/1 var(--f-body);color:var(--muted)}
.sd b{font:700 16px/1 var(--f-display)}
.sd i{width:18px;height:4px;border-radius:3px;background:var(--tc,var(--line))}
.sd.now{border-color:var(--ink)}
.sd.on{background:var(--tc,var(--accent));color:#0A0B0F;box-shadow:0 8px 20px color-mix(in srgb,var(--tc,var(--accent)) 42%,transparent)}
.sd.on span,.sd.on b{color:#0A0B0F} .sd.on:not([class*="t-"]) span,.sd.on:not([class*="t-"]) b{color:#fff} .sd.on i{background:rgba(10,11,15,.55)}
.wkstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wkstats div{background:var(--sunk);border-radius:6px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.wkstats span{font-size:12px;color:var(--muted)} .wkstats b{font:800 20px/1.2 var(--f-display)}
.days{display:grid;gap:14px}
.day{padding:0;overflow:hidden;gap:0;scroll-margin-top:16px}
.day.today{box-shadow:0 0 0 1px var(--accent),0 12px 30px rgba(190,50,55,.2)}
.day-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,#14161C),color-mix(in srgb,var(--tc) 7%,#14161C))}
.day-h b{font:700 17px/1.2 var(--f-display);color:var(--tc)}
.day-h span{font-size:13px;color:var(--muted)}
.day-h .chip{margin-left:auto}
.day-b{padding:16px 18px;display:grid;gap:14px}
.day-b .sess-t{font-size:17px}
.day-b .stats b{font-size:17px}
.okmark{display:inline-flex;align-items:center;gap:5px;color:var(--good);font-size:13px;font-weight:600}

/* recovery */
.banner{border-radius:7px;padding:12px 14px;font-size:14px;background:color-mix(in srgb,var(--work) 12%,transparent);border:1px solid color-mix(in srgb,var(--work) 32%,transparent)}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.rg{display:grid;justify-items:center;gap:6px;padding:4px 6px;min-width:0}
.rg + .rg{border-left:1px solid var(--line)}
.rg-w{position:relative;width:min(100%,104px);aspect-ratio:1}
.rg-w svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.rg-w b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px/1 var(--f-display);white-space:nowrap}
.rg > span{font:700 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.rg > small{font-size:12px;color:var(--muted);text-align:center}
.verdict{border-radius:7px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--good) 24%,#14161C),#14161C 75%);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);display:grid;gap:4px}
.verdict b{font:700 19px/1.2 var(--f-display);color:var(--good)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.rules li i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--c)}

/* training */
.preds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preds div{background:var(--sunk);border-radius:6px;padding:12px 14px;display:grid;gap:2px}
.preds span{font-size:12.5px;color:var(--muted)} .preds b{font:800 22px/1.2 var(--f-display);letter-spacing:-.02em}
.preds .goal{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.paces{display:grid;gap:8px}
.pz{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:6px;padding:12px 14px;border-left:4px solid var(--tc)}
.pz div{min-width:0;flex:1} .pz b{display:block;font-weight:600} .pz span{font-size:12.5px;color:var(--muted)}
.pz em{font-style:normal;font:700 16px/1.2 var(--f-display);color:var(--tc);white-space:nowrap}
.chart{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:500 10px var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}

/* tab bar */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px;
  border:1px solid rgba(255,255,255,.09);border-radius:8px;background:#181B23;box-shadow:0 14px 34px rgba(0,0,0,.6);max-width:520px;margin:0 auto}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:5px;padding:9px 0;border-radius:7px;color:var(--muted);font:600 11px/1 var(--f-body);letter-spacing:-.01em;min-width:0;transition:background-color .15s,color .15s}
.tabbar button .ic{width:19px;height:19px}
.tabbar [data-tab="today"]{--tabc:var(--accent)} .tabbar [data-tab="plan"]{--tabc:var(--easy)} .tabbar [data-tab="recovery"]{--tabc:var(--long)} .tabbar [data-tab="training"]{--tabc:var(--work)} .tabbar [data-tab="activities"]{--tabc:var(--lift)}
.tabbar button[aria-current="page"]{background:var(--tabc);color:#0A0B0F} .tabbar [data-tab="today"][aria-current="page"]{color:#fff}

/* food log inside the fuel card */
.food-in{display:grid;gap:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:18px;margin-top:2px}
/* activities */
.afilt{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.afilt button{border:0;border-radius:6px;padding:9px 15px;background:var(--sunk);color:var(--muted);font:600 13.5px var(--f-body);white-space:nowrap}
.afilt button[aria-pressed="true"]{background:var(--lift);color:#0A0B0F}
.wsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wsum div{background:var(--sunk);border-radius:6px;padding:12px}
.wsum span{display:block;font-size:12px;color:var(--muted)} .wsum b{font:800 21px/1.2 var(--f-display);white-space:nowrap}
.actc{cursor:pointer;padding:0;overflow:hidden;gap:0}
.actc .ah{display:flex;gap:12px;align-items:center;padding:18px 18px 0}
.actc .aic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--tc)}
.actc .aic .ic{width:20px;height:20px}
.actc .ah b{display:block;font-weight:600;font-size:14px} .actc .ah span{font-size:13px;color:var(--muted)}
.actc h3{margin:12px 18px 0;font:800 21px/1.2 var(--f-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.ast{display:flex;flex-wrap:wrap;gap:6px 26px;padding:12px 18px 16px}
.ast span{display:block;font-size:12.5px;color:var(--muted)} .ast b{font:700 20px/1.25 var(--f-display);white-space:nowrap}
.amap{height:200px;background:#0F1218;position:relative;border-top:1px solid rgba(255,255,255,.06)}
.amap.big{height:300px;border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.amap > svg{position:absolute;inset:0;width:100%;height:100%}
.amap .leaflet-container,.amap.leaflet-container{background:#0F1218;font:11px var(--f-body)}
.amap .leaflet-control-attribution{background:rgba(10,11,15,.7)!important;color:var(--muted)!important}
.amap .leaflet-control-attribution a{color:var(--muted)!important}
.adet-h{display:flex;align-items:center;gap:10px}
.adet-h .arrow{flex:none}
.adet-h h1{font:800 24px/1.2 var(--f-display);margin:0;overflow-wrap:anywhere}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.agrid span{display:block;font-size:12.5px;color:var(--muted)} .agrid b{font:700 20px/1.25 var(--f-display)}
.splits{display:grid;gap:6px;font-size:14px}
.splits .sp{display:grid;grid-template-columns:34px 52px 1fr 46px;gap:10px;align-items:center}
.splits .sp.hd{font-size:12px;color:var(--muted)}
.splits .sp i{display:block;height:10px;border-radius:999px;background:var(--easy)}
.splits .sp em{font-style:normal;text-align:right;color:var(--muted)}
.wtiles small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.rpl{display:grid;gap:10px}
.rp{background:var(--sunk);border-radius:6px;padding:12px;display:grid;gap:6px}
.rp p{margin:0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere} .rp span{font-size:12px;color:var(--muted)}
.hlink{display:grid;gap:12px}
.wl{display:flex;align-items:center;gap:12px}
.wl div{flex:1;min-width:0} .wl b{display:block;font-weight:600;font-size:14.5px} .wl span{font-size:12.5px;color:var(--muted)}
.wl .btn{min-height:36px;padding:0 14px;flex:none}
.wl em.ok{font-style:normal;font-size:13px;font-weight:600;color:var(--long);flex:none}
.steps-plain{margin:0;padding-left:20px;display:grid;gap:14px;font-size:14.5px}
.steps-plain li{padding-left:4px} .steps-plain input{margin:10px 0 8px;font-size:13px}

/* progress (Endorphins-style dashboard) */
.prog-h{display:flex;align-items:baseline;justify-content:space-between}
.prog-h h2{font:800 24px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.prog-h button{border:0;background:none;color:var(--accent-2);font-weight:600;font-size:15px;padding:4px 0}
.prog-top{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-6px}
.prog-top span{display:block;font-size:13px;color:var(--muted)} .prog-top b{font:800 42px/1 var(--f-display);letter-spacing:-.04em} .prog-top b small{font:600 16px var(--f-body);color:var(--muted);margin-left:3px}
.prog-top .rt{text-align:right} .prog-top .rt b{font-size:26px}
.prog-top em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:6px}
.pchart{display:block;width:100%;height:auto;touch-action:pan-y}
.pchart text{fill:var(--muted);font:500 11px var(--f-body)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0;text-align:left;color:var(--ink)}
.pc.wide{grid-column:1/-1}
.pc[data-act]{cursor:pointer}
.pc .ph{display:flex;align-items:center;gap:8px;font:700 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}

  display:grid;place-items:center;opacity:0;transform:translateY(-50px);will-change:transform,opacity;pointer-events:none}

/* opening animation: the logo draws itself, then fills (transform/opacity/stroke only, so it stays smooth) */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:18px;will-change:opacity,transform}
#splash .sp-logo{width:104px;height:104px;border-radius:24px;background:var(--accent);display:grid;place-items:center;transform:scale(.6);opacity:0;will-change:transform,opacity;
  animation:sp-pop .55s cubic-bezier(.2,.9,.25,1.15) .05s forwards}
#splash svg{width:56px;height:56px;overflow:visible}
#splash path{fill:#fff;fill-opacity:0;stroke:#fff;stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:sp-draw .8s cubic-bezier(.65,0,.35,1) .25s forwards,sp-fill .3s ease-out 1s forwards}
#splash b{font:800 26px/1 var(--f-display);letter-spacing:-.03em;opacity:0;transform:translateY(8px);will-change:transform,opacity;animation:sp-up .45s cubic-bezier(.2,.8,.2,1) .9s forwards}
#splash.out{animation:sp-out .38s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
@keyframes sp-pop{to{transform:scale(1);opacity:1}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-fill{to{fill-opacity:1}}
@keyframes sp-up{to{opacity:1;transform:none}}
@keyframes sp-out{to{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

                set(v){ try { localStorage.setItem("hp-demo-v1", JSON.stringify(v)); } catch(e){} } };

/* ============ state ============ */

  weekly: 20, longest: 8, prDist:"10k", prSec: 48 * 60 + 30, easyPace: null, weight: 178, goalWeight: 172, lifts: 3, liftExp:"Some", days:[1,2,3,5,6], longDay: 6};

const API = "https://hybrid-api.hybridapp.workers.dev";

  const show = (dist, spin) => { const p = Math.min(1, dist / GO); ptr.style.opacity = p; ptr.style.transform = "translateY(" + (Math.min(dist, MAX) * .6 - 50 + 50 * p) + "px) rotate(" + dist * 3 + "deg)"; appEl.style.transform = dist ? "translateY(" + Math.min(dist, MAX) * .4 + "px)" : ""; if (spin) ptr.classList.add("go"); };

    h += '<span class="r">' + (wk != null ? (wk <= 0 ? '−' : '+') + Math.abs(wk).toFixed(1) + ' lb this week' : '') + '</span></div>' + lineChart(series, "Daily weigh-ins and 7-day average over 6 weeks") +
      '<div class="legend"><span><i style="--c:var(--lift)"></i>7-day average</span><span><i style="--c:var(--muted)"></i>Weigh-ins</span>' + (p.goalWeight ? '<span><i style="--c:var(--long)"></i>Goal ' + p.goalWeight + ' lb</span>' : '') + '</div>' +
      (wk != null && p.goalWeight && p.goalWeight < a ? '<p class="sub">' + (-wk > 1.5 ? 'Losing over 1.5 lb a week can cost muscle. Eating a bit more on training days helps.' : -wk >= .4 ? 'Losing at a muscle-safe pace. Keep going.' : 'Weight is holding steady. If that lasts two weeks, trim about 150 cal a day.') + '</p>' : '');
  } else h += '</div><p class="sub">Weigh in on a few mornings and your trend shows here. The 7-day average smooths out water-weight swings.</p>';
  h += '</section>';
  // calories, last 7 days
  const d7 = Array.from({length: 7}, (_, i) => addDays(TODAY, i - 6)), eatenV = d7.map(d => (food[d] || []).length ? eaten(d).cal : null);
  const tg = d7.map(d => fuelFor(p, dayOf(d), d).cal), logged = eatenV.filter(v => v != null);
  const ae = logged.length ? logged.reduce((a, b) => a + b, 0) / logged.length : null, at = tg.reduce((a, b) => a + b, 0) / 7;
  h += '<section class="card" style="--tone:var(--accent-2)"><div class="card-h">' + ic("fork") + '<span class="lbl">Calories · last 7 days</span><span class="r">' + logged.length + ' of 7 days logged</span></div>' +
    barChart(eatenV, d7.map(d => DAYS[dow(d)].slice(0, 1)), (v, i) => v > tg[i] + 150 ? "var(--crit)" : v < tg[i] - 400 ? "var(--work)" : "var(--accent-2)", Math.round(at), null, "Calories eaten each day for the last 7 days, dashed line is your average target") +
    (ae != null ? '<div class="wkstats"><div><span>Avg eaten</span><b>' + comma(ae) + '</b></div><div><span>Avg target</span><b>' + comma(at) + '</b></div><div><span>Difference</span><b style="color:var(--' + (Math.abs(ae - at) < 150 ? 'good' : ae > at ? 'crit' : 'warn') + ')">' + (ae - at >= 0 ? '+' : '−') + comma(Math.abs(ae - at)) + '</b></div></div>' +
      '<p class="sub">' + (Math.abs(ae - at) < 150 ? 'Right on target. This is the pace that gets you to your goal.' : ae > at ? 'A bit over on average. Logging every meal, snacks included, makes this easy to fix.' : 'Under target on average. Eating too little makes training harder and costs muscle.') + '</p>'
      : '<p class="sub">Log your food for a few days and your weekly average shows here.</p>') + '</section>';
  return h;
}


/* ============ weather + heat, fuel tips, race card, calorie check, sync line ============ */
const WMO = {0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 80: "Showers", 81: "Showers", 82: "Heavy showers", 95: "Thunderstorms", 96: "Thunderstorms", 99: "Thunderstorms"};
let wx = null, wxState = "idle", wxErr = "";
const wxLoc = () => { if (uset.lat != null) return {lat: uset.lat, lon: uset.lon, place: uset.place || "Your area"}; try { return JSON.parse(localStorage.getItem("hp-wxloc") || "null"); } catch(e){ return null; } };
async function loadWeather(force){
  const L = wxLoc(); if (!L || wxState === "loading") return;
  const key = "hp-wx-" + L.lat + "," + L.lon;
  if (!force){ try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c && Date.now() - c.at < 45 * 60e3){ wx = c.data; wxState = "ok"; return; } } catch(e){} }
  wxState = "loading";
  try {
    const u = "https://api.open-meteo.com/v1/forecast?latitude=" + L.lat + "&longitude=" + L.lon + "&hourly=temperature_2m,apparent_temperature,dew_point_2m,precipitation_probability,weather_code&current=temperature_2m,apparent_temperature,dew_point_2m,weather_code&daily=temperature_2m_min,temperature_2m_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=3";
    const r = await fetch(u); if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), h = j.hourly;
    wx = {place: L.place, now: {temp_f: Math.round(j.current.temperature_2m), feels_f: Math.round(j.current.apparent_temperature), dew_f: Math.round(j.current.dew_point_2m), cond: WMO[j.current.weather_code] || "—"},
      today: {lo_f: Math.round(j.daily.temperature_2m_min[0]), hi_f: Math.round(j.daily.temperature_2m_max[0])},
      hours: h.time.map((t, i) => ({t: t.slice(0, 13) + ":00", temp_f: h.temperature_2m[i], feels_f: h.apparent_temperature[i], dew_f: h.dew_point_2m[i], precip_pct: h.precipitation_probability[i], cond: WMO[h.weather_code[i]] || ""}))};
    wx.now.precip_pct = (wx.hours.find(x => x.t.slice(0, 13) === new Date().toISOString().slice(0, 13)) || wx.hours[0] || {}).precip_pct;
    try { localStorage.setItem(key, JSON.stringify({at: Date.now(), data: wx})); } catch(e){}
    wxState = "ok"; wxErr = "";
  } catch(e){ wxState = "error"; wxErr = "Couldn't load the forecast. Check your signal."; }
  safeRender();
}
function heatToday(){
  if (!wx) return null;
  const rt = uset.run_time || "07:00", key = TODAY + "T" + rt.slice(0, 2) + ":00";
  const hrs = wx.hours.filter(x => x.t >= key && x.t < TODAY + "T" + String(Math.min(23, +rt.slice(0, 2) + 2)).padStart(2, "0") + ":00");
  if (!hrs.length) return null;
  const worst = hrs.reduce((a, b) => (b.temp_f + b.dew_f > a.temp_f + a.dew_f ? b : a));
  return {pct: HP.heatPct(worst.temp_f, worst.dew_f), temp: Math.round(worst.temp_f), dew: Math.round(worst.dew_f), hour: +worst.t.slice(11, 13)};
}
const hr12 = h => (h % 12 || 12) + (h < 12 ? " AM" : " PM");
function setWxLoc(lat, lon, place){

}
function weatherCard(){

  if (!L || wxState === "pick") return h + '<p class="sub">See the best time to run, and get workout paces adjusted for heat like your watch would.</p>' +

  const n = wx.now, nowKey = TODAY + "T" + String(new Date().getHours()).padStart(2, "0") + ":00", b = HP.bestWindow(wx.hours, nowKey, addDays(TODAY, 1)), ht = heatToday();
  h += '<div class="wx-top"><div class="wx-t">' + n.temp_f + '°</div><div class="wx-c"><b>' + esc(n.cond) + '</b><span>' + esc(wx.place) + '</span></div></div>' +

  if (b) h += '<div class="wx-best"><b>Best time to run</b><span>' + (b.day === TODAY ? "Today" : "Tomorrow") + ' ' + hr12(b.h0) + '–' + hr12(b.h0 + 3) + ' · ' + (b.lo === b.hi ? b.lo + '°' : b.lo + '–' + b.hi + '°') + '</span></div>';

  if (ht && ht.pct >= .01) h += '<p class="fbnote">' + ic("sun") + '<span>Around ' + hr12(ht.hour) + ' it\'ll be ' + ht.temp + '°F with a ' + ht.dew + '° dew point, so today\'s outdoor workout paces are ' + Math.round(ht.pct * 100 * 10) / 10 + '% slower. On a treadmill, run the normal paces.</span></p>';
  return h + '</section>';
}

function calCheck(){
  const end = addDays(TODAY, -1), start = addDays(end, -13);
  let food = 0, nFood = 0, maint = 0, n = 0;
  for (let d = start; d <= end; d = addDays(d, 1)){
    const c = eaten(d).cal; if (c >= 1200){ food += c; nFood++; }
    const W = HP.avgW(weights, d) || plan.profile.weight || 170; maint += W * 13 + acts.filter(a => a.date === d).reduce((t, a) => t + HP.burnOf(a, W), 0); n++;
  }
  const a1 = HP.avgW(weights, end), a0 = HP.avgW(weights, addDays(end, -13));
  if (nFood < 10 || !a1 || !a0) return {need: Math.max(1, 10 - nFood), weighed: !!(a1 && a0)};
  const intake = food / nFood, real = Math.round((intake + (a0 - a1) * 3500 / 14) / 10) * 10, planM = Math.round(maint / n / 10) * 10;
  return {intake: Math.round(intake), real, plan: planM, lbWk: Math.round((a0 - a1) / 2 * 10) / 10, nFood};
}
function calCheckCard(){
  const c = calCheck();
  let h = '<section class="card" style="--tone:var(--work)"><div class="card-h">' + ic("gauge") + '<span class="lbl">Calorie check · 14 days</span></div>';
  if (c.need) return h + '<p class="sub">Needs about ' + c.need + ' more day' + (c.need === 1 ? '' : 's') + ' of food logged' + (c.weighed ? '' : ', and weigh-ins at the start and end of the two weeks,') + ' to compare what you really burn with what the plan assumes.</p></section>';
  const gap = c.real - c.plan;
  return h + '<div class="wkstats"><div><span>Eaten</span><b>' + comma(c.intake) + '</b></div><div><span>Real burn</span><b>' + comma(c.real) + '</b></div><div><span>Plan thinks</span><b>' + comma(c.plan) + '</b></div></div>' +
    '<p class="sub">' + (Math.abs(gap) < 150 ? 'The plan matches your real burn.' : gap > 0 ? 'You burn about ' + comma(gap) + ' more a day than the plan assumes. Eat a little more on training days.' : 'You burn about ' + comma(-gap) + ' less a day than the plan assumes. The weekly rule will trim the deficit if your weight stalls.') +
    ' Weight is ' + (c.lbWk >= 0 ? 'down ' : 'up ') + Math.abs(c.lbWk) + ' lb a week.</p></section>';
}

/* ============ food log ============
   Photo and text logging go through the food relay (a small Cloudflare Worker that holds the AI key;
   the key never reaches this page). Only signed-in accounts can use photo reading; otherwise manual entry. */
const aiOn = () => mode === "account";
const MEALS = ["Breakfast","Lunch","Dinner","Snack"];
let fs = {busy:false, photo:null, text:"", meal:null, err:"", manual:false, note:""}, fdate = TODAY;
function mealNow(){ const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 15 ? "Lunch" : h < 21 ? "Dinner" : "Snack"; }
const n0 = x => { x = +x; return isFinite(x) && x >= 0 ? Math.round(x) : 0; };
function eaten(date){ return (food[date] || []).reduce((a, x) => ({cal: a.cal + n0(x.cal), protein: a.protein + n0(x.protein), carbs: a.carbs + n0(x.carbs), fat: a.fat + n0(x.fat)}), {cal:0, protein:0, carbs:0, fat:0}); }
function captureFood(){ const t = document.getElementById("food-text"), m = document.getElementById("food-meal"); if (t) fs.text = t.value; if (m) fs.meal = m.value; }
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't a photo this phone can read.")); i.src = url; });
    const k = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .8);
  } finally { URL.revokeObjectURL(url); }
}
async function askFood(text, photo){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 45000);
  try {
    const body = {text: text || ""};
    if (photo){ body.image = photo.split(",")[1]; body.mediaType = "image/jpeg"; }
    let r;
    try { r = await fetch(API + "/api/food/analyze", {method:"POST", headers:{"Content-Type":"application/json", Authorization: "Bearer " + token}, body: JSON.stringify(body), signal: ctl.signal}); }
    catch(e){ if (e.name === "AbortError") throw e; throw new Error("Couldn't reach the server. Check your signal and try again."); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || (r.status === 429 ? "Too many requests. Wait a minute and try again." : "Couldn't read that right now."));
    const items = (Array.isArray(j.items) ? j.items : []).filter(x => x && x.name).slice(0, 12);
    if (!items.length) throw new Error(j.note || "Couldn't find any food in that. Try a clearer photo or add a few words.");
    return {items, note: j.note || ""};
  } catch(e){ throw e.name === "AbortError" ? new Error("That took too long. Check your signal and try again.") : e; }
  finally { clearTimeout(timer); }
}
async function addFood(meal, items){
  const list = food[fdate] = food[fdate] || [];
  if (mode === "account"){ const j = await api("POST", "/api/food", {date: fdate, meal, items}); j.items.forEach(x => list.push(x)); return; }
  items.forEach((x, i) => list.push({id: Date.now().toString(36) + i, meal, name: String(x.name).slice(0, 80), cal: n0(x.cal), protein: n0(x.protein), carbs: n0(x.carbs), fat: n0(x.fat)}));
  save();
}

/* ============ strength log: weights per exercise and what to try next ============ */
let liftLog = S.lifts || [], liftOpen = {};
const exName = st => String(st).replace(/\s+\d+\s*[×x].*$/, "").replace(/\s+\d+\s*(rounds?|min).*$/i, "").trim();
const exScheme = st => (String(st).match(/(\d+\s*[×x]\s*[^,]+)$/) || [])[1] || "";
function liftHint(ex){
  const xs = liftLog.filter(x => x.ex.toLowerCase() === ex.toLowerCase()).sort((a, b) => b.date.localeCompare(a.date)), last = xs[0];
  if (!last) return {text: /plank|push-?up|pull-?up|chin|dip|lunge|step-?up|bridge|dead bug|bird dog|carry|hang|jump|bound/i.test(ex) && !/db|dumbbell|barbell|weighted/i.test(ex) ? "Bodyweight is fine. Add weight if it feels easy." : "First time: pick a weight that leaves 2 reps in the tank.", next: null};
  if (!last.weight) return {text: "Last time: bodyweight" + (last.hit ? ", all reps. Try 1–2 more reps." : ". Same reps again."), next: null};
  const inc = /squat|deadlift|rdl|hip thrust|leg press|trap/i.test(ex) ? 10 : 5;
  let next = last.weight, why = "";
  if (last.hit){ next = last.weight + inc; why = "all reps last time"; }
  else if (xs[1] && !xs[1].hit && xs[1].weight === last.weight){ next = Math.max(0, Math.round(last.weight * .9 / 5) * 5); why = "missed reps twice, so ease back"; }
  else why = "missed some reps, so repeat it";
  return {text: "Last " + fmtD(last.date) + ": " + last.weight + " lb" + (last.hit ? " ✓" : "") + ". Try " + next + " lb (" + why + ").", next};
}
function liftLogHtml(s, key){
  if (s.type !== "lift") return '';
  const open = liftOpen[key], date = key.slice(0, 10);
  if (!open) return '<button class="linkbtn" type="button" data-act="lopen" data-key="' + key + '">' + ic("dumbbell") + ' Log weights</button>';
  const rows = s.steps.map((st, i) => {
    const ex = exName(st[0]), h = liftHint(ex), today = liftLog.find(x => x.date === date && x.ex.toLowerCase() === ex.toLowerCase());
    return '<div class="lrow"><div><b>' + esc(ex) + '</b><span>' + esc(exScheme(st[0])) + ' · ' + esc(h.text) + '</span></div>' +
      '<label class="lw"><input inputmode="decimal" id="lw-' + i + '" placeholder="' + (h.next != null ? h.next : '') + '" value="' + (today && today.weight != null ? today.weight : '') + '" aria-label="' + esc(ex) + ' weight in pounds"><small>lb</small></label>' +
      '<label class="lh"><input type="checkbox" id="lh-' + i + '"' + (!today || today.hit ? ' checked' : '') + '><small>All reps</small></label></div>';
  }).join("");
  return '<div class="liftlog">' + rows + '<div class="fbtns"><button class="btn" type="button" data-act="lclose" data-key="' + key + '">Close</button><button class="btn primary" type="button" data-act="lsave" data-key="' + key + '">Save weights</button></div><p class="fine">Leave weight empty for bodyweight moves. Next time, Hybrid suggests the weight to try.</p></div>';
}

/* ============ race fueling and hydration ============ */
let fp = null;
function raceMinutes(){
  const p = plan.profile, rs = plan.raceDate ? (dayOf(plan.raceDate) || {sessions: []}).sessions.find(s => s.type === "race") : null;
  if (rs && rs.min) return rs.min;
  if (plan.pred[p.goal]) return Math.round((p.goalSec || plan.pred[p.goal]) / 60);
  if (p.goal === "50k") return Math.round(plan.pred.marathon * 1.35 / 60);
  return 90;
}
function fuelPlanHtml(){
  const W = weightNow(), v = fp || (fp = {min: raceMinutes(), temp: 70});
  const est = Math.round(Math.max(12, Math.min(48, 24 * (W / 160) * (1 + Math.max(0, v.temp - 60) * .012))));
  const sweat = uset.sweat_oz || est, measured = !!uset.sweat_oz, hrs = v.min / 60;
  const carbs = v.min < 75 ? 0 : v.min < 150 ? 45 : v.min < 240 ? 65 : 80;
  const fluid = Math.min(27, Math.round(sweat * .7)), sodium = sweat >= 32 ? 700 : sweat >= 22 ? 500 : 350;
  const gels = carbs ? Math.ceil(carbs * Math.max(0, hrs - .25) / 25) : 0, bottles = Math.round(fluid * hrs / 20 * 10) / 10;
  let h = '<section class="card form"><div class="card-h" style="--tone:var(--work)"><span class="lbl">Your race</span><span class="r">' + esc(HP.raceName(plan.profile)) + '</span></div>' +
    '<div class="two"><label>Expected time<small>Hours:minutes</small><input id="fp-time" inputmode="numeric" value="' + Math.floor(v.min / 60) + ':' + String(v.min % 60).padStart(2, "0") + '" placeholder="1:45"></label><label>Temperature<small>Race-day forecast</small><span class="unit"><input id="fp-temp" inputmode="numeric" value="' + v.temp + '"> °F</span></label></div>' +
    '<button class="btn" type="button" data-act="fpcalc">Update plan</button></section>';
  if (plan.profile.goal === "swim") h += '<section class="card"><p class="sub">Swims are different: you can\'t eat or drink much in the water. Eat a carb-rich meal 2–3 hours before, and only use the numbers below at feed stops in long swims (5K and up).</p></section>';
  h += '<section class="card"><div class="card-h" style="--tone:var(--long)"><span class="lbl">Per hour</span><span class="r">after the first 15 min</span></div><div class="wsum">' +
    '<div><span>Carbs</span><b>' + (carbs ? carbs + ' g' : 'Optional') + '</b></div><div><span>Fluid</span><b>' + fluid + ' oz</b></div><div><span>Sodium</span><b>' + sodium + ' mg</b></div></div>' +
    '<p class="sub">' + (carbs ? 'That\'s about ' + gels + ' gel' + (gels === 1 ? '' : 's') + ' worth of carbs in total (25 g each). Mix gels, drink mix and chews however you like: roughly one gel every ' + Math.max(20, Math.round(60 * 25 / carbs)) + ' minutes. ' : 'Under about 75 minutes, water is enough. A gel is optional. ') +
    'Drink about ' + Math.round(fluid / 4) + ' oz every 15 min' + (bottles >= .5 ? ' (around ' + bottles + ' bottles of 20 oz in total)' : '') + '. Get sodium from electrolyte drink, salt tabs or salty gels.</p>' +
    '<p class="fine">Based on ' + (measured ? 'your measured sweat rate of ' + sweat + ' oz an hour' : 'an estimate of ' + est + ' oz an hour for your weight and the heat. Do the sweat test below for a real number') + '. Fluid is capped at 27 oz an hour: drinking more than you sweat can be dangerous. Drink to thirst, practise this in long training sessions, and use nothing new on race day.</p></section>';
  h += '<section class="card form"><div class="card-h" style="--tone:var(--easy)"><span class="lbl">Sweat test</span><span class="r">' + (measured ? sweat + ' oz/h saved' : 'not done yet') + '</span></div>' +
    '<p class="sub">Weigh yourself without clothes, go for a steady 60-minute session in race-like weather, note what you drink, then weigh again after drying off.</p>' +
    '<div class="two"><label>Weight before<span class="unit"><input id="sw-pre" inputmode="decimal"> lb</span></label><label>Weight after<span class="unit"><input id="sw-post" inputmode="decimal"> lb</span></label></div>' +
    '<div class="two"><label>Drank during<span class="unit"><input id="sw-oz" inputmode="decimal" value="0"> oz</span></label><label>Minutes<input id="sw-min" inputmode="numeric" value="60"></label></div>' +
    (v.err ? '<p class="err" role="alert">' + esc(v.err) + '</p>' : '') + '<button class="btn primary block" type="button" data-act="swsave">Save my sweat rate</button></section>';
  return h;

/* ============ barcode scanning (ZXing, loaded only when used) + Open Food Facts ============ */
let bc = null, ZXP = null;
function zxing(){
  if (ZXP) return ZXP;
  ZXP = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = "vendor/zxing/zxing-reader.js";
    s.onload = () => { try { ZXingWASM.prepareZXingModule({overrides: {locateFile: (path, prefix) => path.endsWith(".wasm") ? new URL("vendor/zxing/" + path, location.href).href : prefix + path}, fireImmediately: true}); ok(ZXingWASM); } catch(e){ no(e); } };
    s.onerror = () => { ZXP = null; no(new Error("scanner")); }; document.head.appendChild(s);
  });
  return ZXP;
}
async function scanBarcode(file){
  bc = {busy: true}; fs.err = ""; render();
  try {
    const Z = await zxing(), res = await Z.readBarcodes(file, {formats: ["EAN13", "EAN8", "UPCA", "UPCE"], tryHarder: true, maxNumberOfSymbols: 1});
    if (!res.length || !res[0].text){ bc = {err: "Couldn't read a barcode. Get closer, in good light, or type the number under it.", manual: true}; render(); return; }
    await lookupBarcode(res[0].text);
  } catch(e){ bc = {err: "The scanner didn't load. Type the number under the barcode instead.", manual: true}; render(); }
}
async function lookupBarcode(code){
  code = String(code).replace(/\D/g, "");
  if (code.length < 8){ bc = {err: "Barcodes are 8 to 13 digits.", manual: true, code}; render(); return; }
  bc = {busy: true, code}; render();
  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + code + ".json?fields=product_name,brands,nutriments,serving_size,serving_quantity");
    const j = await r.json(), p = j && j.status === 1 ? j.product : null, n = p && p.nutriments || {};
    const per = (k) => n[k + "_serving"] != null ? Number(n[k + "_serving"]) : null, per100 = k => n[k + "_100g"] != null ? Number(n[k + "_100g"]) : null;
    const hasServ = per("energy-kcal") != null;
    if (!p || (!hasServ && per100("energy-kcal") == null)){ bc = {err: "That product isn't in the food database yet. Take a photo of the label instead.", manual: true, code}; render(); return; }
    bc = {code, name: [p.brands && String(p.brands).split(",")[0], p.product_name].filter(Boolean).join(" ") || "Scanned food", basis: hasServ ? (p.serving_size || "1 serving") : "100 g",
      kcal: hasServ ? per("energy-kcal") : per100("energy-kcal"), p: (hasServ ? per("proteins") : per100("proteins")) || 0, c: (hasServ ? per("carbohydrates") : per100("carbohydrates")) || 0, f: (hasServ ? per("fat") : per100("fat")) || 0, qty: 1};
  } catch(e){ bc = {err: "Couldn't reach the food database. Check your connection and try again.", manual: true, code}; }
  render();
}
function barcodeHtml(){
  let h = '<label class="cam">' + ic("bars") + '<span>Scan barcode</span><input type="file" id="food-barcode" accept="image/*" capture="environment" aria-label="Take a photo of a barcode"></label>';
  if (!bc) return h;
  if (bc.busy) return h + '<p class="sub">Reading the barcode…</p>';
  if (bc.name){
    const q = bc.qty, r = x => Math.round(x * q);
    return h + '<div class="bcres"><b>' + esc(bc.name) + '</b><span>' + comma(r(bc.kcal)) + ' cal · P ' + r(bc.p) + ' · C ' + r(bc.c) + ' · F ' + r(bc.f) + ' · ' + (q === 1 ? '' : q + ' × ') + esc(bc.basis) + '</span>' +
      '<div class="fbtns"><button class="btn" type="button" data-act="bcq" data-d="-0.5" aria-label="Less">−</button><b class="bcq">' + q + '</b><button class="btn" type="button" data-act="bcq" data-d="0.5" aria-label="More">+</button><button class="btn primary" type="button" data-act="bcadd">Add</button><button class="linkbtn" type="button" data-act="bcclear">Cancel</button></div>' +
      '<p class="fine">From Open Food Facts, a public database. Numbers can be off; check the label.</p></div>';
  }
  return h + (bc.err ? '<p class="err" role="alert">' + esc(bc.err) + '</p>' : '') +
    '<div class="fbtns"><input id="bc-code" inputmode="numeric" placeholder="Barcode number" value="' + esc(bc.code || "") + '" aria-label="Barcode number"><button class="btn" type="button" data-act="bclook">Look up</button><button class="linkbtn" type="button" data-act="bcclear">Cancel</button></div>';
}

/* ============ meal prep + grocery list ============ */

function mealTargets(){
  let c = 0, pr = 0, n = 0;
  for (let i = 0; i < 7; i++){ const d = addDays(TODAY, i), f = fuelFor(plan.profile, dayOf(d), d); c += f.cal; pr += f.pro; n++; }
  return {cal: Math.max(1500, Math.round(c / n / 10) * 10), protein: Math.round(pr / n)};
}
function groceryDone(){ try { return JSON.parse(localStorage.getItem("hy-groc-" + (mealplan && mealplan.id)) || "{}"); } catch(e){ return {}; } }

function b64uToBytes(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); const raw = atob(s + "===".slice((s.length + 3) % 4)); return Uint8Array.from(raw, c => c.charCodeAt(0)); }

tab = ["today","plan","activities","recovery","training"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
render();
let upd = null; try { upd = JSON.parse(sessionStorage.getItem("hy-upd") || "null"); sessionStorage.removeItem("hy-upd"); } catch(e){}
if (upd && Date.now() - upd.at < 30e3){
  const sp = document.getElementById("splash"); if (sp) sp.remove();
  if (upd.tab) tab = upd.tab; if (upd.scr && SCR_T[upd.scr]) scr = upd.scr;
  render(); setTimeout(() => window.scrollTo(0, upd.y || 0), 60);
}
let splashReady = !token;
function hideSplash(){
  const el = document.getElementById("splash"); if (!el || el.classList.contains("out")) return;
  const wait = Math.max(0, 1450 - (performance.now() - (window.__splashAt || 0)));
  setTimeout(() => { el.classList.add("out"); el.addEventListener("animationend", () => el.remove(), {once: true}); setTimeout(() => el.remove(), 700); }, wait);
}
if (splashReady) hideSplash(); else setTimeout(hideSplash, 4000);
if (token) api("GET", "/api/me").then(j => { loadAccount(j); loading = false; render(); if (upd && upd.y) window.scrollTo(0, upd.y); hideSplash(); stravaReturn(); autoSync(true); if (pushOK()) checkPush().then(() => safeRender()); })
  .catch(e => { loading = false; if (token){ mode = "none"; plan = null; } render(); hideSplash(); toast(e.message); });
})();
</script>
