name: Recent server events
# Manual. The repo and this log are PUBLIC (Matthew, Nov 17, 2026): prints only totals per event type (successes and
# failures over 24 hours and 3 days) from api/events_safe.mjs. Never rows, times, details, members or owner data.
# Strava, Garmin, health and food events show failures only. Tested by tests/events_privacy.mjs.
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "Event kinds, SQL LIKE patterns separated by commas"
        default: "ai_%,race%,garmin%"
permissions:
  contents: read
  actions: write   # only for the last step: delete this workflow's own logs after 7 days
jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd api && npm install --no-save --no-audit --no-fund wrangler@4 >/dev/null
      - name: Point wrangler at the live database
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="hybrid");process.stdout.write(x?x.uuid:"")})')
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$id/" wrangler.toml
      - name: Totals per event type, last 3 days
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KINDS: ${{ inputs.kinds }}
        run: |
          sql=$(node -e 'import("./events_safe.mjs").then(m => process.stdout.write(m.publicEventsSQL(process.env.KINDS)))')
          npx wrangler d1 execute hybrid --remote --json --command "$sql" > "$RUNNER_TEMP/totals.json" 2> /dev/null
          node -e 'import("./events_safe.mjs").then(m => console.log(m.formatPublic(require("fs").readFileSync(process.argv[1], "utf8"))))' "$RUNNER_TEMP/totals.json"
          rm -f "$RUNNER_TEMP/totals.json"
      - name: Keep this workflow's logs for 7 days
        if: always()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          # GitHub has no per-workflow log retention, so this workflow deletes its own older logs (only its own runs).
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          n=0
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/events.yml/runs?per_page=100&created=<$cutoff" -q '.workflow_runs[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id/logs" > /dev/null 2>&1 && n=$((n+1)) || true
          done
          echo "Deleted logs of $n run(s) of this workflow older than 7 days."
