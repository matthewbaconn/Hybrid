name: Member database backup (encrypted, off-server, restore-tested)
# Nov 16 security directive: an off-server copy of the live D1 database that is proven restorable.
# 1. Exports the live database (read-only). 2. Restores it into a throwaway local SQLite database on this runner and checks every
# table's row count matches the live database. 3. Encrypts the dump to Matthew's backup key (age; only the private key
# he holds can open it) and keeps it as a 30-day artifact. Nothing readable is printed or uploaded: the repo is public.
on:
  schedule: [{cron: "23 8 * * *"}]   # 3:23am ET
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/d1-backup.yml"]
permissions:
  contents: read
concurrency: {group: d1-backup, cancel-in-progress: false}
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_RECIPIENT: age1rx77ujsmddlx9xntpeewmry9zyeuhc7mxmaxen24cukay58hvflqad376h   # Matthew's key, made Nov 16 2026; private half in his password manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd api && npm install --no-save --no-audit --no-fund wrangler@4 >/dev/null && sudo apt-get install -y -qq age >/dev/null
      - name: Point wrangler at the live database
        working-directory: api
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="hybrid");process.stdout.write(x?x.uuid:"")})')
          test -n "$id"
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$id/" wrangler.toml
      - name: Export the live database (read-only)
        working-directory: api
        run: |
          umask 077
          npx wrangler d1 export hybrid --remote --output "$RUNNER_TEMP/d1.sql" > /dev/null
          test -s "$RUNNER_TEMP/d1.sql"
          echo "dump bytes: $(wc -c < "$RUNNER_TEMP/d1.sql")"
      - name: Restore into a throwaway local database and compare every table
        working-directory: api
        run: |
          # wrangler's own tables (_cf_*) are recreated by D1 itself; leave them out of the restore
          grep -v -E "^(CREATE TABLE|INSERT INTO) [\"']?_cf_" "$RUNNER_TEMP/d1.sql" > "$RUNNER_TEMP/restore.sql"
          # Restore with plain SQLite (what D1 is built on). Wrangler's local D1 refuses any single statement over
          # 100 KB (SQLITE_TOOBIG), and since Nov 23 the live database has rows whose INSERT is bigger than that, so
          # the old wrangler restore failed even though the dump was complete. Nothing readable is printed: only table
          # names, counts and sizes (public repo).
          python3 - "$RUNNER_TEMP/restore.sql" "$RUNNER_TEMP/restore.sqlite" "$RUNNER_TEMP/local.json" <<'PY'
          import json, re, sqlite3, sys
          sql = open(sys.argv[1], encoding="utf-8").read()
          db = sqlite3.connect(sys.argv[2])
          try:
              db.executescript(sql)
          except Exception as e:
              msg = re.sub(r"[^ ,()]+@[^ ,()]+", "<email>", str(e))
              msg = re.sub(r"'[^']{12,}'", "<value>", msg)[:200]
              print("::error::restore failed: " + type(e).__name__ + ": " + msg)
              sys.exit(1)
          # statements a restore straight back into D1 would refuse (D1's limit is 100,000 bytes per statement)
          big, buf = {}, ""
          for line in sql.splitlines(keepends=True):
              buf += line
              if sqlite3.complete_statement(buf):
                  if len(buf.encode("utf-8")) > 100000:
                      m = re.match(r'\s*INSERT INTO "?([A-Za-z0-9_]+)', buf)
                      t = m.group(1) if m else "?"
                      big[t] = max(big.get(t, 0), len(buf.encode("utf-8")))
                  buf = ""
          for t, n in sorted(big.items()):
              print(f"::warning::{t}: largest row is {n} bytes, over D1's 100 KB statement limit; to restore into D1, insert those rows with bound parameters")
          tables = [r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE '\\_cf%' ESCAPE '\\' AND name NOT LIKE 'sqlite%' ORDER BY name")]
          assert tables, "no tables restored"
          counts = {t: db.execute(f'SELECT COUNT(*) FROM "{t}"').fetchone()[0] for t in tables}
          json.dump(counts, open(sys.argv[3], "w"))
          print(f"restored {len(tables)} tables into plain SQLite")
          PY
          tables=$(node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/local.json"))).join(" "))')
          test -n "$tables"
          q="SELECT "$(for t in $tables; do printf '(SELECT COUNT(*) FROM "%s") AS "%s", ' "$t" "$t"; done | sed 's/, $//')
          npx wrangler d1 execute hybrid --remote --json --command "$q" > "$RUNNER_TEMP/remote.json"
          node -e '
            const fs = require("fs");
            const L = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/local.json"));
            const R = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/remote.json"))[0].results[0];
            let bad = 0;
            for (const t of Object.keys(R)) { const ok = L[t] === R[t]; if (!ok) bad++; console.log((ok ? "ok  " : "DIFF") + " " + t + ": live " + R[t] + ", restored " + L[t]); }
            console.log(bad ? "::error::restore check: " + bad + " table(s) differ" : "restore check: all " + Object.keys(R).length + " tables match");
            process.exit(bad ? 1 : 0);'
          shred -u "$RUNNER_TEMP/restore.sqlite"
      - name: Encrypt to Matthew's backup key and remove the plain copy
        run: |
          stamp=$(date -u +%Y%m%dT%H%MZ)
          # Prove the encrypted file opens to the exact dump: also encrypt to a one-time key made here, decrypt with it,
          # compare checksums, then destroy that key. Matthew's key opens the same file (age: any recipient decrypts).
          age-keygen -o "$RUNNER_TEMP/once.key" 2> /dev/null
          once=$(age-keygen -y "$RUNNER_TEMP/once.key")
          age -r "$BACKUP_RECIPIENT" -r "$once" -o "$RUNNER_TEMP/mileset-d1-$stamp.sql.age" "$RUNNER_TEMP/d1.sql"
          a=$(sha256sum < "$RUNNER_TEMP/d1.sql" | cut -c1-64)
          b=$(age -d -i "$RUNNER_TEMP/once.key" "$RUNNER_TEMP/mileset-d1-$stamp.sql.age" | sha256sum | cut -c1-64)
          shred -u "$RUNNER_TEMP/once.key"
          test "$a" = "$b" && echo "encrypted backup verified: decrypts to the exact dump (sha256 match)"
          shred -u "$RUNNER_TEMP/d1.sql" "$RUNNER_TEMP/restore.sql"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: mileset-d1-${{ env.STAMP }}
          path: ${{ runner.temp }}/mileset-d1-*.sql.age
          retention-days: 30
          if-no-files-found: error
