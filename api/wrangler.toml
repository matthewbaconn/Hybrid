name = "hybrid-api"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true
# milesetapp.com (Nov 21, 2026) and hybrdrunning.com = website, app.milesetapp.com / app.hybrdrunning.com = the app
# (all proxied from GitHub Pages by this Worker; api/domains.mjs decides what moves where). The oldest hybridrunnin.com
# addresses forward too. The milesetapp.com zone must be active in this Cloudflare account before this deploys:
# Cloudflare creates these DNS records itself for custom domains.
routes = [
  { pattern = "milesetapp.com", custom_domain = true },
  { pattern = "www.milesetapp.com", custom_domain = true },
  { pattern = "app.milesetapp.com", custom_domain = true },
  { pattern = "hybridrunnin.com", custom_domain = true },
  { pattern = "www.hybridrunnin.com", custom_domain = true },
  { pattern = "app.hybridrunnin.com", custom_domain = true },
  { pattern = "hybrdrunning.com", custom_domain = true },
  { pattern = "www.hybrdrunning.com", custom_domain = true },
  { pattern = "app.hybrdrunning.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "hybrid"
database_id = "REPLACED_BY_DEPLOY_WORKFLOW"
migrations_dir = "migrations"

# Login/sign-up tries and food reads: 10 per minute per person (approximate, per Cloudflare location)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
APP_URL = "https://app.milesetapp.com/"
# The domain switch (api/domains.mjs). "off": milesetapp.com serves alongside hybrdrunning.com, nothing moves.
# "on" (only after milesetapp.com DNS and Resend are verified): the old website 301s to milesetapp.com, browser tabs move
# to app.milesetapp.com with their login, HQ hops with its key, and email links point at app.milesetapp.com.
MILESET_DOMAIN = "on"
# Vesper's server signing key, PUBLIC half (Ed25519, raw 32 bytes, base64). Checks signed admin actions such as
# "Resend welcome" from HQ. The private half never leaves Vesper's server. Same key as keys/owner.pub in the vesper-relay repo.
VESPER_ADMIN_PUB = "f3dxoMfc47NLascPsXRAnHtjR7W+FUMaEDOTtG74K94="

[triggers]
crons = ["*/15 * * * *"]

