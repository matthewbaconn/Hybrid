<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0F">
<title>Hybrid</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid">
<meta name="description" content="Run and lift plans built around your goals.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout idea: a phone-first training app on a dark canvas. Raised cards, one colour per workout type,
   a floating four-tab bar (Today · Plan · Recovery · Training), and a setup flow that builds the plan. */
:root{
  --bg:#0A0B0F; --surface:#14161C; --sunk:#1E212B; --ink:#F5F6FA; --muted:#9CA3B4; --line:#2A2E3A;
  --accent:#3D7BFF; --accent-2:#3DB8FF; --accent-soft:#122248;
  --easy:#22D3EE; --long:#34D399; --work:#FACC15; --race:#FF4D5E; --lift:#FF6FB5; --rest:#7C8499;
  --good:#34D399; --warn:#FACC15; --crit:#FF5C6C;
  --raise:linear-gradient(180deg,#1A1D26 0%,#13151B 100%);
  --sh:0 1px 0 rgba(255,255,255,.05) inset,0 12px 28px rgba(0,0,0,.38);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip;max-width:100%}
body{margin:0;color:var(--ink);font:15px/1.55 var(--f-body);font-variant-numeric:tabular-nums;
  background:radial-gradient(720px 420px at -10% -8%,rgba(61,123,255,.18),transparent 62%),radial-gradient(680px 420px at 110% -6%,rgba(34,211,238,.12),transparent 62%),var(--bg);background-repeat:no-repeat;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display);letter-spacing:-.02em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px calc(118px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 6px 16px rgba(61,123,255,.4);flex:none}
.logo svg{width:20px;height:20px}
.brand b{font:800 19px/1 var(--f-display);letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font:600 12px/1.2 var(--f-body);background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.demo{background:color-mix(in srgb,var(--work) 16%,transparent);color:var(--work)}
.iconbtn{margin-left:auto;width:40px;height:40px;border-radius:13px;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--ink);flex:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cards */
.card{background:var(--raise);border:1px solid rgba(255,255,255,.07);border-radius:22px;box-shadow:var(--sh);padding:20px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;min-width:0}
.card-h .ic{width:30px;height:30px;padding:7px;border-radius:10px;background:color-mix(in srgb,var(--tone,var(--muted)) 20%,transparent);color:var(--tone,var(--muted))}
.card-h .lbl{font:700 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--tone,var(--muted))}
.card-h .r{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.sec-t{font:700 24px/1.15 var(--f-display);letter-spacing:-.03em}
.sub{color:var(--muted);font-size:14px}

/* greeting */
.hello h1{font:800 30px/1.1 var(--f-display);letter-spacing:-.035em}
.hello .sub{margin-top:6px}
.count{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* session hero */
.t-easy{--tc:var(--easy)} .t-long{--tc:var(--long)} .t-workout{--tc:var(--work)} .t-race{--tc:var(--race)} .t-lift{--tc:var(--lift)} .t-rest{--tc:var(--rest)}
.hero{padding:0;overflow:hidden;gap:0}
.hero-h{padding:22px 20px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 64%,#000) 0%,color-mix(in srgb,var(--tc) 24%,#0A0B0F) 100%);display:flex;align-items:flex-start;gap:12px}
.hero-h .d{font:800 30px/1.05 var(--f-display);letter-spacing:-.035em}
.hero-h .dd{color:rgba(255,255,255,.85);font-size:13px;margin-top:4px}
.hero-h .chip{margin-left:auto;background:rgba(10,11,15,.42);color:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 11px;font:600 12.5px/1.2 var(--f-body);white-space:nowrap;background:color-mix(in srgb,var(--tc,var(--muted)) 20%,transparent);color:var(--tc,var(--ink))}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hero-b{padding:20px;display:grid;gap:16px}
.sess + .sess{border-top:1px solid var(--line);padding-top:18px}
.sess{display:grid;gap:12px}
.sess-t{font:700 21px/1.2 var(--f-display);letter-spacing:-.02em}
.stats{display:flex;flex-wrap:wrap;gap:10px 0}
.stats div{display:flex;flex-direction:column-reverse;gap:2px;padding-right:18px;margin-right:18px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0;margin-right:0;padding-right:0}
.stats b{font:700 21px/1.2 var(--f-display);color:var(--tc,var(--ink));letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:baseline;line-height:1.5}
.steps li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--tc,var(--muted));transform:translateY(-2px)}
.steps b.pc{background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent);color:var(--tc,var(--accent));border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.why{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:14px;padding:12px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--sunk);font-weight:600;color:var(--ink);transition:background-color .15s,opacity .15s,transform .15s}
.btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 6px 18px rgba(61,123,255,.38)}
.btn.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled){background:#272B37}.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#5CC6FF,#5C92FF)}}

/* fuel tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--sunk);border-radius:16px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.tile span{font-size:12.5px;color:var(--muted)}
.tile b{font:800 26px/1.15 var(--f-display);letter-spacing:-.03em}
.tile small{font-size:12px;color:var(--muted)}
.c-cal b{color:var(--accent-2)} .c-pro b{color:var(--lift)} .c-carb b{color:var(--work)} .c-fat b{color:var(--easy)}

/* progress */
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--easy),var(--accent))}

/* mini (tomorrow) */
.mini{display:flex;align-items:center;gap:14px;background:var(--sunk);border-radius:16px;padding:14px 16px;border-left:4px solid var(--tc,var(--rest))}
.mini div{min-width:0}
.mini b{display:block;font-weight:600}
.mini span{font-size:13px;color:var(--muted)}

/* connect */
.connect{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);font-weight:600}
.cbtn i{width:10px;height:10px;border-radius:50%}

/* plan tab */
.weekhead{display:flex;align-items:center;gap:10px}
.weekhead .mid{flex:1;text-align:center;min-width:0}
.weekhead .mid b{display:block;font:700 18px/1.2 var(--f-display)}
.weekhead .mid span{font-size:13px;color:var(--muted)}
.arrow{width:42px;height:42px;border-radius:13px;border:0;background:var(--sunk);font-size:20px;line-height:1;flex:none}
.arrow:disabled{opacity:.35}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sd{border:1px solid transparent;background:var(--sunk);border-radius:14px;padding:9px 0 8px;display:grid;justify-items:center;gap:4px;min-width:0}
.sd span{font:600 11px/1 var(--f-body);color:var(--muted)}
.sd b{font:700 16px/1 var(--f-display)}
.sd i{width:18px;height:4px;border-radius:3px;background:var(--tc,var(--line))}
.sd.now{border-color:var(--ink)}
.sd.on{background:var(--tc,var(--accent));color:#0A0B0F;box-shadow:0 8px 20px color-mix(in srgb,var(--tc,var(--accent)) 42%,transparent)}
.sd.on span,.sd.on b{color:#0A0B0F} .sd.on i{background:rgba(10,11,15,.55)}
.wkstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wkstats div{background:var(--sunk);border-radius:14px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.wkstats span{font-size:12px;color:var(--muted)} .wkstats b{font:800 20px/1.2 var(--f-display)}
.days{display:grid;gap:14px}
.day{padding:0;overflow:hidden;gap:0;scroll-margin-top:16px}
.day.today{box-shadow:0 0 0 1px var(--accent),0 12px 30px rgba(61,123,255,.2)}
.day-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,#14161C),color-mix(in srgb,var(--tc) 7%,#14161C))}
.day-h b{font:700 17px/1.2 var(--f-display);color:var(--tc)}
.day-h span{font-size:13px;color:var(--muted)}
.day-h .chip{margin-left:auto}
.day-b{padding:16px 18px;display:grid;gap:14px}
.day-b .sess-t{font-size:17px}
.day-b .stats b{font-size:17px}
.okmark{display:inline-flex;align-items:center;gap:5px;color:var(--good);font-size:13px;font-weight:600}

/* recovery */
.banner{border-radius:16px;padding:12px 14px;font-size:14px;background:color-mix(in srgb,var(--work) 12%,transparent);border:1px solid color-mix(in srgb,var(--work) 32%,transparent)}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.rg{display:grid;justify-items:center;gap:6px;padding:4px 6px;min-width:0}
.rg + .rg{border-left:1px solid var(--line)}
.rg-w{position:relative;width:min(100%,104px);aspect-ratio:1}
.rg-w svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.rg-w b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px/1 var(--f-display);white-space:nowrap}
.rg > span{font:700 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.rg > small{font-size:12px;color:var(--muted);text-align:center}
.verdict{border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--good) 24%,#14161C),#14161C 75%);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);display:grid;gap:4px}
.verdict b{font:700 19px/1.2 var(--f-display);color:var(--good)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.rules li i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--c)}

/* training */
.preds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.preds div{background:var(--sunk);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.preds span{font-size:12.5px;color:var(--muted)} .preds b{font:800 22px/1.2 var(--f-display);letter-spacing:-.02em}
.preds .goal{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.paces{display:grid;gap:8px}
.pz{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:14px;padding:12px 14px;border-left:4px solid var(--tc)}
.pz div{min-width:0;flex:1} .pz b{display:block;font-weight:600} .pz span{font-size:12.5px;color:var(--muted)}
.pz em{font-style:normal;font:700 16px/1.2 var(--f-display);color:var(--tc);white-space:nowrap}
.chart{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:500 10px var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}

/* tab bar */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px;
  border:1px solid rgba(255,255,255,.09);border-radius:24px;background:#181B23;box-shadow:0 14px 34px rgba(0,0,0,.6);max-width:520px;margin:0 auto}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:5px;padding:9px 2px;border-radius:18px;color:var(--muted);font:600 12px/1 var(--f-body);min-width:0;transition:background-color .15s,color .15s}
.tabbar button .ic{width:19px;height:19px}
.tabbar [data-tab="today"]{--tabc:var(--accent)} .tabbar [data-tab="plan"]{--tabc:var(--easy)} .tabbar [data-tab="recovery"]{--tabc:var(--long)} .tabbar [data-tab="training"]{--tabc:var(--work)}
.tabbar button[aria-current="page"]{background:var(--tabc);color:#0A0B0F}

/* setup */
.setup{display:grid;gap:22px}
.steps-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps-bar i{height:5px;border-radius:999px;background:var(--sunk)}
.steps-bar i.on{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.q{display:grid;gap:8px}
.q > label,.q > .ql{font-weight:600;font-size:15px}
.q .hint{font-size:13px;color:var(--muted);margin-top:-4px}
input,select{width:100%;min-height:48px;border-radius:14px;border:1px solid transparent;background:var(--sunk);padding:0 14px;font-size:16px;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,123,255,.3)}
input::placeholder{color:var(--muted);opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.opt span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--sunk);font-weight:600;border:1px solid transparent;transition:background-color .15s,color .15s}
.opt input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:#BFD3FF}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.opts.days .opt span{min-width:46px;justify-content:center;padding:0 10px}
.err{color:var(--crit);font-size:13.5px;min-height:1em}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.welcome h1{font:800 34px/1.05 var(--f-display);letter-spacing:-.04em}
.welcome .lead{font-size:16px;color:var(--muted);max-width:44ch}
.feat{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.feat li{display:flex;gap:12px;align-items:flex-start}
.feat li i{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.feat li b{display:block} .feat li span{font-size:13.5px;color:var(--muted)}
.building{display:grid;place-items:center;gap:14px;padding:60px 0;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--sunk);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}


/* food log */
.left{display:grid;gap:6px}
.left .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.left .big b{font:800 40px/1 var(--f-display);letter-spacing:-.04em;color:var(--accent-2)}
.left .big b.over{color:var(--crit)}
.left .big span{color:var(--muted);font-weight:500}
.left .bar{height:12px}
.macs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mac{display:grid;gap:6px;min-width:0}
.mac span{font-size:12.5px;color:var(--muted)}
.mac b{font:700 17px/1.2 var(--f-display);color:var(--mc)}
.mac b small{font:500 12px var(--f-body);color:var(--muted)}
.mac .bar{height:7px} .mac .bar i{background:var(--mc)}
.fl{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.fl li{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:14px;padding:10px 8px 10px 14px;min-width:0}
.fl .fi{flex:1;min-width:0}
.fl .fi b{display:block;font-weight:600;overflow-wrap:anywhere}
.fl .fi span{font-size:12.5px;color:var(--muted)}
.fl .fc{font:700 15px/1 var(--f-display);white-space:nowrap}
.fl .x{width:36px;height:36px;border-radius:11px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.mealh{font:700 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.fform{display:grid;gap:10px}
textarea{width:100%;min-height:88px;border-radius:14px;border:1px solid transparent;background:var(--sunk);padding:12px 14px;font-size:16px;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,123,255,.3)}
textarea::placeholder{color:var(--muted);opacity:.8}
.cam{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--sunk);font-weight:600;cursor:pointer;flex:none}
.cam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.cam:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fbtns{display:flex;gap:10px}
.fbtns .btn.primary{flex:1}
.thumb{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:999px;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:15px;line-height:1}
.manual{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.manual .nm{grid-column:1/-1}
.manual input{min-height:44px;padding:0 10px}
.manual label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-2);font-weight:600;justify-self:start}
.fnote{font-size:13px;color:var(--muted)}
.btn[aria-busy="true"]{opacity:.75}


/* check-in, workouts, weight */
.ciq{display:grid;gap:8px}
.ciq > span{font-weight:600;font-size:14px}

/* get app button */

/* install sheet */

.inst{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,#14161C),#14161C 80%);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:22px;padding:18px;display:grid;gap:12px}

@media (max-width:370px){.wrap{padding-inline:14px}.card{padding:16px}.hero-b{padding:16px}.hero-h{padding:18px 16px}.hello h1{font-size:26px}.tile b{font-size:22px}.wkstats b{font-size:17px}}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.preds{grid-template-columns:repeat(4,minmax(0,1fr))}}

<div class="wrap" id="app" aria-live="polite"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections" hidden>
  <button type="button" data-tab="today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg><span>Today</span></button>
  <button type="button" data-tab="plan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Plan</span></button>
  <button type="button" data-tab="recovery"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg><span>Recovery</span></button>
  <button type="button" data-tab="training"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg><span>Training</span></button>
</nav>

<script src="plan.js"></script>
<script>
(function(){
"use strict";
/* ============ helpers (shared plan logic lives in plan.js) ============ */
const {pad, isoLocal, parseD, addDays, daysBetween, dow, mondayOf, DAYS, DAYF, MON, fmtD, r5, half, fmtPace, fmtTime, fmtDigits, parseTime, comma} = HP;
const {RACES, pace} = HP;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = isoLocal(new Date());
const store = { get(){ try { return JSON.parse(localStorage.getItem("hp-demo-v1") || "null"); } catch(e){ return null; } },
                set(v){ try { localStorage.setItem("hp-demo-v1", JSON.stringify(v)); } catch(e){} } };
const buildPlan = p => HP.buildPlan(p, TODAY);

/* ============ state ============ */
const SAMPLE = {name:"Jordan", sample:true, goal:"half", raceDate: addDays(mondayOf(TODAY), 11 * 7 + 6), goalSec: 1 * 3600 + 44 * 60,
  weekly: 20, longest: 8, prDist:"10k", prSec: 48 * 60 + 30, easyPace: null, weight: 178, goalWeight: 172, lifts: 3, liftExp:"Some", days:[1,2,3,5,6], longDay: 6};
/* Backend. API = the deployed Hybrid API (Cloudflare Worker). Empty = no backend yet: the app keeps
   everything in this browser ("local" mode). With a backend: "account" mode saves to the server,
   "sample" mode shows the sample runner without saving anything. */
const API = "https://hybrid-api.hybridapp.workers.dev";
const tokenStore = { get(){ try { return localStorage.getItem("hp-token"); } catch(e){ return null; } },
  set(t){ try { t ? localStorage.setItem("hp-token", t) : localStorage.removeItem("hp-token"); } catch(e){} } };
let token = API ? tokenStore.get() : null, me = null, mode = API ? "none" : "local", loading = !!token, authv = null;
let S = API ? {} : (store.get() || {});
let plan = S.profile ? buildPlan(S.profile) : null;
let tab = "today", wkSel = null, setup = null, toastT = null;
const done = S.done || {};
const food = S.food || {};      // date -> [{id, meal, name, cal, protein, carbs, fat}]
const save = () => { if (mode === "local") store.set({profile: plan ? plan.profile : null, done, food, checkins, weights, acts}); };
const clearObj = o => { for (const k in o) delete o[k]; };
async function api(method, path, data){
  let r;
  try { r = await fetch(API + path, {method, headers: {"Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {})}, body: data === undefined ? undefined : JSON.stringify(data)}); }
  catch(e){ throw new Error("Couldn't reach the server. Check your signal and try again."); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token){ signedOut(); toast(j.error || "Please log in again."); }
  if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
  return j;
}
function loadAccount(j){
  me = j.user; mode = "account"; clearObj(done); clearObj(food);
  (j.done || []).forEach(k => done[k] = 1);
  (j.food || []).forEach(x => (food[x.date] = food[x.date] || []).push(x));
  clearObj(checkins); (j.checkins || []).forEach(c => checkins[c.date] = c);
  clearObj(weights); (j.weights || []).forEach(w => weights[w.date] = w.lb);
  acts = j.activities || []; strava = j.strava || strava;
  reviews = j.reviews || {}; notes = j.notes || []; uset = j.settings || uset; pushInfo = j.push || pushInfo; coachOn = !!j.coach;
  plan = j.profile ? buildPlan(j.profile) : null;
  setup = plan ? null : {step: 0, p: {...blankProfile(), name: (me.name || "").split(" ")[0]}};
}
function signedOut(){ token = null; tokenStore.set(null); me = null; mode = "none"; plan = null; setup = null; authv = null; clearObj(done); clearObj(food); clearObj(checkins); clearObj(weights); acts = []; reviews = {}; notes = []; strava = {available: false, connected: false, name: "", last_sync: null}; render(); }
/* ============ tracking: check-ins, weigh-ins, workouts, Strava ============ */
const checkins = S.checkins || {};          // date -> {sleep_h, sleep_q, soreness, energy, stress}
const weights = S.weights || {};            // date -> lb
let acts = S.acts || [];                    // [{id, source, date, type, name, mi, minutes, cal, avg_hr}]
let strava = {available: false, connected: false, name: "", last_sync: null};
let ci = null, wf = null, aw = {open: false, err: "", busy: false};
let reviews = {}, notes = [], uset = {tz: "America/New_York", morning: "07:00", bedtime: "21:30", n_morning: true, n_run: true, n_weekly: true, n_bed: true}, pushInfo = {key: null, devices: 0}, coachOn = false;
const reviewFor = a => reviews[a.id] || null;
const VCLS = {ok: "good", easy: "easy", hard: "warn", unknown: "muted", extra: "good"};
function reviewHtml(rv){ return '<div class="coach">' + ic("spark") + '<div><b>' + esc(rv.headline) + '</b>' + (rv.numbers ? '<span class="num">' + esc(rv.numbers) + '</span>' : '') + (rv.meaning ? '<p>' + esc(rv.meaning) + '</p>' : '') + (rv.next ? '<p><strong>Next:</strong> ' + esc(rv.next) + '</p>' : '') + '</div></div>'; }
let notePending = false;
const morningNote = () => notes.find(n => n.date === TODAY && n.kind === "morning");   // check-in draft, weigh-in edit, workout form
const actsOn = d => acts.filter(a => a.date === d);
const weightNow = () => { const a = avgWeight(TODAY); return a || (plan && plan.profile.weight) || 170; };
const avgWeight = end => HP.avgW(weights, end);
const {readiness, ADJ} = HP;
const dayMatches = date => plan ? HP.dayMatches(plan, acts, date) : {};
const sessDone = (date, i, m) => !!done[date + "-" + i] || !!(m || dayMatches(date))[i];
const fuelFor = (p, day, date) => HP.fuel(plan, weights, acts, date || TODAY);
let fbCache = null, fbKey = "";
function fb(){ const k = acts.length + "|" + (acts[acts.length - 1] || {}).id + "|" + (plan && plan.start); if (!fbCache || k !== fbKey){ fbKey = k; fbCache = HP.feedback(plan, acts, TODAY); } return fbCache; }

/* persistence: account -> server, local -> this browser, sample -> memory */
async function saveRemote(method, path, data){ if (mode === "account") return api(method, path, data); save(); return {}; }

/* ---------- check-in ---------- */
const CIQ = [
  ["sleep_h", "Hours of sleep", [[4.5, "<5"], [5, "5"], [6, "6"], [7, "7"], [8, "8"], [9, "9+"]]],
  ["sleep_q", "Sleep quality", [[1, "Awful"], [2, "Poor"], [3, "OK"], [4, "Good"], [5, "Great"]]],
  ["soreness", "Muscle soreness", [[1, "None"], [2, "Light"], [3, "Some"], [4, "Sore"], [5, "Very"]]],
  ["energy", "Energy", [[1, "Drained"], [2, "Low"], [3, "OK"], [4, "Good"], [5, "Great"]]],
  ["stress", "Stress", [[1, "Calm"], [2, "Low"], [3, "Some"], [4, "High"], [5, "Very"]]]
];
function checkinCard(){
  const c = checkins[TODAY], r = readiness(c);
  if (c && !ci) return '<section class="card ci-done" style="--tone:var(--' + r.tone + ')"><div class="card-h">' + ic("heart") + '<span class="lbl">Today\'s readiness</span><button class="linkbtn r" type="button" data-act="ciedit">Edit</button></div>' +
    '<div class="ready"><b>' + r.score + '</b><div><strong>' + r.word + '</strong><span>' + c.sleep_h + ' h sleep · ' + ["", "very low", "low", "OK", "good", "great"][c.energy] + ' energy · ' + ["", "no", "light", "some", "sore", "very sore"][c.soreness] + (c.soreness <= 1 ? ' soreness' : ' legs') + '</span></div></div>' +
    (morningNote() ? reviewHtml({headline: morningNote().headline, meaning: (morningNote().lines || []).join(" ")}) : ci === null && coachOn && mode === "account" && notePending ? '<p class="sub">Your coach note is on its way…</p>' : '') + '</section>';
  const d = ci || {};
  return '<section class="card" style="--tone:var(--long)"><div class="card-h">' + ic("heart") + '<span class="lbl">Morning check-in</span><span class="r">20 seconds</span></div>' +
    '<p class="sub" style="margin-top:-6px">How did you sleep and how do you feel? Today\'s session adjusts to your answers.</p>' +
    CIQ.map(([k, label, opts]) => '<div class="ciq"><span>' + label + '</span><div class="cio" role="group" aria-label="' + label + '">' +
      opts.map(([v, l]) => '<button type="button" class="' + (d[k] === v ? 'on' : '') + '" data-act="ciset" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + (d[k] === v) + '">' + l + '</button>').join("") + '</div></div>').join("") +
    '<p class="err" role="alert">' + esc((ci && ci.err) || "") + '</p><button class="btn primary block" type="button" data-act="cisave"' + (ci && ci.busy ? ' disabled aria-busy="true"' : '') + '>' + (ci && ci.busy ? 'Saving…' : 'Save check-in') + '</button></section>';
}

/* ---------- weigh-in ---------- */
function weighCard(){
  const w = weights[TODAY], a = avgWeight(TODAY);
  if (w && !wf) return '<section class="card" style="--tone:var(--lift)"><div class="card-h">' + ic("scale") + '<span class="lbl">Weigh-in</span><button class="linkbtn r" type="button" data-act="wedit">Edit</button></div>' +
    '<div class="wrow"><b>' + w + ' <small>lb</small></b><span>7-day average <strong>' + a.toFixed(1) + ' lb</strong>' + goalLine(a) + '</span></div></section>';
  return '<section class="card" style="--tone:var(--lift)"><div class="card-h">' + ic("scale") + '<span class="lbl">Morning weigh-in</span><span class="r">optional</span></div>' +
    '<div class="wform"><input id="w-lb" inputmode="decimal" placeholder="' + (a ? a.toFixed(1) : "Weight") + '" aria-label="Weight in pounds" value="' + (w || "") + '"><span>lb</span><button class="btn primary" type="button" data-act="wsave">Save</button></div>' +
    '<p class="err" role="alert">' + esc((wf && wf.err) || "") + '</p><p class="sub">Your calorie target uses your 7-day average, so one high or low morning doesn\'t swing it.</p></section>';
}
function goalLine(a){ const g = plan && plan.profile.goalWeight; if (!g || !a) return ''; const d = a - g; return Math.abs(d) < .5 ? ' · at your goal' : ' · ' + Math.abs(d).toFixed(1) + ' lb ' + (d > 0 ? 'to go' : 'under goal'); }

/* ---------- workouts ---------- */
function agoText(iso){ if (!iso) return "never"; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; }
function actLine(a){
  const pace = a.type === "run" && a.mi > 0 && a.minutes > 0 ? fmtPace(a.minutes * 60 / a.mi) + '/mi' : '';
  return [a.mi ? r2(a.mi) + ' mi' : '', a.minutes ? a.minutes + ' min' : '', pace, a.avg_hr ? a.avg_hr + ' bpm' : '', a.cal ? comma(a.cal) + ' cal' : ''].filter(Boolean).join(' · ');
}
const r2 = x => Math.round(x * 100) / 100;
function workoutCard(){
  const list = actsOn(TODAY);
  let h = '<section class="card" style="--tone:var(--easy)"><div class="card-h">' + ic("watch") + '<span class="lbl">Today\'s workouts</span>' +
    (strava.connected ? '<span class="r">Strava · ' + agoText(strava.last_sync) + '</span>' : '') + '</div>';
  h += list.length ? '<ul class="fl">' + list.map(a => '<li class="act t-' + (a.type === "run" ? "easy" : a.type === "lift" ? "lift" : "long") + '"><div class="fi"><b>' + esc(a.name) + '</b><span>' + actLine(a) + '</span></div>' +
      '<span class="src src-' + a.source + '">' + (a.source === "strava" ? 'Strava' : 'Logged') + '</span>' +
      (a.source === "manual" ? '<button class="x" type="button" data-act="adel" data-id="' + esc(a.id) + '" aria-label="Remove ' + esc(a.name) + '">✕</button>' : '') + '</li>').join("") + '</ul>'
    : '<p class="sub">Nothing logged yet today. Finished workouts add calories to today\'s target and check off your plan.</p>';
  if (aw.open){
    h += '<div class="aform"><div class="two"><label>Type<select id="a-type">' + [["run","Run"],["lift","Strength"],["bike","Bike"],["swim","Swim"],["other","Other"]].map(([v, l]) => '<option value="' + v + '">' + l + '</option>').join("") + '</select></label>' +
      '<label>Name<input id="a-name" placeholder="Optional"></label></div>' +
      '<div class="three"><label>Miles<input id="a-mi" inputmode="decimal" placeholder="0"></label><label>Minutes<input id="a-min" inputmode="numeric" placeholder="0"></label><label>Calories<input id="a-cal" inputmode="numeric" placeholder="watch"></label></div>' +
      '<div class="two"><label>Rep pace (/mi)<input id="a-wp" inputmode="numeric" placeholder="workouts"></label><label>Avg heart rate<input id="a-hr" inputmode="numeric" placeholder="optional"></label></div><div class="two"><label>Date<input id="a-date" type="date" max="' + TODAY + '" value="' + TODAY + '"></label><span></span></div>' +

/* Strava sync, same rhythm as Strong at 180: when the app opens, whenever you come back to it
   (at most every 45 s), and every 10 min while it's open. A sync never redraws over something
   you're typing: it waits until you leave the field. */
let syncing = false, pendingRender = false;
function typing(){ const a = document.activeElement; return (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || aw.open || !!$(".back"); }
function safeRender(){ if (typing()){ pendingRender = true; return; } pendingRender = false; captureFood(); render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) safeRender(); }, 150));
async function refreshMe(){
  try { const j = await api("GET", "/api/me"); const before = JSON.stringify([acts, reviews]); acts = j.activities || acts; reviews = j.reviews || reviews; notes = j.notes || notes; strava = j.strava || strava; pushInfo = j.push || pushInfo;
    if (JSON.stringify([acts, reviews]) !== before) safeRender(); } catch(e){}
}
async function stravaSync(quiet){
  if (!strava.connected || syncing) return;
  syncing = true;
  try {
    const j = await api("POST", "/api/strava/sync"), me2 = await api("GET", "/api/me");
    const before = JSON.stringify([acts, reviews]); acts = me2.activities || []; strava = me2.strava || strava; reviews = me2.reviews || reviews; notes = me2.notes || notes;
    if (JSON.stringify([acts, reviews]) !== before || !quiet) safeRender();
    if (j.fresh && coachOn) setTimeout(refreshMe, 6000);
    else { const r = $(".card-h .r"); if (r && /^Strava/.test(r.textContent)) r.textContent = "Strava · " + agoText(strava.last_sync); }
    if (!quiet) toast(j.synced ? "Strava is up to date." : "No new Strava activities.");
  } catch(e){ if (!quiet) toast(e.message); }
  finally { syncing = false; }
}
function stravaReturn(){
  let q; try { q = new URLSearchParams(location.search).get("strava"); } catch(e){ q = null; }
  if (!q) return;
  try { history.replaceState(null, "", location.pathname + "#today"); } catch(e){}
  const msg = {connected: "Strava connected. Pulling in your recent workouts…", limit: "Strava is full for now: this app can connect 10 athletes. Log workouts by hand, and ask Matthew to open more spots.", cancelled: "Strava wasn't connected.",
    expired: "That took too long. Tap Connect Strava again.", noscope: "Strava needs permission to read your activities. Tap Connect Strava and keep that box checked.", failed: "Couldn't connect Strava. Try again in a minute."}[q];

let lastAutoSync = 0;
function autoSync(force){
  if (mode !== "account" || !strava.connected || document.visibilityState === "hidden") return;

setInterval(() => autoSync(true), 10 * 60e3);

/* ---------- charts ---------- */
function barChart(vals, labels, color, goal, fmt, aria){
  const W = 340, H = 130, n = vals.length, gap = n > 10 ? 4 : 8, bw = (W - gap * (n - 1)) / n, max = Math.max(goal || 0, ...vals.map(v => v || 0)) * 1.1 || 1;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">';
  vals.forEach((v, i) => { const x = i * (bw + gap); if (v == null){ s += '<rect x="' + x.toFixed(1) + '" y="' + (H - 20) + '" width="' + bw.toFixed(1) + '" height="2" rx="1" fill="var(--line)"/>'; }
    else { const hh = Math.max(3, v / max * (H - 30)); s += '<rect x="' + x.toFixed(1) + '" y="' + (H - 18 - hh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="' + Math.min(6, bw / 3).toFixed(1) + '" fill="' + (typeof color === "function" ? color(v, i) : color) + '"/>'; }
    if (labels[i]) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(labels[i]) + '</text>'; });
  if (goal){ const y = (H - 18 - goal / max * (H - 30)).toFixed(1); s += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".7"/>'; }
  return s + '</svg>';
}
function lineChart(series, aria){
  // series: [{pts:[[i, v]], color, dash, dots}] over n x-slots; values share one scale
  const W = 340, H = 150, all = series.flatMap(s => s.pts.map(p => p[1])), lo = Math.floor(Math.min(...all) - 1), hi = Math.ceil(Math.max(...all) + 1), n = Math.max(...series.flatMap(s => s.pts.map(p => p[0]))) || 1;
  const X = i => 30 + i / n * (W - 40), Y = v => 10 + (hi - v) / (hi - lo) * (H - 30);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">';
  [lo, Math.round((lo + hi) / 2), hi].forEach(v => s += '<line x1="30" x2="' + W + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)"/><text x="0" y="' + (Y(v) + 3).toFixed(1) + '">' + v + '</text>');
  series.forEach(se => { if (!se.pts.length) return; const d = se.pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
    s += '<path d="' + d + '" fill="none" stroke="' + se.color + '" stroke-width="' + (se.w || 2.4) + '" stroke-linecap="round" stroke-linejoin="round"' + (se.dash ? ' stroke-dasharray="5 5"' : '') + '/>';
    if (se.dots) se.pts.forEach(p => s += '<circle cx="' + X(p[0]).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="2.6" fill="' + se.color + '"/>'); });
  return s + '</svg>';
}

/* ============ food log ============
   Photo and text logging go through the food relay (a small Cloudflare Worker that holds the AI key;
   the key never reaches this page). Only signed-in accounts can use photo reading; otherwise manual entry. */
const aiOn = () => mode === "account";
const MEALS = ["Breakfast","Lunch","Dinner","Snack"];
let fs = {busy:false, photo:null, text:"", meal:null, err:"", manual:false, note:""}, fdate = TODAY;
function mealNow(){ const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 15 ? "Lunch" : h < 21 ? "Dinner" : "Snack"; }
const n0 = x => { x = +x; return isFinite(x) && x >= 0 ? Math.round(x) : 0; };
function eaten(date){ return (food[date] || []).reduce((a, x) => ({cal: a.cal + n0(x.cal), protein: a.protein + n0(x.protein), carbs: a.carbs + n0(x.carbs), fat: a.fat + n0(x.fat)}), {cal:0, protein:0, carbs:0, fat:0}); }
function captureFood(){ const t = document.getElementById("food-text"), m = document.getElementById("food-meal"); if (t) fs.text = t.value; if (m) fs.meal = m.value; }
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't a photo this phone can read.")); i.src = url; });
    const k = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .8);
  } finally { URL.revokeObjectURL(url); }
}
async function askFood(text, photo){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 45000);
  try {
    const body = {text: text || ""};
    if (photo){ body.image = photo.split(",")[1]; body.mediaType = "image/jpeg"; }
    let r;
    try { r = await fetch(API + "/api/food/analyze", {method:"POST", headers:{"Content-Type":"application/json", Authorization: "Bearer " + token}, body: JSON.stringify(body), signal: ctl.signal}); }
    catch(e){ if (e.name === "AbortError") throw e; throw new Error("Couldn't reach the server. Check your signal and try again."); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || (r.status === 429 ? "Too many requests. Wait a minute and try again." : "Couldn't read that right now."));
    const items = (Array.isArray(j.items) ? j.items : []).filter(x => x && x.name).slice(0, 12);
    if (!items.length) throw new Error(j.note || "Couldn't find any food in that. Try a clearer photo or add a few words.");
    return {items, note: j.note || ""};
  } catch(e){ throw e.name === "AbortError" ? new Error("That took too long. Check your signal and try again.") : e; }
  finally { clearTimeout(timer); }
}
async function addFood(meal, items){
  const list = food[fdate] = food[fdate] || [];

  items.forEach((x, i) => list.push({id: Date.now().toString(36) + i, meal, name: String(x.name).slice(0, 80), cal: n0(x.cal), protein: n0(x.protein), carbs: n0(x.carbs), fat: n0(x.fat)}));

function readStep(){
  const st = setup, p = st.p, v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; }, num = id => { const x = parseFloat(v(id)); return isFinite(x) ? x : null; };

    if (document.getElementById("s-easy")){ const t = parseTime(v("s-easy")); if (!t || t < 300 || t > 1200) return "Type your easy pace as numbers, like 1030 for 10:30."; p.easyPace = t; p.prSec = null; p.prDist = "none"; }

function b64uToBytes(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); const raw = atob(s + "===".slice((s.length + 3) % 4)); return Uint8Array.from(raw, c => c.charCodeAt(0)); }

    if (!name || !cal){ fs.err = "Add a food name and its calories."; render(); return; }
    addFood(fs.meal || mealNow(), [{name, cal, protein: n0(v("m-protein")), carbs: n0(v("m-carbs")), fat: n0(v("m-fat"))}])
      .then(() => { fs.err = ""; fs.manual = false; render(); }).catch(e => { fs.err = e.message; render(); });
    return;
  }
  if (act === "fdel"){
    captureFood(); const L = food[fdate] || [], i = L.findIndex(x => x.id === a.dataset.id); if (i < 0) return;
    const [gone] = L.splice(i, 1); save(); render();
    if (mode === "account") api("DELETE", "/api/food/" + gone.id).catch(e => { L.splice(i, 0, gone); render(); toast(e.message); });
    return;
  }
  if (act === "authsignup" || act === "authlogin"){ closeMenu(); authv = {view: act === "authsignup" ? "signup" : "login", email: authv ? authv.email : ""}; render(); window.scrollTo(0, 0); return; }
  if (act === "authback"){ authv = null; render(); return; }
  if (act === "logout"){ closeMenu(); const t = token; api("POST", "/api/logout").catch(() => {}).finally(() => { if (token === t) signedOut(); }); return; }
  if (act === "delacct"){
    if (a.dataset.sure !== "1"){ a.dataset.sure = "1"; a.textContent = "Tap again to delete everything"; return; }
    closeMenu(); api("DELETE", "/api/account").then(() => { signedOut(); toast("Your account and data are deleted."); }).catch(e => toast(e.message)); return;
  }
  if (act === "getapp"){
    if (installEvt){ const e = installEvt; installEvt = null; e.prompt(); e.userChoice.then(c => { if (c.outcome !== "accepted") toast("No problem. Tap Get app any time."); render(); }).catch(() => render()); }
    else openInstall();
    return;
  }
  if (act === "ciset"){ ci = ci || {}; ci[a.dataset.k] = +a.dataset.v; ci.err = ""; render(); return; }
  if (act === "ciedit"){ ci = {...checkins[TODAY]}; render(); return; }
  if (act === "cisave"){
    const d = ci || {}; if (CIQ.some(([k]) => d[k] == null)){ ci = {...d, err: "Answer all five so the plan can adjust."}; render(); return; }
    const c = {date: TODAY, sleep_h: d.sleep_h, sleep_q: d.sleep_q, soreness: d.soreness, energy: d.energy, stress: d.stress};
    ci.busy = true; render();
    notePending = true;
    saveRemote("PUT", "/api/checkin", c).then(j => { notePending = false; if (j && j.note){ notes = notes.filter(n => !(n.date === TODAY && n.kind === "morning")).concat([{date: TODAY, kind: "morning", ...j.note}]); } checkins[TODAY] = c; ci = null; save(); render(); const r = readiness(c); toast(r.word + (r.level ? ". Today's session is adjusted." : ".")); })
      .catch(e => { ci.busy = false; ci.err = e.message; render(); });
    return;
  }
  if (act === "wedit"){ wf = {err: ""}; render(); const el = document.getElementById("w-lb"); if (el) el.focus(); return; }
  if (act === "wsave"){
    const lb = parseFloat(((document.getElementById("w-lb") || {}).value || "").replace(",", "."));
    if (!(lb >= 70 && lb <= 500)){ wf = {err: "Enter your weight in pounds, like 182.4."}; render(); return; }
    saveRemote("PUT", "/api/weight", {date: TODAY, lb}).then(() => { weights[TODAY] = Math.round(lb * 10) / 10; wf = null; save(); render(); }).catch(e => { wf = {err: e.message}; render(); });
    return;
  }
  if (act === "atoggle"){ aw = {open: !aw.open, err: "", busy: false}; render(); return; }
  if (act === "asave"){
    const v = id => ((document.getElementById(id) || {}).value || "").trim(), x = {work_pace: parseTime(v("a-wp")) || 0, type: v("a-type") || "run", name: v("a-name"), mi: parseFloat(v("a-mi")) || 0, minutes: n0(v("a-min")), cal: n0(v("a-cal")), avg_hr: n0(v("a-hr")), date: v("a-date") || TODAY};
    if (!x.mi && !x.minutes){ aw.err = "Add a distance or a time."; render(); return; }
    if (x.date > TODAY){ aw.err = "Pick today or an earlier day."; render(); return; }
    aw.busy = true; render();
    (mode === "account" ? api("POST", "/api/activity", x).then(j => j.activity) : Promise.resolve({...x, id: Date.now().toString(36), source: "manual", name: x.name || ({run: "Run", lift: "Strength", bike: "Ride", swim: "Swim", other: "Workout"})[x.type]}))
      .then(saved => { acts.push(saved); aw = {open: false, err: "", busy: false}; save(); render(); toast("Workout saved."); if (mode === "account" && coachOn) setTimeout(refreshMe, 5000); })
      .catch(e => { aw.busy = false; aw.err = e.message; render(); });
    return;
  }
  if (act === "adel"){
    const i = acts.findIndex(x => x.id === a.dataset.id); if (i < 0) return;
    const [gone] = acts.splice(i, 1); save(); render();
    if (mode === "account") api("DELETE", "/api/activity/" + gone.id).catch(e => { acts.splice(i, 0, gone); render(); toast(e.message); });
    return;
  }
  if (act === "stconnect"){ a.disabled = true; api("POST", "/api/strava/start").then(j => { location.href = j.url; }).catch(e => { a.disabled = false; toast(e.message); }); return; }
  if (act === "stsync"){ toast("Syncing Strava…"); stravaSync(false); return; }
  if (act === "stdisc"){
    if (a.dataset.sure !== "1"){ a.dataset.sure = "1"; a.textContent = "Tap again to disconnect"; return; }
    closeMenu(); api("POST", "/api/strava/disconnect").then(() => { strava.connected = false; acts = acts.filter(x => x.source !== "strava"); render(); toast("Strava disconnected."); }).catch(e => toast(e.message)); return;
  }
  if (act === "fday"){ captureFood(); fdate = addDays(fdate, +a.dataset.dir); if (fdate > TODAY) fdate = TODAY; fs.err = ""; fs.note = ""; render(); return; }
  if (act === "pushon"){ a.disabled = true; a.textContent = "One moment…"; pushOn().then(() => { closeMenu(); openMenu(); toast("Notifications are on."); }).catch(e => { a.disabled = false; a.textContent = "Turn on notifications"; toast(e.message || "Couldn't turn on notifications."); }); return; }
  if (act === "pushtest"){ api("POST", "/api/push/test").then(j => toast(j.sent ? "Test sent. It should arrive in a few seconds." : "Couldn't reach this phone. Turn notifications off and on again.")).catch(e => toast(e.message)); return; }
  if (act === "pushoff"){ navigator.serviceWorker.ready.then(reg => reg.pushManager.getSubscription()).then(sub => sub ? api("POST", "/api/push/unsubscribe", {endpoint: sub.endpoint}).then(() => sub.unsubscribe()) : null)
      .then(() => { pushState.on = false; closeMenu(); openMenu(); toast("Notifications are off on this phone."); }).catch(e => toast(e.message)); return; }
  if (act === "gotoday"){ setTab("today", true); return; }
  if (act === "menu"){ openMenu(); return; }
  if (act === "close"){ closeMenu(); return; }
  if (act === "edit"){ closeMenu(); const p = plan.profile.sample ? blankProfile() : {...plan.profile}; delete p.sample; delete p.start; setup = {step: 0, p}; render(); window.scrollTo(0, 0); return; }
  if (act === "reset"){ closeMenu(); plan = null; for (const k in done) delete done[k]; for (const k in food) delete food[k]; store.set(null); setup = {step: -1, p: blankProfile()}; render(); window.scrollTo(0, 0); return; }
});
document.addEventListener("input", ev => {
  if (!["s-goal", "s-pr", "s-easy", "a-wp"].includes(ev.target.id)) return;
  const el = ev.target, f = fmtDigits(el.value);
  if (el.value !== f) el.value = f;
});
document.addEventListener("change", ev => {
  const sk = ev.target.dataset && ev.target.dataset.set;
  if (sk && mode === "account"){ const v = ev.target.type === "checkbox" ? ev.target.checked : ev.target.value; api("PUT", "/api/settings", {[sk]: v}).then(j => { uset = j.settings || uset; }).catch(e => toast(e.message)); return; }
  if (ev.target.id === "food-photo"){
    const file = ev.target.files && ev.target.files[0]; if (!file) return;
    captureFood();
    shrink(file).then(d => { fs.photo = d; fs.err = ""; render(); }).catch(e => { fs.err = e.message; render(); });
    return;
  }
  if (ev.target.id === "food-meal"){ fs.meal = ev.target.value; return; }
  if (!setup) return;
  const n = ev.target.name;
  if (n === "goal" || n === "prDist"){ readStepSoft(); render(); }
  if (n === "days"){ readStepSoft(); render(); }
});
function readStepSoft(){ const keep = setup.err; readStep(); setup.err = keep && ""; }
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeMenu(); });
document.addEventListener("submit", ev => { if (ev.target.id === "authform"){ ev.preventDefault(); if (!authv.busy) submitAuth(); } });
window.addEventListener("hashchange", () => { if (!setup && plan) setTab(location.hash.slice(1), true); });

tab = ["today","plan","recovery","training"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
render();
if (token) api("GET", "/api/me").then(j => { loadAccount(j); loading = false; render(); stravaReturn(); autoSync(true); })
  .catch(e => { loading = false; if (token){ mode = "none"; plan = null; } render(); toast(e.message); });
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
