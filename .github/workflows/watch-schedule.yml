name: Watch the 15-minute schedule

# Diagnostic: follows the API's live log for 17 minutes and reports what the scheduled run did.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: Follow the live log
        run: |
          timeout 1020 npx wrangler tail hybrid-api --format json > tail.json 2> tail.err || true
          echo "events: $(grep -c '"outcome"' tail.json || true)"
          node -e '
            const lines=require("fs").readFileSync("tail.json","utf8").split(/\n(?=\{)/).filter(Boolean);
            let n=0; for (const l of lines){ let j; try{ j=JSON.parse(l) }catch(e){ continue }
              const ev=j.event||{}; const kind=ev.cron?"scheduled "+ev.cron:(ev.request?ev.request.method+" "+new URL(ev.request.url).pathname:"other");
              console.log(new Date(j.eventTimestamp).toISOString(), kind, "outcome="+j.outcome, (j.exceptions||[]).map(x=>x.name+": "+x.message).join(" | "), (j.logs||[]).map(x=>x.message.join(" ")).join(" | ").slice(0,400)); n++; }
            console.log(n+" events");'
          tail -5 tail.err
