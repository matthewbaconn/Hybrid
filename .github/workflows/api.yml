name: Deploy API

# Deploys api/ (Cloudflare Worker + D1 database). Needs three repository secrets:
#   CLOUDFLARE_API_TOKEN   ("Edit Cloudflare Workers" template + Account → D1 → Edit)
#   CLOUDFLARE_ACCOUNT_ID
#   ANTHROPIC_API_KEY      (console.anthropic.com; set a monthly spend limit there)
# Optional, for Connect Strava: STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET (strava.com/settings/api;
# set its Authorization Callback Domain to hybrid-api.hybridapp.workers.dev)
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$K" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund wrangler@4

      - name: Find or create the database
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="hybrid");process.stdout.write(x?x.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create hybrid
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="hybrid");process.stdout.write(x?x.uuid:"")})')
          fi
          [ -n "$id" ] || { echo "::error::Couldn't find or create the D1 database. Does the API token include Account → D1 → Edit?"; exit 1; }
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$id/" wrangler.toml

      - name: Update database tables
        run: npx wrangler d1 migrations apply hybrid --remote

      - name: Deploy
        run: |
          set -o pipefail
          for try in 1 2 3; do
            if npx wrangler deploy 2>&1 | tee deploy.log; then break; fi
            [ "$try" = 3 ] && { echo "::error::Deploy failed 3 times; see the log above."; exit 1; }
            echo "Retrying in 15 s…"; sleep 15
          done
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_ENV"

      - name: Save the AI key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY

      - name: Save the Strava keys (optional)
        env:
          SID: ${{ secrets.STRAVA_CLIENT_ID }}
          SSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          if [ -z "$SID" ] || [ -z "$SSEC" ]; then echo "::warning::Strava keys not added yet (STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET). Connect Strava stays off."; exit 0; fi
          printf '%s' "$SID" | npx wrangler secret put STRAVA_CLIENT_ID
          printf '%s' "$SSEC" | npx wrangler secret put STRAVA_CLIENT_SECRET

      - name: Notification keys (made once, kept on Cloudflare)
        run: |
          have=$(npx wrangler secret list 2>/dev/null || true)
          if echo "$have" | grep -q VAPID_PRIVATE; then echo "Notification keys already set."; exit 0; fi
          node -e 'crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign"]).then(async k=>{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k.publicKey));const j=await crypto.subtle.exportKey("jwk",k.privateKey);require("fs").writeFileSync("pub.txt",Buffer.from(raw).toString("base64url"));require("fs").writeFileSync("priv.txt",j.d)})'
          npx wrangler secret put VAPID_PUBLIC < pub.txt
          npx wrangler secret put VAPID_PRIVATE < priv.txt
          rm -f pub.txt priv.txt
          echo "::notice::Made new notification keys."

      - name: Register for Strava activity notices (webhook)
        env:
          SID: ${{ secrets.STRAVA_CLIENT_ID }}
          SSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          if [ -z "$SID" ] || [ -z "$SSEC" ] || [ -z "$url" ]; then echo "Strava keys not set; skipping."; exit 0; fi
          cb="$url/api/strava/webhook"
          subs=$(curl -sS "https://www.strava.com/api/v3/push_subscriptions?client_id=$SID&client_secret=$SSEC")
          if echo "$subs" | grep -q "$cb"; then echo "::notice::Strava notices already registered."; exit 0; fi
          if echo "$subs" | grep -q '"id"'; then echo "::warning::This Strava app already sends notices somewhere else: $subs"; exit 0; fi
          tok=$(node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))')
          printf '%s' "$tok" | npx wrangler secret put STRAVA_VERIFY
          sleep 10
          r=$(curl -sS -X POST https://www.strava.com/api/v3/push_subscriptions -F client_id="$SID" -F client_secret="$SSEC" -F callback_url="$cb" -F verify_token="$tok")
          if echo "$r" | grep -q '"id"'; then echo "::notice::Strava will now notify Hybrid of new activities."; else echo "::warning::Strava notice registration failed: $r (runs still sync when the app opens and hourly)"; fi

      - name: Check the API answers
        run: |
          [ -n "$url" ] || { echo "::error::Deploy didn't report a workers.dev address. Is the workers.dev subdomain set up in Cloudflare (Workers & Pages)?"; exit 1; }
          for i in $(seq 1 12); do
            if curl -fsS "$url/api/health" | grep -q '"ok":true'; then echo "::notice::API live at $url"; exit 0; fi
            sleep 10
          done
          echo "::error::$url/api/health didn't answer"; exit 1
