/* height, weight, age, sex and daily activity: used for the resting burn (BMR) and daily calories */
function bodyFields(p, pre){
  const ft = p.heightIn ? Math.floor(p.heightIn / 12) : "", inch = p.heightIn ? Math.round((p.heightIn - ft * 12) * 10) / 10 : "", ev = p.goal === "everyday", bg = p.bodyGoal;
  const showGoal = !ev || bg !== "maintain";
  return '<h3 class="sub-t">Your body</h3><div class="two"><div class="q"><label for="' + pre + '-ft">Height</label><div class="hgt"><span class="unit"><input id="' + pre + '-ft" inputmode="numeric" placeholder="5" value="' + ft + '"> ft</span><span class="unit"><input id="' + pre + '-in" inputmode="decimal" placeholder="10" value="' + inch + '"> in</span></div></div>' +
    '<div class="q"><label for="' + pre + '-age">Age</label><input id="' + pre + '-age" inputmode="numeric" placeholder="30" value="' + (p.age ?? '') + '"></div></div>' +
    '<div class="two"><div class="q"><label for="' + pre + '-w">Weight (lb)</label><input id="' + pre + '-w" inputmode="decimal" placeholder="180" value="' + (p.weight ?? '') + '"></div>' +
    (showGoal ? '<div class="q"><label for="' + pre + '-gw">Goal weight (lb)</label><input id="' + pre + '-gw" inputmode="decimal" placeholder="' + (ev && bg === "lose" ? 'Needed' : 'Optional') + '" value="' + (p.goalWeight ?? '') + '"></div>' : '<div></div>') + '</div>' +
    '<div class="q"><span class="ql">Sex</span><p class="hint">Used in the resting-calorie formula. Female athletes can also turn on cycle-aware training (it stays on your phone).</p>' + optList(pre + "sex", [["m","Male"],["f","Female"],["x","Prefer not to say"]], p.sex || "") + '</div>' +
    '<div class="q"><span class="ql">Outside of workouts, your day is…</span>' + optList(pre + "daily", [["sit","Mostly sitting"],["some","On my feet some"],["feet","On my feet most of the day"]], p.daily || "some") + '</div>' +
    '<p class="hint">Mileset works out your resting burn (BMR) from your height, weight, age and sex, adds your daily activity and workouts, then sets food targets for your goal.</p>';
}
function readBody(p, pre, optional){
  const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; }, num = id => { const x = parseFloat(v(id)); return isFinite(x) ? x : null; };
  const radio = n => { const e = document.querySelector('input[name="' + n + '"]:checked'); return e ? e.value : null; };
  const ft = num(pre + "-ft"), inch = num(pre + "-in") || 0, w = num(pre + "-w"), age = num(pre + "-age"), gwEl = document.getElementById(pre + "-gw"), gw = gwEl ? num(pre + "-gw") : null;
  const ev = p.goal === "everyday", bg = p.bodyGoal;
  if (optional && ft == null && age == null){   // older profiles: height and age not given, keep the simple calorie estimate
    if (!(w >= 80 && w <= 500)) return "Enter your weight in pounds.";
    if (gw != null && !(gw >= 80 && gw <= 500)) return "Enter a goal weight in pounds, or leave it empty.";
    if (gw != null && gw < w * .8) return "For a goal more than 20% below your current weight, please work with a doctor or registered dietitian. Mileset won't set targets for it.";
    p.weight = Math.round(w * 10) / 10; p.goalWeight = gw == null ? null : Math.round(gw * 10) / 10; p.sex = radio(pre + "sex") || p.sex; p.daily = radio(pre + "daily") || p.daily; return "";
  }
  if (!(ft >= 4 && ft <= 7) || inch < 0 || inch >= 12) return "Enter your height in feet and inches.";
  const h = ft * 12 + inch; if (h < 54 || h > 90) return "Enter your height in feet and inches.";
  if (!(w >= 80 && w <= 500)) return "Enter your weight in pounds.";
  if (!(age >= 18 && age <= 100)) return "Mileset is for adults 18 and older. Enter your age.";
  p.heightIn = h; p.weight = Math.round(w * 10) / 10; p.age = Math.round(age); p.sex = radio(pre + "sex") || p.sex || "x"; p.daily = radio(pre + "daily") || p.daily || "some";
  p.goalWeight = gw;
  if (ev && bg === "lose" && gw == null) return "Add a goal weight so Mileset can set your targets.";
  if (ev && bg === "lose" && gw >= w) return "For losing weight, the goal should be below your current weight.";
  if (ev && bg === "gain" && gw != null && gw <= w) return "For gaining, the goal should be above your current weight, or leave it empty.";
  if (ev && bg === "maintain") p.goalWeight = null;
  if (gw != null && !(gw >= 80 && gw <= 500)) return "Enter a goal weight in pounds, or leave it empty.";
  if (gw != null && gw < w * .8) return "For a goal more than 20% below your current weight, please work with a doctor or registered dietitian. Pick a goal closer to your current weight.";
  const minW = Math.ceil(18.5 * h * h / 703);
  if (gw != null && gw < w && gw < minW) return "That goal is under a healthy weight for your height. Mileset won't set targets below " + minW + " lb.";
  return "";
}
